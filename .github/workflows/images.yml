name: Images
on:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
  packages: write
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false
jobs:
  image:
    if: github.repository == 'sankofa-media/dormer'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Fixed file timestamps (2026-01-01 UTC, as hack/deploy.sh used) keep
      # layer digests stable when the art does not change.
      SOURCE_DATE_EPOCH: '1767225600'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/sankofa-media/dormer
          flavor: latest=false
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.title=Dormer
            org.opencontainers.image.source=https://github.com/sankofa-media/dormer
            org.opencontainers.image.licenses=Apache-2.0
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            SITE_URL=https://dormer.sankofa.workshop.aenix.io
          outputs: type=image,push=true,rewrite-timestamp=true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
