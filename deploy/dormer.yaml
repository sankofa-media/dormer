apiVersion: v1
kind: Namespace
metadata:
  name: dormer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dormer
  namespace: dormer
  labels: {app.kubernetes.io/name: dormer}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: dormer}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: dormer}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 101, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: dormer
          image: DORMER_IMAGE
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /healthz, port: http}}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 20}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Service
metadata:
  name: dormer
  namespace: dormer
spec:
  selector: {app.kubernetes.io/name: dormer}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dormer
  namespace: dormer
  annotations:
    # Same ClusterIssuer as the Sankofa museum ingress.
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: nginx
  tls:
    - hosts: [DORMER_HOST]
      secretName: dormer-tls
  rules:
    - host: DORMER_HOST
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: dormer, port: {name: http}}}}
