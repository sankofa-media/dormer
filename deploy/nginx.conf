server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    charset utf-8;
    charset_types text/css text/plain text/xml application/javascript application/json application/xml application/atom+xml application/manifest+json;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain text/xml application/xml application/atom+xml application/manifest+json application/wasm;

    # Fixed layer timestamps must never make changed HTML appear unchanged.
    etag off;
    if_modified_since off;
    add_header Cache-Control "no-cache";

    location ~ \.html$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    # Media names are stable across releases; periodically re-fetch them.
    location /media/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
    }
    location ~ \.webmanifest$ {
        types { }
        default_type application/manifest+json;
        try_files $uri =404;
    }
    location ~ \.(xml|atom)$ {
        types { application/xml xml; application/atom+xml atom; }
        try_files $uri =404;
    }
    location ~ \.txt$ {
        types { }
        default_type text/plain;
        try_files $uri =404;
    }
    # Pagefind .pf_* files are compressed binary data decoded by its client.
    # Loader names stay stable, so revalidate the entire search bundle.
    location /pagefind/ {
        types {
            application/javascript js;
            text/css css;
            application/json json;
            application/wasm wasm;
            application/octet-stream pf_meta pf_index pf_fragment;
        }
        default_type application/octet-stream;
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ =404;
    }
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
