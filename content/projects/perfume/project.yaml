    {
     "type": "text",
     "text": {
      "ru": "**Burning Barbershop** · D.S. & Durga\n\nD.S. & Durga рассказывают историю о пожаре 1891 года в барбершопе, где сгорели все тоники после бритья и нашли одну обугленную бутылку. Аромат — классический мужской фужер с лавандой и мятой, который будто закоптили горелым маслом. Из всех пожаров этот самый носибельный. Год выпуска источники называют разный.",
      "en": "**Burning Barbershop** · D.S. & Durga\n\nD.S. & Durga tell of an 1891 fire in a barbershop where every shaving tonic burned and one charred bottle was found. The fragrance is a classic men's fougère of lavender and mint, smoked as if with burnt oil. Of all the fires, this is the most wearable one. Sources disagree on its release year."
