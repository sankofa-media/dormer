    {
     "type": "text",
     "text": {
      "ru": "**Series 3 Incense: Avignon** · Comme des Garçons · 2002\n\nБертран Дюшофур поставил в центр олибанум и смолу элеми, добавил ромашку и ладанник и подал всё это холодно, с альдегидами, почти без сладости. Получилась католическая месса в старой каменной церкви. Для любителей ладана это обязательный пункт, с которого всё начинается.",
      "en": "**Series 3 Incense: Avignon** · Comme des Garçons · 2002\n\nBertrand Duchaufour centred it on frankincense and elemi resin, added chamomile and cistus, and served it cold, with aldehydes and almost no sweetness. The result is a Catholic mass in an old stone church. For incense lovers it is the obligatory starting point."
     },
