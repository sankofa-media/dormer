      "ru": "**Sécrétions Magnifiques** · Etat Libre d'Orange · 2006\n\nГлавный шок-парфюм нишевой индустрии и вечный мем на форумах. Антуан Ли по замыслу основателя марки Этьена де Сварта собрал аккорды крови (металлические ноты), молока, адреналина и йодистого моря и обещал запах крови, пота, спермы и слюны. Марка формулирует правило так: притяжение и отвращение, любовь или ненависть с первого вдоха. Сайт Ça Fleure Bon при этом причисляет его к современным шедеврам.",
      "en": "**Sécrétions Magnifiques** · Etat Libre d'Orange · 2006\n\nThe niche industry's great shock perfume and an eternal forum meme. Antoine Lie, working to a brief from the brand's founder Etienne de Swardt, assembled accords of blood (metallic notes), milk, adrenaline and iodine sea, and promised the smell of blood, sweat, semen and saliva. The brand's rule is attraction and repulsion — love or hate at first sight. Ça Fleure Bon nevertheless counts it among modern masterpieces."
