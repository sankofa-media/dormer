     "text": {
      "ru": "Вещества, которые образуются, когда бактерии разлагают белок. Именно они дают запах трупа и гнили. В парфюмерии их не используют никогда.",
      "en": "Substances formed when bacteria break down protein. They give the smell of corpses and rot. Perfumery never uses them."
