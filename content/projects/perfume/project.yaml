    {
     "type": "text",
     "text": {
      "ru": "**Series 3 Incense: Zagorsk** · Comme des Garçons · 2002\n\nРусскому читателю этот аромат ближе остальных: Загорском при советской власти назывался Сергиев Посад с его лаврой. Эвелин Буланже, а не Дюшофур, как часто пишут, соединила белый ладан с сосной, берёзой, фиалкой и ирисом. Дым здесь почти холодный, как в храме зимой, когда за дверью мороз.",
      "en": "**Series 3 Incense: Zagorsk** · Comme des Garçons · 2002\n\nThis one speaks to Russian readers most: under Soviet rule Sergiyev Posad, with its great monastery, was called Zagorsk. Evelyne Boulanger, not Duchaufour as is often written, combined white incense with pine, birch, violet and iris. The smoke here is almost cold, like a church in winter with frost outside the door."
