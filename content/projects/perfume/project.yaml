    {
     "type": "text",
     "text": {
      "ru": "**Series 3 Incense: Kyoto** · Comme des Garçons · 2002\n\nВторое паломничество серии ведёт в японский храм. Тот же Дюшофур взял сухой ладан, кипарис, тик, ветивер и неожиданно немного кофе. Здесь нет цветов и нет тепла, только дерево, дым и тишина.",
      "en": "**Series 3 Incense: Kyoto** · Comme des Garçons · 2002\n\nThe series' second pilgrimage leads to a Japanese temple. The same Duchaufour used dry incense, cypress, teak, vetiver and, unexpectedly, a little coffee. There are no flowers and no warmth here, only wood, smoke and silence."
