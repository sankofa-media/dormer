     "type": "text",
     "text": {
      "ru": "**Terre d'Hermès** · Hermès · 2006\n\nЖан-Клод Эллена, тогда штатный парфюмер Hermès, сложил этот аромат из горьких цитрусов без капли сахара, перца, ветивера и кедра, а в середину поставил минеральный аккорд, похожий на нагретый солнцем кремень. Hermès рассказывает о нём как об истории отношений человека с землёй. Получилось сухо и горько, но так спокойно и солидно, что Terre стал одним из самых продаваемых мужских ароматов своего класса и в 2007 году получил премию FiFi.",
      "en": "**Terre d'Hermès** · Hermès · 2006\n\nJean-Claude Ellena, then Hermès's in-house perfumer, built it from sugar-free bitter citrus, pepper, vetiver and cedar, with a mineral accord in the middle that recalls flint warmed by the sun. Hermès tells it as a story of man and earth. The result is dry and bitter yet so calm and respectable that Terre became one of the best-selling men's fragrances of its class and won a FiFi award in 2007."
