      "ru": "**Black Afgano** · Nasomatto · 2009\n\nГуальтьери шесть лет добивался этого аромата и написал о нём прямо: он должен напоминать гашиш самого лучшего качества. Тёмный густой дым смол, ладана, уда, кофе и табака в концентрации духов держится на коже до следующего дня. Это культовая вещь и одна из самых известных в нишевом мире.",
      "en": "**Black Afgano** · Nasomatto · 2009\n\nGualtieri spent six years on this fragrance and wrote of it plainly: it aims to evoke the best quality of hashish. A dark, dense smoke of resins, incense, oud, coffee and tobacco at extrait strength lasts on skin until the next day. It is a cult object and one of the best-known scents in the niche world."
