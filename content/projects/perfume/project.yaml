    {
     "type": "text",
     "text": {
      "ru": "**Стоматология № 3, 1987 год** · придумано редакцией\n\nРайонная стоматология позднего Советского Союза. Эвгенол, запах гвоздичного масла, которым пахнут все зубные кабинеты мира, жжёная кость под бормашиной без охлаждения, хлорка в коридоре и запах страха, который Сиссель Толас могла бы снять с вашей детской рубашки.",
      "en": "**Dental Clinic No. 3, 1987** · invented by the editors\n\nA local dental clinic in the late Soviet Union. Eugenol, the clove-oil smell of every dentist's office in the world, bone burning under an uncooled drill, bleach in the corridor and the smell of fear that Sissel Tolaas could have collected from your childhood shirt."
