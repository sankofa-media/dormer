      "en": "**Odeur 10** · Comme des Garçons · 2024\n\nFor the thirtieth anniversary of its perfume line, Comme des Garçons released what it calls a chemical composition of clean. Aldehydes, minty notes and musks add up to the smell of hydrogen peroxide and sterile gauze. This is the first rung where a fragrance stops trying to be liked."
