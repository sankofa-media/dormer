  "alt": {
   "ru": "Флакон Comme des Garçons Odeur 53",
   "en": "The Comme des Garçons Odeur 53 bottle"
  },
  "size": "column"
 },
 "chapters": [
  {
   "id": "question",
   "name": {
    "ru": "Вопрос",
    "en": "The question"
   },
   "heat": 0.0,
   "blocks": [
    {
     "type": "text",
     "text": {
      "ru": "*Мне не нравятся сладкие ароматы. Нравится что-то более горькое или солоноватое, что-то не самое попсовое, может, даже индастриал какой-то.*",
      "en": "*I don’t like sweet fragrances. I like something more bitter or salty, not too mainstream, maybe even something industrial.*"
     }
    },
    {
     "type": "text",
     "text": {
      "ru": "С этого вопроса началась наша прогулка. Мы ответили на него, а потом спросили себя: хорошо, но ведь есть что-то ещё более необычное, совсем нишевое, может, даже неприятное? И задавали этот вопрос снова и снова, двадцать раз подряд. Каждый ответ стал ступенью, и на каждой ступени стоят несколько настоящих ароматов, которые можно купить, или работ художников, которые можно увидеть в музее.\n\nЛестница начинается в универмаге, с горьких и солёных мужских ароматов, которые продаются в любом дьюти-фри, проходит через ладан, дым, кожу, асфальт и офисную технику, спускается к звериным выделениям, поту, крови и смерти и заканчивается там, где запах становится искусством о насилии. На последней, двадцать первой ступени мы придумали несколько ароматов сами.\n\nКарта ниже показывает всю дорогу сразу: слева сладкое и безопасное, справа то, что лучше не нюхать. Под каждым ароматом две оценки от нуля до десяти: насколько он попсовый и насколько он жёсткий. Нажмите на любой флакон, чтобы перейти к его ступени, или просто листайте вниз, и вы заметите, как вместе со ступенями меняется цвет страницы.",
      "en": "Our walk began with this question. We answered it, then asked ourselves: fine, but isn’t there something even more unusual, truly niche, maybe even unpleasant? And we asked it again and again, twenty times in a row. Each answer became a step, and on each step stand several real fragrances you can buy, or artists’ works you can see in a museum.\n\nThe ladder starts in the department store, with bitter and salty men’s fragrances sold in any duty-free, passes through incense, smoke, leather, asphalt and office machines, descends to animal secretions, sweat, blood and death, and ends where smell becomes art about violence. On the last, twenty-first step we invented a few fragrances of our own.\n\nThe map below shows the whole road at once: on the left, the sweet and safe; on the right, what you had better not smell. Each fragrance has two scores from zero to ten: how mainstream it is and how extreme. Click any bottle to jump to its step, or just scroll down and watch the page change colour as you descend."
     }
    },
