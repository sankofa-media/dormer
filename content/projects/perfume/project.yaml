      "ru": "**Series 6 Synthetic: Garage** · Comme des Garçons · 2004\n\nСледы керосина, ветивер и кедр — так официально описан этот гараж. Мари-Од Кутюр сделала запах места, где кто-то по выходным возится со старой машиной или мастерит полку. Бренд называет всю серию новаторской антипарфюмерией, которая выходит за пределы привычных ароматов.",
      "en": "**Series 6 Synthetic: Garage** · Comme des Garçons · 2004\n\nTraces of kerosene, vetiver and cedar — that is the official description of this garage. Marie-Aude Couture made the smell of a place where someone spends weekends tinkering with an old car or building a shelf. The brand calls the whole series groundbreaking anti-perfumes that go beyond traditional fragrance."
