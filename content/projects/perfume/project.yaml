     "type": "text",
     "text": {
      "ru": "Хорошо, тогда сырая кожа, грубая, звериная и даже немного садомазохистская. Кожаный запах в парфюмерии делают из берёзового дёгтя и особых синтетических молекул, и здесь их не прячут.",
      "en": "Fine: raw leather, rough, animal, even a little sadomasochistic. Leather in perfumery is made from birch tar and special synthetic molecules, and here they are not hidden."
     }
    },
    {
     "type": "aside",
     "title": {
      "ru": "Берёзовый дёготь",
      "en": "Берёзовый дёготь"
     },
     "text": {
      "ru": "Тёмная смола, которую получают, нагревая берёзовую кору без доступа воздуха. Ею раньше пропитывали кожу, чтобы она не гнила, отсюда и знаменитый «запах русской кожи». В парфюмерии он даёт дым, кожу и асфальт.",
      "en": "A dark tar made by heating birch bark without air. It was once used to treat leather against rot — hence the famous ‘Russian leather’ smell. In perfumery it gives smoke, leather and asphalt."
     }
