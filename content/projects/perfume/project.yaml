   "heat": 0.41,
   "blocks": [
    {
     "type": "text",
     "text": {
      "ru": "*Всё это ещё природа: дым, кожа, земля. А индастриал, о котором я спрашивал в самом начале?*",
      "en": "*All that is still nature: smoke, leather, earth. What about the industrial I asked about at the start?*"
     }
    },
    {
     "type": "text",
     "text": {
      "ru": "Вот он. В 1998–2004 годах Comme des Garçons выпустили ароматы, которые сами назвали антипарфюмерией и «социально некорректными» запахами. Их источник — не цветы, а места и вещи, созданные человеком: дорога, гараж, офис.",
      "en": "Here it is. Between 1998 and 2004 Comme des Garçons released fragrances they themselves called anti-perfumes and ‘socially incorrect’ smells. Their source is not flowers but man-made places and things: the road, the garage, the office."
     }
    },
    {
     "type": "photo",
     "src": "08-a-cdg-series-6-tar.jpg",
     "alt": {
      "ru": "Флакон Series 6 Synthetic: Tar",
      "en": "The Series 6 Synthetic: Tar bottle"
     },
     "caption": {
      "ru": "Series 6 Synthetic: Tar, Comme des Garçons",
      "en": "Series 6 Synthetic: Tar, Comme des Garçons"
     },
     "credit": "Официальное фото: Comme des Garçons",
     "source_url": "https://comme-des-garcons-parfum.com/products/series-6-synthetic-tar",
     "size": "right",
     "treatment": "print"
    },
    {
     "type": "text",
     "text": {
      "ru": "**Series 6 Synthetic: Tar** · Comme des Garçons · 2004\n\nЭто буквально запах дорожных работ: горячий асфальт, пары битума, бытовой газ, а для разнообразия ещё и «жареные сигареты», как пишет сам бренд. Натали Фейстауэр добавила к этому бергамот, и дёготь вдруг кажется свежим. В 2017 году аромат вернули в продажу в коллекции старых работ марки.",
      "en": "**Series 6 Synthetic: Tar** · Comme des Garçons · 2004\n\nLiterally the smell of roadworks: hot tar, bitumen fumes, town gas and, for variety, ‘grilled cigarettes’, as the brand itself says. Nathalie Feisthauer added bergamot, and the tar suddenly feels fresh. In 2017 it was reissued in the brand's library of old works."
     },
