     "text": {
      "ru": "Тёмная смола, которую получают, нагревая берёзовую кору без доступа воздуха. Ею раньше пропитывали кожу, чтобы она не гнила, отсюда и знаменитый «запах русской кожи». В парфюмерии он даёт дым, кожу и асфальт.",
      "en": "A dark tar made by heating birch bark without air. It was once used to treat leather against rot — hence the famous ‘Russian leather’ smell. In perfumery it gives smoke, leather and asphalt."
