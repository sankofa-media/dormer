    {
     "type": "text",
     "text": {
      "ru": "Под землёй пахнет сыростью, известняком, грибами и животными, которые там живут. На этой ступени ароматы впервые становятся по-настоящему неуютными, хотя ещё ничего отвратительного в них нет.",
      "en": "Underground smells of damp, limestone, mushrooms and the animals that live there. On this step fragrances become truly uncomfortable for the first time, though nothing in them is disgusting yet."
     }
