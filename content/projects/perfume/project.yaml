     "type": "text",
     "text": {
      "ru": "*Кровь в Sécrétions была только аккордом среди прочих. А аромат, где кровь — главная тема?*",
      "en": "*In Sécrétions blood was just one accord among others. What about a fragrance where blood is the whole point?*"
