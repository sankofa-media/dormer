      "ru": "**Micodelirio** · Nasomatto · 2026\n\nНовинка весны 2026 года. Название складывается из «мико-», то есть грибов, и «делирио», бреда. Гуальтьери пишет о естественном жизненном бреде и процветающей экосистеме органического непослушания. Состав не раскрыт, и о грибах мы судим по названию и промо-снимкам, но лесная подстилка здесь явно главная.",
