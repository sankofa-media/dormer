    {
     "type": "text",
     "text": {
      "ru": "**This Is Not A Pipe** · Demeter Fragrance Library\n\nНазвание отсылает к картине Магритта, на которой нарисована трубка и написано, что это не трубка. Demeter шутит в том же духе: это не трубка, просто пахнет трубкой. Трубочный табак и тёплое дерево — самый мирный аромат на этой ступени.",
      "en": "**This Is Not A Pipe** · Demeter Fragrance Library\n\nThe name refers to Magritte's painting of a pipe captioned ‘this is not a pipe’. Demeter jokes in the same spirit: it is not a pipe, it just smells like one. Pipe tobacco and warm wood — the most peaceful fragrance on this step."
