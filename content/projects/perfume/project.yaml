      "ru": "**Megamare** · Orto Parisi · 2019\n\nАлессандро Гуальтьери, автор марок Nasomatto и Orto Parisi, известен тем, что не боится передозировок. Megamare — это огромная волна морских синтетических нот и амбровых молекул в концентрации духов. Одним она кажется морем, другим гниющими на берегу водорослями, и спорить об этом можно бесконечно. Сам Гуальтьери пишет, что цельность моря не нуждается в объяснениях.",
      "en": "**Megamare** · Orto Parisi · 2019\n\nAlessandro Gualtieri, the man behind Nasomatto and Orto Parisi, is known for his fearless overdoses. Megamare is a huge wave of marine synthetics and amber molecules at extrait strength. To some it is the sea, to others rotting seaweed on a beach, and the argument can go on forever. Gualtieri himself writes that the wholeness of the sea needs no explanation."
