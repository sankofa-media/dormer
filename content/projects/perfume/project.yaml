      "ru": "**La Fin du Monde** · Etat Libre d'Orange · 2015\n\nEtat Libre d'Orange рассуждает так: конец света мы уже много раз пережили в кино, но остался один вопрос — как он будет пахнуть? Ответ: попкорном, чёрным перцем, жареным кунжутом, кумином и аккордом пороха. Похоже на кинозал, в котором что-то взорвалось.",
      "en": "**La Fin du Monde** · Etat Libre d'Orange · 2015\n\nEtat Libre d'Orange reasons that we have survived the apocalypse many times at the cinema, but one question remains: how will it smell? The answer: popcorn, black pepper, toasted sesame, cumin and a gunpowder accord. Like a movie theatre in which something exploded."
