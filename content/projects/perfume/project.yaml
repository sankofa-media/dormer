     "type": "text",
     "text": {
      "ru": "**Molecule 01** · Escentric Molecules · 2006\n\nГеза Шён налил во флакон чистый Iso E Super и продал его как духи. Многие признаются, что сами себя почти не чувствуют, а окружающие спрашивают, чем от них так приятно пахнет. По словам Шёна, это аромат для человека, которому немного наскучили ароматы. Сам бренд пишет о ста процентах молекулы, некоторые продавцы — о шестидесяти пяти.",
      "en": "**Molecule 01** · Escentric Molecules · 2006\n\nGeza Schoen poured pure Iso E Super into a bottle and sold it as perfume. Many wearers admit they can barely smell themselves while others ask what smells so good. In Schoen's words, it is for the individual who might be a bit bored with fragrance. The brand claims one hundred per cent molecule; some retailers say sixty-five."
