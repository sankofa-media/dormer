     "type": "text",
     "text": {
      "ru": "Дальше магазинов нет. На этой ступени запах становится искусством, и материалом для него служит человеческое тело: пот страха, чужой запах, смерть. Купить это нельзя, можно только оказаться в зале музея.",
      "en": "There are no shops beyond this point. On this step smell becomes art, and its material is the human body: the sweat of fear, a stranger's odour, death. You cannot buy it; you can only find yourself in a museum gallery."
