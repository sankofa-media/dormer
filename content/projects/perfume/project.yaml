      "ru": "**Zombie for Him** · Demeter Fragrance Library · 2013\n\nВесной 2013 года Demeter выпустил пару «зомби» — для него и для неё. Мужская версия пахнет лесной подстилкой: сухие листья, грибы, плесень, мох и земля. Марка обещает ароматы, с которыми мертвецы будут проходить мимо, не обижаясь. Покупают его к Хэллоуину и любители фильмов ужасов.",
