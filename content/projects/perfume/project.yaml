      "ru": "**Cardinal** · Heeley · 2006\n\nДжеймс Хили описывает свой ладанный аромат так: юный безупречный священник. Олибанум и ладанник здесь соединены с чистым бельевым аккордом, и получается не церковный дым, а свежевыглаженная сутана. Это ладан для тех, кому мрачные церкви кажутся слишком театральными.",
      "en": "**Cardinal** · Heeley · 2006\n\nJames Heeley describes his incense fragrance as an immaculate young priest. Frankincense and cistus are joined to a clean laundry accord, so the result is not church smoke but a freshly ironed cassock. Incense for those who find dark churches too theatrical."
