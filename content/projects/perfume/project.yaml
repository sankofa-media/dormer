    {
     "type": "text",
     "text": {
      "ru": "В 2011 году итальянцы Антонио Дзуддас и Джованни Кастелли показали марку Blood Concept: четыре унисекс-аромата по группам крови, разлитые в аптечные пузырьки с пипеткой. Во всех четырёх одна и та же металлическая база, которая изображает кровь, а сверху у каждой группы свой характер. Марка обещала мистический ритуал без единого цветка. Сегодня её сайт не открывается, и, похоже, она ушла с рынка, так что флаконы мы показываем по снимкам из архива Fragrantica.",
      "en": "In 2011 the Italians Antonio Zuddas and Giovanni Castelli unveiled Blood Concept: four unisex fragrances by blood type, filled into pharmacy bottles with droppers. All four share the same metallic base standing for blood, with a different character on top for each type. The brand promised a mystic ritual with no flowers to be found. Its website no longer opens and it seems to have left the market, so we show the bottles from Fragrantica’s archive shots."
