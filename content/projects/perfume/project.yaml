    {
     "type": "text",
     "text": {
      "ru": "**Muscs Koublaï Khän** · Serge Lutens · 1998\n\nСерж Лютанс рассказывает, что для китайского императора расстилали драгоценные меха, и он ступал по ним прямо в грязных сапогах. Кристофер Шелдрейк передал эту картину мускусом, циветом, кастореумом, кумином и костусом, корнем, который пахнет немытыми волосами. Блог Kafkaesque назвал рецензию «Животный магнетизм». Продаётся он только в самых престижных магазинах марки.",
      "en": "**Muscs Koublaï Khän** · Serge Lutens · 1998\n\nSerge Lutens tells how precious furs were spread for the Emperor of China to tread on, muddy boots and all. Christopher Sheldrake rendered that picture with musk, civet, castoreum, cumin and costus, a root that smells of unwashed hair. Kafkaesque titled its review ‘Animal Magnetism’. It is sold only in the brand's most prestigious outlets."
