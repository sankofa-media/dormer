      "ru": "**Not a Perfume** · Juliette Has a Gun · 2010\n\nРомано Риччи, потомок Нины Риччи, сделал то же самое с другой молекулой, Cetalox, синтетической заменой серой амбры. Получилась тёплая чистая кожа, чуть древесная. Бренд говорит о единственном ингредиенте и продаёт аромат как подходящий даже аллергикам, и на Sephora он давно хит.",
      "en": "**Not a Perfume** · Juliette Has a Gun · 2010\n\nRomano Ricci, a descendant of Nina Ricci, did the same with another molecule, Cetalox, a synthetic substitute for ambergris. The result is warm clean skin, a little woody. The brand speaks of a single ingredient and sells it as suitable even for allergy sufferers; at Sephora it has long been a hit."
