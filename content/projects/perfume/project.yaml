     "text": {
      "ru": "**Dirt** · Demeter Fragrance Library · 1996\n\nОдин из трёх первых ароматов Demeter, вместе с «Травой» и «Помидором», которые в 1996 году начали продавать в нью-йоркском универмаге Henri Bendel. Его сделали, чтобы он пах точь-в-точь как земля на полях вокруг семейной фермы в Пенсильвании: вспаханная почва и прошлогодние кукурузные стебли. Пожалуй, самый известный странный аромат Америки.",
      "en": "**Dirt** · Demeter Fragrance Library · 1996\n\nOne of Demeter's first three fragrances, with Grass and Tomato, which went on sale at New York's Henri Bendel department store in 1996. It was made to smell exactly like the dirt of the fields around a family farm in Pennsylvania: turned soil and last year's cornstalks. Probably America's best-known strange fragrance."
