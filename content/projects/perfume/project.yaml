   "heat": 0.9,
   "blocks": [
    {
     "type": "text",
     "text": {
      "ru": "*Это всё равно товары для витрины. А там, где запах перестаёт быть товаром?*",
      "en": "*These are still shop-window goods. What about where smell stops being a product?*"
     }
    },
    {
     "type": "text",
     "text": {
      "ru": "Дальше магазинов нет. На этой ступени запах становится искусством, и материалом для него служит человеческое тело: пот страха, чужой запах, смерть. Купить это нельзя, можно только оказаться в зале музея.",
      "en": "There are no shops beyond this point. On this step smell becomes art, and its material is the human body: the sweat of fear, a stranger's odour, death. You cannot buy it; you can only find yourself in a museum gallery."
     }
    },
    {
     "type": "text",
     "text": {
      "ru": "**The FEAR of Smell — the Smell of FEAR** · Сиссель Толас · 2005/2006\n\nНорвежская художница Сиссель Толас живёт в Берлине и собрала архив из семи тысяч запахов в герметичных банках. Для этой работы мужчины с острыми фобиями прикладывали ватные тампоны к подмышкам в момент страха. Молекулы их пота синтезировали заново, заключили в микрокапсулы и нанесли на стены, и запах высвобождался, когда зритель касался стены. Толас говорит, что на современном Западе запах привыкли воспринимать только эстетически. Сколько было доноров и где работу показали впервые, источники расходятся: в Тиране в 2005 году или в Массачусетском технологическом в 2006-м.",
      "en": "**The FEAR of Smell — the Smell of FEAR** · Sissel Tolaas · 2005/2006\n\nThe Norwegian artist Sissel Tolaas lives in Berlin and has built an archive of seven thousand smells in sealed jars. For this work, men with acute phobias pressed cotton pads to their armpits at the moment of fear. The molecules of their sweat were resynthesised, microencapsulated and applied to the walls, releasing the smell when a visitor touched them. Tolaas says that in the modern West we tend to think of smell in purely aesthetic terms. Sources disagree on the number of donors and on where it was first shown: Tirana in 2005 or MIT in 2006."
     },
