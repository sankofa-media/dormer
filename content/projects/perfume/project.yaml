  "ru": "Горче горького",
  "en": "Bitterer than Bitter"
 },
 "dek": {
  "ru": "Двадцать один шаг от Terre d’Hermès до запаха морга: мужские и унисекс-ароматы, которые с каждым шагом всё меньше хотят нравиться",
  "en": "Twenty-one steps from Terre d’Hermès to the smell of a morgue: men’s and unisex fragrances that want to please less with every step"
 },
 "date": "2026-11-26",
