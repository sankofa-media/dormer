    {
     "type": "text",
     "text": {
      "ru": "**The Smell of a Stranger** · Петер де Купер · 2015\n\nБельгиец Петер де Купер — один из самых деятельных художников, работающих с запахом. Для Гаванской биеннале 2015 года он показал растения, которые будто бы «перепрограммировали» пахнуть спермой, потом, кровью, трупами, деньгами, порохом и загрязнённым воздухом. Его вопрос: что будет, когда генная инженерия запаха станет обыденностью и цветок у вас на подоконнике начнёт пахнуть мертвецом.",
      "en": "**The Smell of a Stranger** · Peter de Cupere · 2015\n\nThe Belgian Peter de Cupere is one of the most active artists working with smell. For the 2015 Havana Biennial he showed plants supposedly ‘reprogrammed’ to smell of sperm, sweat, blood, dead bodies, money, gunpowder and polluted air. His question: what happens when the genetic engineering of smell becomes ordinary and the flower on your windowsill starts to smell of a corpse."
