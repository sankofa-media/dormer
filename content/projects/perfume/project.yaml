      "en": "Civet is the secretion of the scent glands of the civet, a small cat-like carnivore; castoreum comes from beaver glands. In small doses they give perfume warmth and sensuality; in large ones they smell of beast and even faeces. Synthetic substitutes are now used almost everywhere."
     }
