    },
    {
     "type": "text",
     "text": {
      "ru": "**Бабушкин сундук после потопа** · придумано редакцией\n\nСундук, в котором полвека лежали пальто, письма и пуховые платки, а потом соседи сверху устроили потоп. Нафталин, мокрая шерсть, раскисшая бумага, плесень и сладкий запах гниющего дерева. Пожалуй, самый грустный аромат в нашей выдуманной коллекции.",
      "en": "**Grandmother's Trunk After the Flood** · invented by the editors\n\nA trunk where coats, letters and down shawls lay for half a century until the upstairs neighbours flooded the flat. Mothballs, wet wool, sodden paper, mould and the sweet smell of rotting wood. Perhaps the saddest fragrance in our invented collection."
     }
