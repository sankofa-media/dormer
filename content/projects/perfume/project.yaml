  {
   "id": "step-20",
   "kicker": {
    "ru": "Ступень 20",
    "en": "Step 20"
   },
   "name": {
    "ru": "Смерть в воздухе",
    "en": "Death in the air"
   },
   "heat": 1.0,
   "blocks": [
    {
     "type": "text",
     "text": {
      "ru": "*Ниже, кажется, уже некуда. Или есть?*",
      "en": "*It seems there is nowhere lower. Or is there?*"
     }
    },
    {
     "type": "text",
     "text": {
      "ru": "Есть, и здесь мы перестаём шутить. Мексиканская художница Тереза Марголес по образованию судебный патологоанатом, и в 1990 году она основала коллектив SEMEFO, названный по аббревиатуре мексиканской судебно-медицинской службы. Её работы посвящены жертвам насилия в Мексике, о которых общество предпочитает не знать, и самые страшные из них почти ничем не пахнут.",
      "en": "There is, and here we stop joking. The Mexican artist Teresa Margolles trained as a forensic pathologist, and in 1990 she founded the collective SEMEFO, named after the acronym of Mexico's forensic service. Her work is about the victims of violence in Mexico whom society prefers not to know about, and the most terrible pieces smell of almost nothing."
     }
    },
    {
     "type": "text",
     "text": {
      "ru": "**Vaporización** · Тереза Марголес · 2001\n\nЗритель входит в зал, наполненный туманом. Сначала ему не говорят, чем он дышит, и только надпись на стене объясняет: туман сделан из воды, которой в центральном морге Мехико обмывали тела погибших, предварительно обеззараженной. Запаха почти нет, и в этом весь ужас: жесть не в носу, а в знании, что эта вода оседает на вашей коже и попадает в лёгкие. Работу датируют 2000 или 2001 годом, а в 2002-м её показали в нью-йоркском MoMA PS1.",
      "en": "**Vaporización** · Teresa Margolles · 2001\n\nThe visitor enters a room filled with mist. At first they are not told what they are breathing; only a text on the wall explains that the mist is made from water used to wash the bodies of the dead in Mexico City's central morgue, disinfected beforehand. There is almost no smell, and that is the horror: the extremity is not in the nose but in knowing that this water settles on your skin and enters your lungs. The work is dated 2000 or 2001; in 2002 it was shown at MoMA PS1 in New York."
     },
     "sources": [
      {
       "title": "Hyperallergic — Teresa Margolles and the violence we breathe",
       "url": "https://hyperallergic.com/teresa-margolles-and-the-violence-we-breathe/"
      },
      {
       "title": "Venti Journal — Death in the Air",
       "url": "https://www.venti-journal.com/julia-banwell"
