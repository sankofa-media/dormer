   "heat": 0.19,
   "blocks": [
    {
     "type": "text",
     "text": {
      "ru": "*Море понятно. А что-нибудь посуше, без воды вообще, но тоже без сахара?*",
      "en": "*The sea, fine. Something drier, no water at all, but still no sugar?*"
