     "text": {
      "ru": "**Encre Noire** · Lalique · 2006\n\nЧёрный флакон и запах чернил, мокрого камня и сырой земли. Натали Лорсон взяла сразу два ветивера, бурбонский и гаитянский, и почти ничего не дала им в утешение: ни ванили, ни сладкой базы. Lalique называет это самой утончённой мужской нотой, а любители нишевой парфюмерии — лучшим ветивером за небольшие деньги.",
      "en": "**Encre Noire** · Lalique · 2006\n\nA black bottle and the smell of ink, wet stone and damp earth. Nathalie Lorson used two vetivers at once, Bourbon and Haitian, and gave them almost no comfort: no vanilla, no sweet base. Lalique calls it the most sophisticated masculine note; niche enthusiasts call it the best cheap vetiver there is."
