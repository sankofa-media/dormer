        "en": "Olivia Giacobetti composed it in 1999 to greet the new millennium and named it after a small Paris alley near the brand's old headquarters. A white lily is joined to a dry, pale incense, and what results is not a grand service but an empty church in the morning. Some call it a clean, spiritual masterpiece, others find it too quiet."
