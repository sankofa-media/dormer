     "type": "text",
     "text": {
      "ru": "**Funeral Home** · Demeter Fragrance Library\n\nСначала аромат задумывали как «Цветочную выставку»: лилии, гвоздики, гладиолусы и хризантемы со стеблями, немного красного дерева и восточного ковра. Но основатель Demeter Кристофер Гейбл понюхал его и воскликнул, что так пахли похороны его деда, и аромат назвали «Похоронным бюро». Пахнет он вполне прилично, вся жесть в ассоциации.",
      "en": "**Funeral Home** · Demeter Fragrance Library\n\nIt was first conceived as ‘Flower Show’: lilies, carnations, gladioli and chrysanthemums with their stems, a touch of mahogany and an oriental rug. But Demeter's founder Christopher Gable smelled it and exclaimed that it smelled like his grandfather's funeral, and it was named Funeral Home. It smells perfectly decent; all the horror is in the association."
