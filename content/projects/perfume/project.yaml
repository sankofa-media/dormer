       }
      }
     ]
    },
    {
     "type": "text",
     "text": {
      "ru": "**Холодильник после отпуска** · придумано редакцией\n\nВы уехали на три недели, а электричество отключили на второй день. Открывающая нота — скисшее молоко, которое уже не жидкость. Сердце — рыба, купленная к вашему возвращению. База — что-то в дальнем контейнере, которое когда-то было салатом. Флакон продаётся в комплекте с противогазом.",
      "en": "**The Fridge After Holiday** · invented by the editors\n\nYou left for three weeks and the power went off on day two. The opening note is sour milk that is no longer a liquid. The heart is the fish bought for your return. The base is something in a far-back container that was once a salad. The bottle comes bundled with a gas mask."
     }
