     "text": {
      "ru": "**Кадаверин и путресцин** · лабораторные реактивы\n\nЭто точка ноль всей лестницы: сами молекулы, из которых складывается трупный и гнилостный запах. Их продают химические дистрибьюторы как аналитические стандарты для лабораторий. Ни один парфюмер в здравом уме не добавит их в духи.",
      "en": "**Cadaverine and putrescine** · laboratory reagents\n\nThis is the zero point of the whole ladder: the very molecules that make up the smell of corpses and rot. Chemical distributors sell them as analytical standards for laboratories. No perfumer in their right mind would put them in a perfume."
