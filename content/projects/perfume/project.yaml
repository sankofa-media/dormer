   "id": "step-12",
   "kicker": {
    "ru": "Ступень 12",
    "en": "Step 12"
   },
   "name": {
    "ru": "Звериная классика",
    "en": "The animal classics"
   },
   "heat": 0.61,
   "blocks": [
    {
     "type": "text",
     "text": {
      "ru": "*Земля и пещеры — это ещё прилично. А звери? Не ароматы о зверях, а сами звери.*",
      "en": "*Earth and caves are still decent. What about animals — not fragrances about animals, but animals themselves?*"
     }
    },
    {
     "type": "text",
     "text": {
      "ru": "Тут нужно сказать неудобное: звериные запахи в парфюмерии были всегда, и долгое время их брали у настоящих животных. Сегодня их почти везде заменили синтетикой, но эффект остался прежним — тёплая немытая кожа, шерсть, мускус. Самое удивительное, что один из таких ароматов был мейнстримом восьмидесятых.",
      "en": "Here an uncomfortable truth: animal smells have always been part of perfumery, and for a long time they were taken from real animals. Today they are almost everywhere replaced by synthetics, but the effect is the same: warm unwashed skin, fur, musk. The surprise is that one such fragrance was eighties mainstream."
     }
    },
    {
     "type": "aside",
     "title": {
      "ru": "Цивет и кастореум",
      "en": "Цивет и кастореум"
     },
     "text": {
      "ru": "Цивет — выделения пахучих желёз циветты, небольшого хищника, похожего на кошку; кастореум — выделения желёз бобра. В малых дозах они дают духам тепло и чувственность, в больших пахнут зверем и даже фекалиями. Сейчас почти всегда используются их синтетические заменители.",
      "en": "Civet is the secretion of the scent glands of the civet, a small cat-like carnivore; castoreum comes from beaver glands. In small doses they give perfume warmth and sensuality; in large ones they smell of beast and even faeces. Synthetic substitutes are now used almost everywhere."
     }
    },
