    {
     "type": "text",
     "text": {
      "ru": "**Immigrant Caucus** · Аника Йи · 2017\n\nВ 2017 году в нью-йоркском Музее Гуггенхайма Аника Йи показала выставку «Жизнь дешева». Вместе с парфюмерами компании MANE она создала гибрид запаха муравьёв и запаха американок азиатского происхождения и распыляла его из баллонов, похожих на те, которыми травят насекомых. Рядом жила колония из десяти тысяч муравьёв. Так художница ответила на ксенофобский образ азиатского сообщества как вторгающейся силы.",
      "en": "**Immigrant Caucus** · Anicka Yi · 2017\n\nIn 2017 at New York's Guggenheim, Anicka Yi showed the exhibition Life Is Cheap. With perfumers from MANE she created a hybrid of the smell of ants and the smell of Asian-American women, sprayed from canisters like those used by exterminators. Next to it lived a colony of ten thousand ants. It was the artist's answer to the xenophobic image of the Asian community as an invading force."
     },
