      "en": "**Stercus** · Orto Parisi · 2014\n\nStercus is Latin for dung, the boldest name on the whole ladder. It smells gentler than it sounds: almond and heliotrope, with spicy wood, resins, earth and an animal base beneath. Gualtieri writes that Stercus never lies: there is a secret sweetness that attracts and an animalic side that offends."
