      "ru": "**Wood Sage & Sea Salt** · Jo Malone London · 2014\n\nСамый безопасный солёный аромат в мире и один из бестселлеров Jo Malone. Кристин Нажель, как пишут блогеры, вдохновлялась прогулкой по английскому побережью: сухой шалфей, морская соль, минеральные ноты и амбретта, растительный мускус из семян. Это последний аромат, который она сделала для бренда, прежде чем уйти в Hermès.",
      "en": "**Wood Sage & Sea Salt** · Jo Malone London · 2014\n\nThe world's safest salty fragrance and one of Jo Malone's bestsellers. Christine Nagel, bloggers say, was inspired by a walk on the English coast: dry sage, sea salt, mineral notes and ambrette, a plant musk from seeds. It was her last fragrance for the brand before she moved to Hermès."
     },
