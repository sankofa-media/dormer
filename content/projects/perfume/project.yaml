     "size": "right",
     "treatment": "print"
    },
    {
     "type": "text",
     "text": {
      "ru": "**Turpentine** · Demeter Fragrance Library\n\nЭто скипидар, растворитель из мастерской художника, и ничего больше. Demeter описывает его как пахучую мазь для плохих картин и добавляет: «Эй, людям нравится!» Продаётся он дёшево, в маленьком спрее, и его покупают художники и любители розыгрышей.",
      "en": "**Turpentine** · Demeter Fragrance Library\n\nIt is turpentine, the solvent of an artist's studio, and nothing else. Demeter calls it ‘that odorous ointment for bad paintings’ and adds: ‘Hey, people like it!’ It is sold cheaply in a small spray and bought by artists and pranksters."
