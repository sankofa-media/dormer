    {
     "type": "text",
     "text": {
      "ru": "Тогда воздух, металл и взрыв. Здесь собраны ароматы абстрактных и опасных вещей: кислорода, лака для ногтей, космического вакуума и пороха. Это уже не духи, а скорее заявления.",
      "en": "Then air, metal and explosion. Here are fragrances of abstract and dangerous things: oxygen, nail polish, the vacuum of space, gunpowder. These are no longer perfumes but statements."
     }
