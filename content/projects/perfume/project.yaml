      "ru": "Можно. Есть ароматы из одного-единственного синтетического вещества. Пахнут они мягко, зато сама идея уже концептуальная: это не духи, а молекула, которую вам продают как духи.",
      "en": "We can. There are fragrances made of a single synthetic substance. They smell gentle, but the idea itself is already conceptual: not a perfume but a molecule sold to you as one."
