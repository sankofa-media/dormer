    {
     "type": "text",
     "text": {
      "ru": "**Kouros** · Yves Saint Laurent · 1981\n\nYves Saint Laurent продавал его под слоганом «аромат богов», и в восьмидесятые его носили миллионы мужчин. Пьер Бурдон соединил мыльные альдегиды и полынь с мёдом, кожей и циветом, поэтому Kouros одновременно пахнет чистотой и чем-то очень грязным. Блог Now Smell This назвал рецензию на него «Грязный мальчик».",
      "en": "**Kouros** · Yves Saint Laurent · 1981\n\nYves Saint Laurent sold it as ‘the scent of the gods’, and in the eighties millions of men wore it. Pierre Bourdon combined soapy aldehydes and wormwood with honey, leather and civet, so Kouros smells at once of cleanliness and of something very dirty. Now Smell This titled its review ‘Dirty Boy’."
