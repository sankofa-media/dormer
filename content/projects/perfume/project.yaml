     "type": "text",
     "text": {
      "ru": "**Bat** · Zoologist · 2016/2020\n\nПервую версию сделала Эллен Кови, нейробиолог и профессор Вашингтонского университета, которая всю жизнь изучала летучих мышей. Она хотела передать прохладную сырую известняковую пещеру, где они живут. Аромат начинается с гуавы и маракуйи, которыми мыши питаются, а потом уходит в мокрый камень, корни и мускус шерсти. Первая версия получила премию Art and Olfaction в 2016 году, а нынешнюю, 2020 года, сделал Прин Ломрос.",
      "en": "**Bat** · Zoologist · 2016/2020\n\nThe first version was made by Ellen Covey, a neurobiologist and professor at the University of Washington who studied bats all her life. She wanted to capture the cool, damp limestone cave where they live. It opens with guava and passion fruit, the bats' food, then sinks into wet stone, roots and the musk of fur. The original won an Art and Olfaction Award in 2016; the current 2020 version is by Prin Lomros."
