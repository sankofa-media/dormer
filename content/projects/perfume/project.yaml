      "ru": "**Exit the King** · Etat Libre d'Orange · 2019\n\nНазвание отсылает к пьесе Ионеско «Король умирает», а марка называет его духами, чтобы мечтать об энтропии. Но во флаконе нет никакой смерти: мыльная пена, жасмин, роза, ландыш, пачули и мох складываются в старомодный цветочный шипр. Мы поставили его сюда нарочно, как предупреждение: смерть в названии ещё не значит смерть во флаконе.",
      "en": "**Exit the King** · Etat Libre d'Orange · 2019\n\nThe name refers to Ionesco's play Exit the King, and the brand calls it a perfume to dream about entropy. But there is no death in the bottle: soap suds, jasmine, rose, lily of the valley, patchouli and moss make an old-fashioned floral chypre. We placed it here on purpose as a warning: death in the name does not mean death in the bottle."
