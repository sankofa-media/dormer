     "type": "text",
     "text": {
      "ru": "**Eau de Space** · Eau de Space · 2020\n\nАстронавты, вернувшись со станции, рассказывали, что их скафандры пахнут горячим металлом, жареным стейком, сварочными парами и порохом. По словам создателей, химик Стив Пирс воссоздал этот запах ещё в 2008 году для подготовки астронавтов, а в 2020-м его выпустили для всех через Kickstarter. Связь с NASA известна только со слов самих создателей и прессы.",
      "en": "**Eau de Space** · Eau de Space · 2020\n\nAstronauts back from the station said their suits smelled of hot metal, seared steak, welding fumes and gunpowder. According to the creators, chemist Steve Pearce recreated that smell in 2008 for astronaut training, and in 2020 it was released to everyone via Kickstarter. The NASA connection is known only from the creators themselves and the press."
