     ]
    },
    {
     "type": "text",
     "text": {
      "ru": "**Все двадцать ступеней** · придумано редакцией\n\nПоследний аромат — это вся наша лестница в одном флаконе: асфальт Tar, окаменевшая моча Hyrax, секреции Sécrétions Magnifiques, кровь Blood Concept, похоронные лилии и запах страха, а сверху для приличия капля Terre d'Hermès. Парфюмеры называют такие вещи передозировкой. Мы называем это честным ответом на вопрос, с которого всё началось.",
      "en": "**All Twenty Steps** · invented by the editors\n\nThe last fragrance is our whole ladder in one bottle: Tar's asphalt, Hyrax's fossilised urine, the secretions of Sécrétions Magnifiques, Blood Concept's blood, funeral lilies and the smell of fear, topped for decency with a drop of Terre d'Hermès. Perfumers call such things an overdose. We call it an honest answer to the question we started with."
     }
    },
