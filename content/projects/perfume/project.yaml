    {
     "type": "text",
     "text": {
      "ru": "**A City on Fire** · Imaginary Authors · 2014\n\nМарка из Портленда придумывает к каждому аромату несуществующую книгу. Этот будто бы пахнет мрачным графическим романом о двух мастерах спичечного дела, ставших свидетелями убийства. В нём горелые спички, дым и обугленное дерево, а утешительной ванили, которой обычно смягчают дымные ароматы, нет совсем.",
      "en": "**A City on Fire** · Imaginary Authors · 2014\n\nThe Portland brand invents a non-existent book for each fragrance. This one supposedly smells of a dark graphic novel about two match makers who witness a murder. It has burnt matches, smoke and charred wood, and none of the consoling vanilla usually used to soften smoky scents."
