    },
    {
     "type": "text",
     "text": {
      "ru": "Тогда ладан. В 2002 году Comme des Garçons выпустили серию из пяти ароматов-паломничеств по святым местам мира, и три из них стали эталоном церковного запаха: холодный камень, дым кадила, смола. Тут уже появляется отстранённость, которой нет в универмаге.",
      "en": "Then incense. In 2002 Comme des Garçons released a series of five pilgrimage scents to the holy places of the world, and three of them became the benchmark church smell: cold stone, censer smoke, resin. Here a detachment appears that the department store never has."
     }
    },
