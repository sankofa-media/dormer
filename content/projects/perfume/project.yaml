     "type": "aside",
     "title": {
      "ru": "Геосмин",
      "en": "Геосмин"
     },
     "text": {
      "ru": "Вещество, которое выделяют почвенные бактерии. Именно его мы чувствуем, когда пахнет землёй после дождя. Человеческий нос улавливает геосмин в ничтожных концентрациях.",
      "en": "A substance produced by soil bacteria. It is what we smell when the earth smells after rain. The human nose detects geosmin at minute concentrations."
     }
