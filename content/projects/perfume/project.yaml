     "type": "text",
     "text": {
      "ru": "**Odeur 71** · Comme des Garçons · 2000\n\n«Второй антипарфюм» Comme des Garçons состоит из запахов, которые никто раньше не считал запахами для духов: пыль на горячей лампочке, тёплый тонер ксерокса, горячий металл, тостер, стружка карандаша, чернила перьевой ручки и почему-то сок салата. Чтобы снять запахи с неживых предметов, марка использовала специальную технологию анализа воздуха вокруг них.",
      "en": "**Odeur 71** · Comme des Garçons · 2000\n\nComme des Garçons' ‘second anti-perfume’ is made of smells nobody had thought of as perfume: dust on a hot light bulb, warm photocopier toner, hot metal, a toaster, pencil shavings, fountain-pen ink and, for some reason, lettuce juice. To capture the smells of inanimate objects the brand used a special technique for analysing the air around them."
