    },
    {
     "type": "text",
     "text": {
      "ru": "**En el aire** · Тереза Марголес · 2003\n\nВ другой её работе машина выдувает в коридор мыльные пузыри. Их делают из той же воды, которой обмывали тела перед вскрытием. Пузыри медленно плывут и лопаются о лица зрителей. Работу 2003 года показывали в 2004-м во Франкфурте на выставке «Смерть без конца».",
      "en": "**En el aire** · Teresa Margolles · 2003\n\nIn another of her works a machine blows soap bubbles into a corridor. They are made from the same water used to wash bodies before autopsy. The bubbles drift slowly and burst against visitors' faces. The 2003 work was shown in 2004 in Frankfurt in the exhibition Muerte sin fin."
