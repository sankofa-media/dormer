        "ru": "С 1928 по 1969 год армия США учила солдат узнавать боевые газы по цвету и запаху, и для этого выпускала наборы стеклянных ампул с небольшими дозами настоящих отравляющих веществ: иприта, люизита, фосгена, хлорпикрина, а иногда и зарина. Учебную версию для помещений прозвали «нюхательным набором». В 1971 году наборы объявили устаревшими и отозвали, но часть их до сих пор находят закопанными на бывших полигонах; британский аналог военных лет хранит лондонский Музей науки.",
        "en": "From 1928 to 1969 the US Army taught soldiers to recognise war gases by colour and smell using sets of glass vials holding small amounts of real agents: sulfur mustard, lewisite, phosgene, chloropicrin and sometimes sarin. The indoor training version was nicknamed the 'Sniff Set'. Declared obsolete in 1971 and recalled, some sets are still found buried on former ranges; a British wartime equivalent is held by London's Science Museum."
