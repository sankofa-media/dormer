     "credit": "Официальное фото: CB I Hate Perfume",
     "source_url": "https://www.cbihateperfume.com/305",
     "size": "right",
     "treatment": "print"
    },
    {
     "type": "text",
     "text": {
      "ru": "**Burning Leaves** · CB I Hate Perfume · 2005\n\nКристофер Брозиус сначала основал Demeter, а потом ушёл и назвал свою бруклинскую марку манифестом: «Я ненавижу парфюмерию». Его интересуют не духи, а запахи памяти, и он собирает их, изучая, из чего состоит запах настоящих вещей. Burning Leaves — это осенний двор, где жгут кленовые листья: треск костра, тлеющие угли, сырая листва.",
      "en": "**Burning Leaves** · CB I Hate Perfume · 2005\n\nChristopher Brosius first co-founded Demeter, then left and named his Brooklyn brand as a manifesto: I Hate Perfume. He cares not about perfumes but about smells of memory, which he builds by studying what real things smell of. Burning Leaves is an autumn yard where maple leaves are burning: the crackle of fire, smouldering embers, damp foliage."
     },
