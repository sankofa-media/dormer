    {
     "type": "text",
     "text": {
      "ru": "**Pseudo Corpse Scent, Formulation II** · Sigma-Aldrich\n\nВторая формула — запах тела уже после гниения. В 2012 году химики проанализировали такие коммерческие имитации и выяснили, что в них всего несколько основных веществ, а семь из найденных вообще не встречаются среди известных продуктов разложения. По их мнению, настоящий трупный запах эти смеси передают плохо, и, наверное, это единственная хорошая новость на нашей лестнице.",
      "en": "**Pseudo Corpse Scent, Formulation II** · Sigma-Aldrich\n\nThe second formula is the smell of a body after putrefaction. In 2012 chemists analysed such commercial imitations and found only a few main substances, seven of which do not occur among known decomposition products at all. In their view the mixtures render real corpse smell poorly — perhaps the only good news on our ladder."
