      "ru": "**Кольцевая. Август. Час пик** · придумано редакцией\n\nВагон кольцевой линии московского метро в августе, когда кондиционер не работает. Горячие тормозные колодки, резина поручней, чужие подмышки на уровне вашего лица, мокрая собака, которую везут на дачу, и чебурек, съеденный кем-то на «Комсомольской». Единственный аромат на этой странице, который миллионы людей нюхают каждый день бесплатно.",
      "en": "**The Circle Line. August. Rush hour** · invented by the editors\n\nA carriage on the Moscow metro's Circle Line in August with the air conditioning broken. Hot brake pads, rubber handrails, strangers' armpits at the level of your face, a wet dog on its way to the dacha and a meat pastry someone ate at Komsomolskaya. The only fragrance on this page that millions of people smell every day for free."
