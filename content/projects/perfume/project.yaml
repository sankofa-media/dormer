      "en": "**AB** · Blood Concept · 2011\n\nType AB, the brand says, is sharp and freezing as a metropolitan skyline. Aldehydes, aluminium, slate, pebbles, water and cedar make it the most industrial of the four — here is the industrial you asked about at the start, only now with blood."
