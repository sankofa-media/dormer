   "blocks": [
    {
     "type": "text",
     "text": {
      "ru": "*Искусство всё-таки игра. А есть что-то, что пахнет смертью по-настоящему и при этом продаётся?*",
      "en": "*Art is still a game. Is there anything that smells of death for real and is still on sale?*"
     }
    },
    {
     "type": "text",
     "text": {
      "ru": "Есть, но это не духи, и наносить это на себя нельзя: вещества раздражают кожу, глаза и дыхательные пути. Химические компании продают имитацию трупного запаха для дрессировки собак, которые ищут погибших под завалами и пропавших людей.",
      "en": "There is, but it isn't perfume and must never go on your skin: the substances irritate skin, eyes and airways. Chemical companies sell imitation corpse scent for training the dogs that search for the dead under rubble and for missing people."
     }
    },
    {
     "type": "aside",
     "title": {
      "ru": "Кадаверин и путресцин",
      "en": "Кадаверин и путресцин"
