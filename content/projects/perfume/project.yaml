    {
     "type": "text",
     "text": {
      "ru": "**Rien** · Etat Libre d'Orange · 2006\n\nНазвание значит «ничего», а пахнет оно грубой кожей, альдегидами, ладаном, кумином и ладанником. Etat Libre d'Orange пишет «ничто — это всё» и называет аромат второй кожей. Блог Kafkaesque озаглавил рецензию на него «Бондажная кожа». Сейчас на официальной странице висят те же ноты, что у его более поздней версии Rien Intense Incense, так что сайт, похоже, ошибся.",
      "en": "**Rien** · Etat Libre d'Orange · 2006\n\nThe name means ‘nothing’, yet it smells of rough leather, aldehydes, incense, cumin and cistus. Etat Libre d'Orange writes ‘Nothing is Everything’ and calls it a second-skin perfume. The blog Kafkaesque titled its review ‘Bondage Leather’. The official page currently lists the notes of its later sibling Rien Intense Incense, which looks like a website mistake."
