   "blocks": [
    {
     "type": "text",
     "text": {
      "ru": "*Мне не нравятся сладкие ароматы. Нравится что-то более горькое или солоноватое, что-то не самое попсовое, может, даже индастриал какой-то.*",
      "en": "*I don’t like sweet fragrances. I like something more bitter or salty, not too mainstream, maybe even something industrial.*"
     }
    },
    {
     "type": "text",
     "text": {
      "ru": "С этого вопроса началась наша прогулка. Мы ответили на него, а потом спросили себя: хорошо, но ведь есть что-то ещё более необычное, совсем нишевое, может, даже неприятное? И задавали этот вопрос снова и снова, двадцать раз подряд. Каждый ответ стал ступенью, и на каждой ступени стоят несколько настоящих ароматов, которые можно купить, или работ художников, которые можно увидеть в музее.\n\nЛестница начинается в универмаге, с горьких и солёных мужских ароматов, которые продаются в любом дьюти-фри, проходит через ладан, дым, кожу, асфальт и офисную технику, спускается к звериным выделениям, поту, крови и смерти и заканчивается там, где запах становится искусством о насилии. На последней, двадцать первой ступени мы придумали несколько ароматов сами.\n\nКарта ниже показывает всю дорогу сразу. Каждая точка на ней — аромат, и стоит он там, где сошлись две наши оценки от нуля до десяти. Чем правее точка, тем аромат жёстче: слева то, что понравится почти любому, справа то, что лучше не нюхать. Чем выше, тем он попсовее: наверху продаётся в каждом дьюти-фри, внизу почти никто не нюхал. Фон темнеет слева направо вместе с жёсткостью, а цвет точки говорит, из какого семейства аромат: дерево, дым, кожа, звери и так далее. Нажмите на точку, и рядом откроется рассказ об аромате, на кнопку семейства, чтобы оставить только его, или найдите аромат по названию. Вместе со ступенями меняется и цвет самой страницы.",
      "en": "Our walk began with this question. We answered it, then asked ourselves: fine, but isn’t there something even more unusual, truly niche, maybe even unpleasant? And we asked it again and again, twenty times in a row. Each answer became a step, and on each step stand several real fragrances you can buy, or artists’ works you can see in a museum.\n\nThe ladder starts in the department store, with bitter and salty men’s fragrances sold in any duty-free, passes through incense, smoke, leather, asphalt and office machines, descends to animal secretions, sweat, blood and death, and ends where smell becomes art about violence. On the last, twenty-first step we invented a few fragrances of our own.\n\nThe map below shows the whole road at once. Each dot is a fragrance, placed where our two scores from zero to ten meet. The further right, the more extreme: on the left what almost anyone would like, on the right what you had better not smell. The higher, the more mainstream: at the top it is sold in every duty-free, at the bottom almost nobody has smelled it. The background darkens from left to right with extremity, and the colour of a dot tells its family: wood, smoke, leather, animals and so on. Click a dot and its story opens beside the map, click a family to keep only it, or find a fragrance by name. The page itself changes colour as you descend."
     }
    },
