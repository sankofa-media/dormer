      "ru": "**Duro** · Nasomatto · 2007\n\nDuro, «твёрдый», задуман, по словам бренда, чтобы усилить все проявления мужской силы. Кожа, дерево, смолы и табак, и всё это в концентрации духов, которых хватает на целый день. Звучит как пародия на мужской аромат, но сделано всерьёз.",
