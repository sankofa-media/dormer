     "text": {
      "ru": "**Les Fleurs du Déchet — I Am Trash** · Etat Libre d'Orange · 2018\n\nНазвание переиначивает «Цветы зла» Бодлера в «Цветы мусора». Аромат сделан из дистиллятов, которые получают из отходов парфюмерного производства, то есть из того, что обычно выбрасывают после экстракции. Марка обещает самый желанный запах из ненужного, и он неожиданно приятный: клубника, яблоко, цветы и дерево. Это контрапункт на нашей лестнице: концепция мусорная, а запах нет.",
      "en": "**Les Fleurs du Déchet — I Am Trash** · Etat Libre d'Orange · 2018\n\nThe name twists Baudelaire's Flowers of Evil into Flowers of Waste. It is made from distillates of perfume-industry waste — what is usually thrown away after extraction. The brand promises the most wanted scent made from the unwanted, and it is unexpectedly pleasant: strawberry, apple, flowers and wood. A counterpoint on our ladder: the concept is trash, the smell is not."
