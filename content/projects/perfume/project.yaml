   "heat": 0.25,
   "blocks": [
    {
     "type": "text",
     "text": {
      "ru": "*Ладан — это всё-таки благородный дым. А дым попроще, от костра, от пожара?*",
      "en": "*Incense is still a noble smoke. What about the plainer kind, from a bonfire, from a fire?*"
     }
    },
    {
     "type": "text",
     "text": {
      "ru": "Пожалуйста. Здесь дым уже не священный, а бытовой и даже криминальный: горящие листья во дворе, обугленное дерево, сгоревшая парикмахерская. Носить это можно, но окружающие начнут оглядываться в поисках огня.",
      "en": "Gladly. Here the smoke is no longer sacred but domestic and even criminal: leaves burning in a yard, charred wood, a barbershop burnt to the ground. You can wear it, but people around will start looking for the fire."
     }
    },
    {
     "type": "photo",
     "src": "05-a-cb-i-hate-perfume-burning-leaves.jpg",
     "alt": {
      "ru": "Флакон Burning Leaves",
      "en": "The Burning Leaves bottle"
