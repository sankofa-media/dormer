    {
     "type": "text",
     "text": {
      "ru": "**Odeur 53** · Comme des Garçons · 1998\n\nС него всё началось: первый «абстрактный антипарфюм» большого модного дома. Пятьдесят три синтетические ноты изображают то, у чего нет названия: свежесть кислорода, горящий камень, бельё на ветру, вспышку металла и даже лак для ногтей. Бренд объясняет, что использовал запахи, которые раньше никогда не применялись.",
      "en": "**Odeur 53** · Comme des Garçons · 1998\n\nIt all started here: the first ‘abstract anti-perfume’ from a major fashion house. Fifty-three synthetic notes depict things that have no name: the freshness of oxygen, burning rock, laundry in the wind, a flash of metal and even nail polish. The brand explains it used smells never before used, with no precise name, only abstract ideas."
