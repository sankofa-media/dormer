      "en": "**Déclaration** · Cartier · 1998\n\nEight years before Terre, the same Ellena made Cartier a fragrance of bitter wormwood and orange peel with dry spices. What unsettles many is the cumin, a spice that gives a bodily, slightly sweaty note, like a white shirt at the end of a long day (though cumin appears in some official note lists and not in others). The blog Ça Fleure Bon counts Déclaration among its modern masterpieces."
