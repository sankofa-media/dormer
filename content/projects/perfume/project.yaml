    },
    {
     "type": "text",
     "text": {
      "ru": "**Pseudo Corpse Scent, Formulation I** · Sigma-Aldrich\n\nПервая формула изображает ранние стадии разложения. Производитель честно пишет, что веществ, в честь которых назван продукт, в нём нет: смесь должна вызывать у собаки ту же реакцию, что и настоящий запах. Качество проверяют на обученных собаках, а хранить пузырёк нужно в холодильнике.",
      "en": "**Pseudo Corpse Scent, Formulation I** · Sigma-Aldrich\n\nThe first formula imitates the early stages of decomposition. The maker states honestly that the substances the product is named after are not in it: the mixture must trigger the same response in a dog as the real smell. Quality is tested on trained dogs, and the vial must be kept refrigerated."
     },
