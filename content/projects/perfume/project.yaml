     "text": {
      "ru": "Синтетическое вещество, которое компания IFF создала в 1973 году. Пахнет сухим бархатистым деревом и кедровым карандашом. Нос быстро к нему привыкает, поэтому аромат будто то появляется, то исчезает.",
      "en": "A synthetic material created by IFF in 1973. It smells of dry, velvety wood and cedar pencil. The nose gets used to it quickly, so the scent seems to come and go."
     }
