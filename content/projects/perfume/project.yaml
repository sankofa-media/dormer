   "heat": 1.0,
   "blocks": [
    {
     "type": "text",
     "text": {
      "ru": "*Хорошо. А если и этого мало?*",
      "en": "*Fine. And if even that isn't enough?*"
     }
    },
    {
     "type": "text",
     "text": {
      "ru": "Тогда остаётся только придумать самим. Ниже ароматы, которых не существует: мы их выдумали. Ни один парфюмер, к счастью, их не делал, и, надеемся, не сделает.",
      "en": "Then all that's left is to invent our own. Below are fragrances that do not exist: we made them up. Fortunately no perfumer has made them, and we hope none ever will."
     }
    },
    {
     "type": "text",
     "text": {
      "ru": "**Серверная. Пятница, 23:40** · придумано редакцией\n\nИндастриал, о котором вы спрашивали в начале, доведённый до конца. В верхних нотах озон и фреон из кондиционера, который как раз сломался. В сердце горелая изоляция кабеля, расплавленный пластик блока питания и запах перегретой платы. В базе холодный кофе из бумажного стаканчика, лапша быстрого приготовления и пот человека, который решил выкатить обновление в пятницу вечером.",
      "en": "**Server Room. Friday, 11:40 p.m.** · invented by the editors\n\nThe industrial you asked about at the start, taken to its end. Top notes of ozone and freon from an air conditioner that has just died. A heart of burnt cable insulation, melted power-supply plastic and an overheated circuit board. A base of cold coffee in a paper cup, instant noodles and the sweat of someone who decided to deploy on a Friday night."
     }
    },
    {
     "type": "scorecard",
     "popsa": 0,
     "zhest": 8,
     "facts": [
      {
       "label": {
        "ru": "Что внутри",
        "en": "What is inside"
       },
       "value": {
        "ru": "озон, фреон, горелая изоляция, плавленый пластик, холодный кофе, пот",
        "en": "ozone, freon, burnt insulation, melted plastic, cold coffee, sweat"
       }
      },
      {
       "label": {
        "ru": "Где купить",
        "en": "Where to buy"
       },
       "value": {
        "ru": "нигде, к счастью",
        "en": "nowhere, fortunately"
       }
      }
     ]
    },
    {
     "type": "text",
     "text": {
      "ru": "**Кольцевая. Август. Час пик** · придумано редакцией\n\nВагон кольцевой линии московского метро в августе, когда кондиционер не работает. Горячие тормозные колодки, резина поручней, чужие подмышки на уровне вашего лица, мокрая собака, которую везут на дачу, и чебурек, съеденный кем-то на «Комсомольской». Единственный аромат на этой странице, который миллионы людей нюхают каждый день бесплатно.",
      "en": "**The Circle Line. August. Rush hour** · invented by the editors\n\nA carriage on the Moscow metro's Circle Line in August with the air conditioning broken. Hot brake pads, rubber handrails, strangers' armpits at the level of your face, a wet dog on its way to the dacha and a meat pastry someone ate at Komsomolskaya. The only fragrance on this page that millions of people smell every day for free."
     }
    },
