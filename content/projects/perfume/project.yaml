   "heat": 0.51,
   "blocks": [
    {
     "type": "text",
     "text": {
      "ru": "*Порох — это эффектно. А что-нибудь совсем бытовое, вплоть до мусора?*",
      "en": "*Gunpowder is showy. What about something utterly ordinary, down to the trash?*"
     }
    },
    {
     "type": "text",
     "text": {
      "ru": "Тогда в мастерскую и на свалку. Американская марка Demeter с девяностых делает запахи вещей, буквально и без прикрас, и продаёт их за копейки. А одна французская марка сделала духи прямо из отходов.",
      "en": "Then to the workshop and the dump. Since the nineties the American brand Demeter has made the smells of things, literally and without embellishment, and sells them for pennies. And a French brand made a perfume straight out of waste."
     }
    },
    {
     "type": "photo",
     "src": "10-a-demeter-turpentine.jpg",
