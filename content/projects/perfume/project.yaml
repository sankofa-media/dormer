     "type": "text",
     "text": {
      "ru": "**Vaporización** · Тереза Марголес · 2001\n\nЗритель входит в зал, наполненный туманом. Сначала ему не говорят, чем он дышит, и только надпись на стене объясняет: туман сделан из воды, которой в центральном морге Мехико обмывали тела погибших, предварительно обеззараженной. Запаха почти нет, и в этом весь ужас: жесть не в носу, а в знании, что эта вода оседает на вашей коже и попадает в лёгкие. Работу датируют 2000 или 2001 годом, а в 2002-м её показали в нью-йоркском MoMA PS1.",
      "en": "**Vaporización** · Teresa Margolles · 2001\n\nThe visitor enters a room filled with mist. At first they are not told what they are breathing; only a text on the wall explains that the mist is made from water used to wash the bodies of the dead in Mexico City's central morgue, disinfected beforehand. There is almost no smell, and that is the horror: the extremity is not in the nose but in knowing that this water settles on your skin and enters your lungs. The work is dated 2000 or 2001; in 2002 it was shown at MoMA PS1 in New York."
