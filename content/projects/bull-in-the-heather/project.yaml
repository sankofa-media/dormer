  - id: kentucky
    name:
      ru: Полтора месяца спустя
      en: Six weeks later
    blocks:
      - id: kentucky-0
        ru: Первого мая 1993 года он бежал Кентуккийское дерби, главную скачку Америки, ту самую, что когда-то выиграл его отец. Пришёл одиннадцатым. Потом были другие скачки — вторые места, Belmont Stakes, — но таких побед, как во Флориде, больше не было. Ещё в октябре 1994 года он пришёл в Белмонте девятым, последним.
        en:
          text: On May 1, 1993, he ran in the Kentucky Derby, America’s greatest race, the one his father had once won. He finished eleventh. Other races followed — second places, the Belmont Stakes — but there were no more wins like Florida. In October 1994, he finished ninth and last at Belmont.
          draft: true
        sources:
