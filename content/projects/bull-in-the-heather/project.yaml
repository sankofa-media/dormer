  - id: anatomy
    name:
      ru: Как она устроена
      en: "How It Works"
    blocks:
      - type: text
        text:
          ru: |
            Bull in the Heather длится три минуты и четыре секунды, и в ней нет припева. Это первое, что в ней странно. Обычная рок-песня строится на ожидании: куплет поднимает напряжение, припев его разряжает, все подпевают. Здесь там, где полагается быть припеву, вдруг ничего не поют. Вместо этого гитары рассыпаются на звон, скрежет и гудение, а потом снова собираются в тот же упрямый рисунок. Разрядку даёт не голос, а шум.

            Исследователь Sonic Youth Крис Лоуренс, который много лет расписывает их песни по нотам и по струнам, раскладывает Bull in the Heather на четыре части, которые повторяются дважды, а потом ещё раз начало, как эхо. Ниже — эта схема. Нажмите на любую часть, и клип начнётся с этого места.
          en: |
            Bull in the Heather lasts three minutes and four seconds, and it has no chorus. That is the first strange thing about it. An ordinary rock song runs on anticipation: the verse builds tension, the chorus releases it, everyone sings along. Here, where the chorus ought to be, suddenly nobody sings. Instead, the guitars scatter into ringing, scraping, and humming, then gather themselves back into the same stubborn pattern. The release comes from noise, not the voice.

            Chris Lawrence, a Sonic Youth scholar who has spent years taking their songs apart note by note and string by string, divides Bull in the Heather into four sections, repeated twice, followed by one more return to the beginning, like an echo. His outline is below. Click on any section to start the video at that point.
        sources:
          - title: Chris Lawrence — Bull in the Heather, song analysis and tablature
            url: https://www.soniclife.ca/sy/tab/bullintheroad.html
      - type: structure
        video_id: 8JGBNkLM9_8
        sections:
          - label: {ru: "Звон", en: "Ringing"}
            start: 0
            end: 14
            note:
              ru: Терстон берёт флажолеты на девятом ладу на двух струнах, настроенных в ре, и чередует их с парой струн в ре-диез. Звук получается как у треснувшего колокола. Ким и Ли скребут медиатором по обмотке струн.
              en: "Thurston plays ninth-fret harmonics on two strings tuned to D, alternating them with a pair tuned to D-sharp. The sound is like a cracked bell. Kim and Lee scrape their picks along the string windings."
          - label: {ru: "Основа", en: "The Foundation"}
            start: 14
            end: 29
            note:
              ru: Вступает бас на низкой соль — он будет держать всю песню, как якорь. Стив Шелли играет простой цепкий рисунок, а гитара выводит короткую тему.
              en: "The bass enters on a low G—it will anchor the whole song. Steve Shelley plays a simple, tenacious pattern, and the guitar picks out a short theme."
          - label: {ru: "Голос", en: "The Voice"}
            start: 29
            end: 66
            note:
              ru: Ким поёт — вернее, почти говорит, холодно и требовательно, будто отдаёт команды. Под ней перебором ходит гитара.
              en: "Kim sings—or almost speaks, cool and demanding, as if giving orders. Beneath her, a guitar picks its way through an arpeggio."
          - label: {ru: "Вместо припева", en: "In Place of a Chorus"}
            start: 66
            end: 85
            note:
              ru: Здесь в обычной песне был бы припев. Вместо него — флажолеты, шум, гудение баса на натуральных обертонах. Песня как будто выдыхает.
              en: "An ordinary song would have a chorus here. Instead, there are harmonics, noise, and the hum of the bass playing natural overtones. The song seems to exhale."
          - label: {ru: "Звон", en: "Ringing"}
            start: 85
            end: 100
            note:
              ru: Возвращается колокольный звон начала.
              en: "The bell-like ringing of the opening returns."
          - label: {ru: "Основа", en: "The Foundation"}
            start: 100
            end: 108
            note:
              ru: Короткий заход — на этот раз без раскачки.
              en: "A brief return—straight into it this time."
          - label: {ru: "Голос", en: "The Voice"}
            start: 108
            end: 145
            note:
              ru: Второй куплет. Счёт и повторы в словах делают песню похожей на игру, в которой кого-то проверяют на внимание и верность.
              en: "The second verse. The counting and repetition in the words make the song feel like a game testing someone’s attention and loyalty."
          - label: {ru: "Вместо припева", en: "In Place of a Chorus"}
            start: 145
            end: 164
            note:
              ru: Вторая шумовая пауза.
              en: "The second interlude of noise."
          - label: {ru: "Звон", en: "Ringing"}
            start: 164
            end: 182
            note:
              ru: Последний звон. В самом конце Терстон оттягивает струну за верхним порожком, и нота съезжает вниз, как будто песню выключили из розетки.
              en: "One last ringing. At the very end, Thurston pulls a string behind the nut and the note slides downward, as though someone had unplugged the song."
      - type: art
        src: guitars-tuning.webp
        alt:
          ru: Руки перестраивают колки электрогитары, под струнами отвёртка
          en: "Hands turn the tuning pegs of an electric guitar, a screwdriver wedged beneath the strings"
        size: right
      - type: text
        text:
          ru: |
            Строй тоже необычный, у каждого свой. У Терстона струны снизу вверх настроены так: соль, соль, ре, ре, ре-диез, ре-диез. Три пары почти одинаковых нот, причём две соседние пары отстоят друг от друга на полтона — отсюда и тревожный, чуть фальшивый звон, когда они звучат вместе. У Ли — соль, соль, до, соль, до, ре. А Ким играет в самом обычном строе бас-гитары. Две гитары, перестроенные кто во что, держатся за один нормальный бас, как два воздушных змея за одну верёвку.

            Критик Мартин Сей заметил, что приём со струнами, настроенными в одну ноту, — любимый трюк Гленна Бранки, нью-йоркского композитора, в чьём гитарном оркестре когда-то играли и Мур, и Ранальдо. В песне, которую крутило MTV, слышно эхо авангардных симфоний для двенадцати электрогитар.

            И ещё голос. Ким Гордон в Bull in the Heather не поёт в полную силу и не кричит, как кричала во многих песнях Sonic Youth. Она произносит слова ровно, с ленцой, иногда с насмешкой. Рецензент назвал это «отрывистым полуговором-полупением». В 1994 году, когда все вокруг надрывались, такая сдержанность звучала вызовом.
          en: |
            The tunings are unusual, too, and each player has a different one. Thurston’s strings, from low to high, are tuned G, G, D, D, D-sharp, D-sharp. Three pairs of almost identical notes, with two neighboring pairs only a semitone apart—which accounts for the uneasy, slightly sour ringing when they sound together. Lee’s are G, G, C, G, C, D. Kim, meanwhile, uses perfectly ordinary bass tuning. Two guitars, each retuned its own way, hold on to one normal bass like two kites on a single string.

            The critic Martin Seay noted that tuning strings to the same note was a favorite device of Glenn Branca, the New York composer whose guitar orchestra had once included both Moore and Ranaldo. In a song played on MTV, you can hear the echo of avant-garde symphonies for twelve electric guitars.

            And then there is the voice. In Bull in the Heather, Kim Gordon neither sings at full strength nor screams, as she had in so many Sonic Youth songs. She delivers the words evenly, lazily, sometimes mockingly. One reviewer called it “clipped half-speaking, half-singing.” In 1994, when everyone around her was straining their lungs, such restraint sounded like defiance.
        sources:
          - title: Chris Lawrence — Sonic Youth guitar tunings, Experimental Jet Set
            url: https://www.soniclife.ca/sy/tab/tunings.html#jet
          - title: "Martin Seay — Against Kool: Bull in the Heather"
            url: https://marchxness.com/againstkool
          - title: SFGate — Sonic Youth ages gracefully, noisily
            url: https://www.sfgate.com/entertainment/article/sonic-youth-ages-gracefully-noisily-3291685.php
          - title: CMJ New Music Report — June 13 1994
            url: https://www.worldradiohistory.com/Archive-All-Music/CMJ/1994/CMJ-New-Music-Report-1994-06-13.pdf

  - id: meaning
    name:
      ru: Бунт неподвижности
      en: "The Rebellion of Stillness"
    blocks:
      - type: art
        src: passive.webp
        alt:
          ru: Женщина неподвижно лежит в вереске, а над ней проносятся размытые фигуры
          en: "A woman lies motionless in the heather as blurred figures rush above her"
        size: bleed
      - type: text
        text:
          ru: |
            О чём эта песня, Ким Гордон объясняла коротко: о пассивности как способе бунтовать. Не кричать, не ломиться в дверь, не доказывать — а просто отказаться играть по чужим правилам. Лечь в вереск и не встать, сколько бы тебя ни звали.

            Слов в песне немного, они повторяются, в них считают и приказывают, и вся она похожа на игру, в которой один человек испытывает другого: заметишь ли, останешься ли, будешь ли знаменит ради меня. Критик Мартин Сей вытащил из неё одну строчку — Tell me that you're famous for me, «скажи, что ты знаменит ради меня», — и в ней, пожалуй, всё: и усталость от славы, и игра в неё, и насмешка над тем, как в 1994 году газеты и телевидение выбирали себе героев на неделю.

            В названии — скаковой конь, и можно было бы подумать, что песня про ставки и про то, как на человека ставят, словно на лошадь. Но это уже наше прочтение. Сама Гордон ничего такого не говорила, а конь попал в название, скорее всего, просто потому, что имя было красивое.

            Весной 1994 года пассивность как бунт звучала совсем не отвлечённо. Рядом шумело движение riot grrrl — девичьи панк-группы, которые требовали места для женщин в музыке, у сцены и в газетах. Им-то как раз всё время приходилось кричать. И Гордон позвала в свой клип одну из самых громких из них.
          en: |
            Kim Gordon’s explanation of the song was brief: it was about passivity as a form of rebellion. No shouting, no battering at doors, no arguing your case—just refusing to play by somebody else’s rules. Lie down in the heather and stay there, however often they call you.

            There are few words in the song. They repeat, they count, they give orders, and the whole thing resembles a game in which one person tests another: will you notice, will you stay, will you be famous for me? The critic Martin Seay singled out one line—Tell me that you're famous for me—and perhaps it holds everything: weariness with fame, the game of pursuing it, and a sneer at the way newspapers and television in 1994 chose their heroes for the week.

            There is a racehorse in the title, and you might suppose the song is about betting, about putting your money on a person as you would on a horse. But that is our reading. Gordon herself said nothing of the kind, and the horse most likely found his way into the title simply because his name was beautiful.

            In the spring of 1994, passivity as rebellion was hardly an abstract idea. Nearby, riot grrrl was making itself heard—girl punk bands demanding room for women in music, in front of the stage, and in the papers. They were the ones who had to shout all the time. And Gordon invited one of the loudest of them into her video.
        sources:
          - title: "Martin Seay — Against Kool: Bull in the Heather"
            url: https://marchxness.com/againstkool
          - title: Vogue — Why Kim Gordon and Her New Memoir Will Outlive the Lana Del Rey Twitter Controversy
            url: https://www.vogue.com/article/kim-gordon-interview-girl-in-a-band-memoir

  - id: hanna
    name:
      ru: Девушка с косичками
      en: "The Girl with the Pigtails"
    blocks:
      - type: text
        text:
          ru: |
            Кэтлин Ханне в 1994 году было двадцать пять лет. Четырьмя годами раньше она собрала в Олимпии, штат Вашингтон, группу Bikini Kill. В Олимпии тогда была своя маленькая вселенная: колледж, где учились художники и музыканты, крошечные лейблы, ксероксы, на которых печатали самодельные журналы — зины. Ханна писала зины, рисовала, работала где придётся и пела так, будто хотела докричаться до последнего ряда зала, которого у неё никогда не было.

            Bikini Kill стали одной из главных групп riot grrrl. На их концертах Ханна просила парней отойти назад, а девушек — пройти вперёд, к сцене: «girls to the front». Звучит буднично, но в начале девяностых это было почти скандалом. На панк-концертах первые ряды давно принадлежали парням, которые толкались и прыгали, а девушки стояли сзади и смотрели поверх их голов.
          en: |
            Kathleen Hanna was twenty-five in 1994. Four years earlier, she had formed Bikini Kill in Olympia, Washington. Olympia then was a small universe of its own: a college where artists and musicians studied, tiny record labels, photocopiers turning out homemade magazines—zines. Hanna wrote zines, made art, took whatever work she could, and sang as though trying to reach the back row of a hall she had never had.

            Bikini Kill became one of riot grrrl’s leading bands. At their shows, Hanna asked the boys to move back and the girls to come forward, toward the stage: “girls to the front.” It sounds unremarkable, but in the early nineties it was almost a scandal. At punk shows, the front rows had long belonged to boys shoving and jumping while the girls stood at the back, looking over their heads.
        sources:
          - title: "TIME — Rebel Girl: My Life as a Feminist Punk"
            url: https://time.com/7172867/rebel-girl-my-life-as-a-feminist-punk/
          - title: AP — Kathleen Hanna interview, 2024
            url: https://apnews.com/article/1c05e3f76813bd0d134961f8f081f7b0
      - type: art
        src: riot-show.webp
        alt:
          ru: Тесный подвал, девушка кричит в микрофон, у сцены стоят девушки
          en: "A crowded basement, a girl shouting into a microphone, girls standing in front of the stage"
        size: wide
        caption:
          ru: Girls to the front.
          en: "Girls to the front."
      - type: photo
        src: hanna-1991-jonathancharles.jpg
        alt:
          ru: Кэтлин Ханна поёт на концерте Bikini Kill
          en: "Kathleen Hanna sings at a Bikini Kill show"
        caption:
          ru: Кэтлин Ханна на концерте Bikini Kill, 1991 год.
          en: "Kathleen Hanna at a Bikini Kill show, 1991."
        credit: "Фото: jonathancharles / Flickr, Wikimedia Commons, CC BY-SA 2.0"
        source_url: https://commons.wikimedia.org/wiki/File:Kathleen_Hanna_live_in_Bikini_Kill_in_1991.jpg
        size: column
        treatment: print
      - type: text
        text:
          ru: |
            С Ханной связана и одна из самых знаменитых строчек девяностых, хотя спела её не она. Однажды вечером она и барабанщица Bikini Kill Тоби Вэйл заглянули в магазин, увидели дезодорант под названием Teen Spirit, и Ханна потом маркером написала на стене у своего приятеля Курта Кобейна: «Kurt smells like Teen Spirit» — «Курт пахнет как Teen Spirit». Кобейн решил, что это что-то революционное про дух юности, и спросил, можно ли взять фразу для песни. Ханна разрешила. Через несколько месяцев Smells Like Teen Spirit гремела из каждого окна. Сама Ханна позже не раз сердилась на расхожее объяснение, будто речь шла о дезодоранте подруги Кобейна: это, по её словам, совершенная неправда.
          en: |
            Hanna also had a hand in one of the most famous lines of the nineties, though she was not the one who sang it. One evening, she and Bikini Kill’s drummer, Tobi Vail, went into a store and saw a deodorant called Teen Spirit. Later, Hanna took a marker and wrote on the wall at her friend Kurt Cobain’s place: “Kurt Smells Like Teen Spirit.” Cobain thought it meant something revolutionary about the spirit of youth and asked whether he could use the phrase for a song. Hanna said yes. A few months later, Smells Like Teen Spirit was blasting out of every window. Hanna would later repeatedly object to the familiar explanation that the phrase referred to Cobain’s girlfriend’s deodorant: that, she said, was totally false.
        sources:
          - title: Fresh Air — Kathleen Hanna on life as a Rebel Girl
            url: https://freshairarchive.org/segments/kathleen-hanna-life-rebel-girl-and-joy-expressing-anger-public
          - title: CREEM — Kathleen Hanna interview, 2022
            url: https://www.creem.com/fresh-creem/kathleen-hanna-creem-interview
      - type: art
        src: zines.webp
        alt:
          ru: Разбросанные ксерокопированные журналы, ножницы, клей и булавки на полу
          en: "Photocopied zines, scissors, glue, and safety pins scattered across the floor"
        size: left
      - type: text
        text:
          ru: |
            Чем громче становилось движение, тем охотнее о нём писали газеты — и тем хуже. Журналисты спрашивали девушек из riot grrrl о насилии, которое они пережили, о том, правда ли Ханна когда-то танцевала в стриптизе, стравливали их друг с другом, а потом печатали заметки о злых и мрачных феминистках, которые ненавидят мужчин. К концу 1992 года многие участницы движения перестали давать интервью. Ханна потом объясняла, что берегла собственный рассудок: невозможно раз за разом пересказывать незнакомому человеку самое страшное в своей жизни и видеть потом в журнале карикатуру на себя.

            Вот почему её появление в клипе Sonic Youth значило больше, чем приглашение знакомой потанцевать. Она не сказала в камеру ни слова. Но её впервые за долгое время увидели миллионы людей — и увидели не злой и не мрачной, а смешной, озорной и совершенно свободной.
          en: |
            The louder the movement became, the more eagerly the papers covered it—and the worse the coverage grew. Journalists asked riot grrrl musicians about the violence they had endured, about whether Hanna really had worked as a stripper, set them against one another, then published stories about angry, miserable feminists who hated men. By late 1992, many of the women in the movement had stopped giving interviews. Hanna later explained that she was protecting her sanity: you could not keep telling a stranger the worst things that had happened to you, only to open a magazine and find a caricature of yourself.

            That is why her appearance in the Sonic Youth video meant more than asking a friend over to dance. She did not say a word to the camera. But for the first time in a long while, millions of people saw her—and saw someone funny, mischievous, and utterly free, rather than angry and miserable.
        sources:
          - title: David Buckingham — Riot Grrrls (historical essay)
            url: https://davidbuckingham.net/wp-content/uploads/2019/06/riot-grrrls.pdf
          - title: "Stereogum — We’ve Got A File On You: Kathleen Hanna"
            url: https://stereogum.com/2283523/weve-got-a-file-on-you-kathleen-hanna/interviews/weve-got-a-file-on-you
          - title: Martha Williams — Five things we learned at Kim Gordon’s interview at the Music Box
            url: https://www.timeout.com/chicago/blog/five-things-we-learned-at-kim-gordons-interview-at-the-music-box

  - id: clip
    name:
      ru: Пятьсот долларов и тарелка печенья
      en: "Five Hundred Dollars and a Plate of Cookies"
    blocks:
      - type: text
        text:
          ru: |
            Клип снимала Тамра Дэвис — подруга группы, которая к тому времени сделала клипы для Beastie Boys, а позже станет снимать кино. Придумывали его вместе с Ким Гордон. По рассказу Криса Лоуренса, сначала Гордон хотела позвать танцевать девушек из группы поддержки баскетбольного клуба «Нью-Йорк Никс» и только потом решила, что нужна Ханна. Ким тогда была беременна — она ждала дочь Коко.

            Ханна прилетела в Лос-Анджелес. Много лет спустя она очень просто объяснила, почему согласилась: ей заплатили пятьсот долларов, а она была на мели. И ей ничего не объясняли — просто сказали: танцуй. Она страшно нервничала, ей впервые в жизни делали причёску и грим профессионалы, и от волнения она съела целую тарелку шоколадного печенья, которое стояло для съёмочной группы. Так что бешеный танец, который потом пересматривали миллионы, — это, по её собственным словам, просто сахар.
          en: |
            The video was directed by Tamra Davis, a friend of the band who had already made videos for the Beastie Boys and would later make films. She and Kim Gordon devised it together. According to Chris Lawrence, Gordon first wanted to invite the New York Knicks’ cheerleaders to dance, then decided it had to be Hanna. Kim was pregnant at the time, expecting her daughter Coco.

            Hanna flew to Los Angeles. Many years later, she explained quite simply why she had agreed: they paid her five hundred dollars, and she was broke. They explained nothing—just told her to dance. She was terribly nervous; it was the first time she had ever had professional hair and makeup, and in her anxiety she ate an entire plate of chocolate-chip cookies set out for the crew. So the wild dance that millions would watch again and again was, by her own account, just sugar.
        sources:
          - title: Josh Sabini — Kathleen Hanna, Monster Children
            url: https://www.monsterchildren.com/articles/kathleen-hanna
          - title: Billboard 106(22), Production Notes p. 34
            url: https://www.worldradiohistory.com/Archive-All-Music/Billboard/90s/1994/BB-1994-05-28.pdf
          - title: Chris Lawrence — Bull in the Heather, song essay
            url: https://www.soniclife.ca/sy/tab/bullintheroad.html
          - title: NME, 2014-02-01 — Kathi Wilcox oral history
            url: https://www.worldradiohistory.com/UK/New-Musical-Express/2014/NME-2014-02-01.pdf
      - type: quote
        text:
          ru: Никто не слишком крут, чтобы сниматься в клипе Sonic Youth.
          en: "No one’s too cool to be in a Sonic Youth video."
        attribution: "Кэтлин Ханна, комментарий к DVD Corporate Ghost, 2004"
        source:
          title: Billboard, 2004-07-03 — Corporate Ghost review
          url: https://www.worldradiohistory.com/Archive-All-Music/Billboard/00s/2004/BB-2004-07-03.pdf
      - type: art
        src: hanna-dance.webp
        alt:
          ru: Девушка с косичками в кедах танцует, передразнивая гитариста; басистка смотрит и улыбается
          en: "A girl in sneakers with pigtails dances, mimicking a guitarist; the bassist watches and smiles"
        size: bleed
      - type: text
        text:
          ru: |
            Если посмотреть клип внимательно, по секундам, видно, что он собран из нескольких разных миров, которые сменяют друг друга без всякого сюжета.

            Первый мир — розовая комната с ковром на полу, где играет группа. На восьмой секунде Терстон в бледно-голубой рубашке играет, а мимо него проходит Ханна. На сороковой Ким снята сверху: белый бас Fender Musicmaster, бледно-голубая кофта с синей вставкой, розовая юбка. На сорок пятой Ким и Ханна стоят рядом; на Ханне тёмная майка без рукавов поверх белой футболки. На минуте пятидесяти Ханна в тёмных колготках и с косичками пляшет прямо перед Терстоном. На двух минутах пяти она задирает тёмную майку и показывает живот — рядом с Ким и Терстоном, которые стараются играть серьёзно. Именно этим она весь клип и занята: сбивает с музыкантов их рок-позы, передразнивает их и не даёт им быть важными. Критик The New Yorker вспоминал, что она целует всех, и первой — Ким.

            Второй мир — спальни. Одна залита зелёным светом, и в ней мелькает Терстон с торчащими во все стороны волосами, как на детских фотографиях. Говорят, эту комнату собрали по снимкам его настоящей детской спальни. Другая спальня — с пышной розовой кроватью, на которой в светлом платье лежит Ким. Лоуренс считает, что это отсылка к фильму «Куколка» 1956 года, где героиня тоже полулежит на кровати, капризная и неподвижная. Неподвижность, напомним, — тема песни.

            Третий мир — скачки. На минуте пятнадцати и минуте двадцати пяти по экрану несутся лошади с номерами на попонах, мелькает ограда дорожки. Какая это скачка, установить не удалось, и выдавать её за ту самую, флоридскую, мы не станем. Но кони в клипе есть, а значит, группа помнила, откуда взялось название.

            Есть ещё один мир: занавес, неоновая вывеска и Ханна в красной кофте. Так что одного костюма у неё в клипе нет — их по крайней мере два.
          en: |
            Watch the video closely, second by second, and you can see that it is assembled from several different worlds, which replace one another without any plot.

            The first is the pink room with a carpet on the floor, where the band plays. Eight seconds in, Thurston plays in a pale-blue shirt as Hanna walks past. At forty seconds, Kim is filmed from above: a white Fender Musicmaster bass, a pale-blue top with a blue panel, a pink skirt. At forty-five seconds, Kim and Hanna stand side by side; Hanna wears a dark sleeveless top over a white T-shirt. At one minute fifty, Hanna, in dark tights and pigtails, dances right in front of Thurston. At two minutes five, she lifts her dark top to show her stomach beside Kim and Thurston, who are trying to play with straight faces. This is what she does throughout: knocks the musicians out of their rock poses, mimics them, refuses to let them take themselves too seriously. A New Yorker critic remembered her kissing everyone, starting with Kim.

            The second world is bedrooms. One is washed in green light, with glimpses of Thurston, his hair sticking out in every direction as in childhood photographs. The room was reportedly built from pictures of his actual childhood bedroom. The other has a sumptuous pink bed, on which Kim lies in a light-colored dress. Lawrence reads this as a reference to the 1956 film Baby Doll, whose heroine also reclines on a bed, petulant and motionless. Stillness, remember, is the song’s subject.

            The third world is racing. At one minute fifteen and one minute twenty-five, horses with numbered saddlecloths race across the screen, the track rail flickering past. We could not establish which race it was, and will not pass it off as the one in Florida. But there are horses in the video, which means the band remembered where the title came from.

            There is one more world: a curtain, a neon sign, and Hanna in a red top. So she has more than one outfit in the video—at least two.
        sources:
          - title: Sonic Youth — Bull In The Heather, official music video
            url: https://www.youtube.com/watch?v=8JGBNkLM9_8
          - title: Sasha Frere-Jones — Hanna and Her Sisters, The New Yorker
