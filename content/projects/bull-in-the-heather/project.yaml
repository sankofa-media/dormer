        style: broadsheet
        masthead: Los Angeles Times
        date: "8 мая 1994"
        headline: "Hanging Out on the Fringe"
        deck:
          ru: Воскресный выпуск, раздел «Календарь»
          en: "Sunday edition, Calendar section"
        body:
          ru: Большой материал о Sonic Youth накануне выхода альбома — о группе, которая двенадцать лет остаётся на обочине и при этом оказалась в центре.
          en: "A major feature on Sonic Youth on the eve of the album’s release—a band that has spent twelve years on the fringe and somehow found itself at the center."
        cite:
          publication: Los Angeles Times
          date: "1994-05-08"
          page: "Calendar"
          url: https://www.latimes.com/archives/la-xpm-1994-05-08-ca-55173-story.html
        paper: paper-4.webp
      - type: text
        text:
          ru: |
            Семнадцатого мая Sonic Youth сыграли Bull in the Heather в вечернем шоу Дэвида Леттермана. Ким вышла в баскетбольной майке «Никс» с номером три — майке защитника Джона Старкса. Второй баскетбольный след в истории одной песни: сначала девушки из группы поддержки «Никс», которых чуть не позвали в клип, потом майка на телевидении. Официальной записи того выступления сейчас в сети нет: её заблокировала продюсерская компания Леттермана, и по рукам ходят только любительские копии.
          en: |
            On May 17, Sonic Youth played Bull in the Heather on David Letterman’s late-night show. Kim came out in a number-three Knicks basketball jersey—the jersey of guard John Starks. A second basketball connection in the story of one song: first the Knicks cheerleaders who had almost been invited into the video, then the jersey on television. No official recording of that performance is currently available online: Letterman’s production company blocked it, and only fan copies circulate.
        sources:
          - title: Sky Sport — Starks e i Sonic Youth
            url: https://sport.sky.it/nba/2022/10/21/nba-new-york-knick-starks-sonic-youth
          - title: Album Network, 1994-05-20
