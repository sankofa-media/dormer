chapters:
  - id: start
    name:
      ru: Старт
      en: The start
    blocks:
      - type: text
        text:
          ru: "20 марта 1993 года, ипподром Галфстрим-парк во Флориде, скачка Florida Derby. Весь день шёл дождь, и дорожка раскисла. Стартуют тринадцать трёхлеток. Среди них — серый жеребец Bull Inthe Heather. Ставят на него двадцать девять к одному: в него почти никто не верит."
          en:
            text: "March 20, 1993, Gulfstream Park in Florida: the Florida Derby. It has rained all day, and the track is sloppy. Thirteen three-year-olds are starting. Among them is a grey colt, Bull Inthe Heather. His odds are twenty-nine to one: almost nobody believes in him."
            draft: true
        sources:
          - title: "Churchill Downs — Stakes Histories: Florida Derby"
            url: https://www.kentuckyderby.com/wp-content/uploads/sites/2/2025/08/Stakes-Histories-Florida-Derby-2025.pdf
          - title: Les Kjos — Bull Inthe Heather wins Florida Derby, UPI
            url: https://www.upi.com/amp/Archives/1993/03/20/Bull-Inthe-Heather-wins-Florida-Derby/5384732603600/
          - title: Gulfstream Park — 2025/2026 Media Guide, Section 2
            url: https://www.gulfstreampark.com/assets/71tzd15sgbj0/6qrG21gebw1MEfinO6tTOh/5d649b43265e678cc4dd55e6f65d9c38/GulfstreamMediaGuide_Sec2_p1-80_FINAL.pdf
          - title: Bill Christine — Bull Inthe Heather Scores Upset, Los Angeles Times
            url: https://www.latimes.com/archives/la-xpm-1993-03-21-sp-13581-story.html
          - title: Old Friends — BULL INTHE HEATHER (1990–2014)
            url: https://oldfriendsequine.org/horse/bull-inthe-heather/
          - title: "JBIS — Sire line: Ferdinand, best progeny"
            url: https://www.jbis.jp/horse/0000576487/pedigree/sire/
          - title: Los Angeles Times — Kentucky Derby Capsules
            url: https://www.latimes.com/archives/la-xpm-1993-05-01-sp-29774-story.html
  - id: chapter-1
    name:
      ru: Наклейка на бампере
      en: A bumper sticker
    blocks:
      - type: text
        text:
          ru: "Песня Sonic Youth называется почти так же, как этот конь, — только в названии песни слова стоят раздельно. Как кличка попала к группе, сами музыканты, насколько удалось найти, не рассказывали. Есть пересказ: Боб Настанович, барабанщик группы Pavement, прислал Терстону Муру и Ким Гордон наклейку на бампер с именем коня."
          en:
            text: The Sonic Youth song has almost the same name as this horse, except that all the words in the song title are separate. As far as we could find, the musicians have not explained how the name reached them. One account says that Bob Nastanovich, the Pavement drummer, sent Thurston Moore and Kim Gordon a bumper sticker bearing the horse’s name.
            draft: true
        sources:
          - title: "uDiscover Music — The Best Sonic Youth Songs: Alternative Classics"
            url: https://www.udiscovermusic.com/stories/sonic-youth-best-songs-feature/
  - id: chapter-2
    name:
      ru: Чей он сын
      en: His father’s son
    blocks:
      - type: text
        text:
          ru: "Отец Bull Inthe Heather — Фердинанд, конь знаменитый: в 1986 году он выиграл Кентуккийское дерби под Биллом Шумейкером, а через год его признали лошадью года в Америке. Мать — кобыла Heather Road, «Вересковая дорога». Вырастили жеребёнка в Кентукки, на ферме Клейборн, вместе с Джоном Фрэнксом."
          en:
            text: "Bull Inthe Heather’s father was Ferdinand, a famous horse: in 1986 he won the Kentucky Derby under Bill Shoemaker, and the next year he was named Horse of the Year in America. His mother was the mare Heather Road. The colt was bred in Kentucky by Claiborne Farm together with John Franks."
            draft: true
        sources:
          - title: Old Friends — BULL INTHE HEATHER (1990–2014)
            url: https://oldfriendsequine.org/horse/bull-inthe-heather/
          - title: netkeiba — Bull Inthe Heather, horse 000a02173d
            url: https://en.netkeiba.com/db/horse/000a02173d/
          - title: Equibase — Bull Inthe Heather Euthanized at Old Friends
            url: https://cms.equibase.com/node/4118
          - title: Joe Nevills — Bull Inthe Heather, Florida Derby winner, dies at Old Friends
            url: https://www.drf.com/news/bull-inthe-heather-florida-derby-winner-dies-old-friends
          - title: Kentucky Derby — Past Winners
            url: https://www.kentuckyderby.com/past-winners/
          - title: UPI — The Kentucky Derby-winning team of jockey Bill Shoemaker and...
            url: https://www.upi.com/Archives/1986/05/04/The-Kentucky-Derby-winning-team-of-jockey-Bill-Shoemaker-and/2709515563200/
          - title: The Jockey Club — Fact Book Racing Chronicle (2022)
            url: https://www.jockeyclub.com/factbook/Chronicle/2022_Chronicle.pdf
          - title: Los Angeles Times — Ferdinand Is Horse of the Year
            url: https://www.latimes.com/archives/la-xpm-1988-01-27-mn-26095-story.html
      - type: text
        text:
          ru: "Обратите внимание, как пишется его кличка: Inthe — слитно. Правила разрешают коню имя не длиннее восемнадцати знаков вместе с пробелами. «Bull In The Heather» с пробелами — девятнадцать. «Bull Inthe Heather» — ровно восемнадцать."
          en:
            text: "Notice how his name is written: Inthe is one word. The rules allow a horse’s name to have no more than eighteen characters, including spaces. “Bull In The Heather” with spaces has nineteen. “Bull Inthe Heather” has exactly eighteen."
            draft: true
        sources:
          - title: "Bill Barich / The New Yorker — Race Track—I: Laughing in the Hills"
            url: https://www.newyorker.com/magazine/1980/05/05/race-track-i-laughing-in-the-hills
          - title: The Washington Post — No Easy Task to Name Names
            url: https://www.washingtonpost.com/archive/sports/1992/01/04/no-easy-task-to-name-names/51968299-4a5b-46b6-9766-a608c9027501/
          - title: "The Jockey Club — The American Stud Book: Principal Rules and Requirements"
            url: https://www.registry.jockeyclub.com/RegistryIncludes/pdfs/rule_book.pdf
          - title: The Jockey Club — Foal crop 2000, sire contributions
            url: https://w07.jockeyclub.com/default.asp?area=23&foalcrop=2000&generation=1&section=Resources
      - type: text
        text:
          ru: Откуда взялось имя отца, рассказывают по-разному. Историк чистокровного коннозаводства Авалин Хантер связывает его с быком Фердинандом из детской книжки Манро Лифа — с быком, который не хотел драться на корриде и любил сидеть под пробковым дубом и нюхать цветы. А сам владелец, Говард Кек, вспоминал, что имя пришло от статуэтки буйвола, которая была у его жены Элизабет. Как бы то ни было, у сына в кличке тоже бык — только в вереске.
          en:
            text: "There are different accounts of his father’s name. Thoroughbred historian Avalyn Hunter connects it to Ferdinand the bull in Munro Leaf’s children’s book: the bull who did not want to fight in the bullring and liked sitting under a cork tree smelling flowers. But his owner, Howard Keck, recalled that the name came from a buffalo figurine belonging to his wife, Elizabeth. Either way, there is a bull in the son’s name too, only this one is in the heather."
            draft: true
        sources:
          - title: Avalyn Hunter — Ferdinand, American Classic Pedigrees
            url: https://www.americanclassicpedigrees.com/ferdinand.html
          - title: "Eric Carle Museum — Under the Cork Tree: The Story of Ferdinand"
            url: https://carlemuseum.org/art-books/exhibitions/current-exhibition/under-cork-tree-story-ferdinand
          - title: "Los Angeles Times — CROWNING GLORY: Cars Go Too Fast for Howard B. Keck; He Prefers Horses, Such as Ferdinand"
            url: https://www.latimes.com/archives/la-xpm-1986-05-15-sp-5308-story.html
          - title: Equibase / BloodHorse — Bull Inthe Heather Euthanized at Old Friends
            url: https://cms.equibase.com/node/4118
          - title: Old Friends — BULL INTHE HEATHER (1990–2014)
            url: https://oldfriendsequine.org/horse/bull-inthe-heather/
  - id: chapter-3
    name:
      ru: Как дают имена скаковым лошадям
      en: How racehorses get their names
    blocks:
      - type: text
        text:
          ru: "Назвать скаковую лошадь как вздумается нельзя. В Америке клички утверждает Жокей-клуб, в Британии — компания Weatherbys, а над ними действуют международные правила. Не больше восемнадцати знаков. Нельзя назвать лошадь в честь живого человека без его письменного согласия. Нельзя рекламу, нельзя непристойное. И есть список имён, закрытых навсегда: так защищены клички победителей главных скачек мира и самых знаменитых производителей."
          en:
            text: You cannot name a racehorse just anything you like. In America, names are approved by The Jockey Club; in Britain, by Weatherbys, with international rules above them. No more than eighteen characters. You cannot name a horse after a living person without their written permission. No advertising, no obscenity. And there is a list of names closed forever, protecting the names of winners of the world’s major races and the most famous breeding horses.
            draft: true
        sources:
          - title: The Jockey Club — Principal Rules and Requirements of The American Stud Book, Rule 6
            url: https://www.registry.jockeyclub.com/RegistryIncludes/pdfs/rule_book.pdf
          - title: "Weatherbys Racing Admin — User Guide: Register Horse Name"
            url: https://support.racingadmin.co.uk/opencms/export/sites/weatherbys/racing-admin-support/.galleries/racing-admin-downloads/User-Guide-Register-Name.pdf
          - title: IFHA — International Agreement on Breeding, Racing and Wagering, Article 14
            url: https://www.ifhaonline.org/default.asp?AREA=2&section=IABRW
          - title: IFHA — International List of Protected Names, Appendix 9
            url: https://www.ifhaonline.org/resources/NP_2024.pdf
      - type: text
        text:
          ru: "Чаще всего кличку собирают из имён родителей. Отца британского чемпиона Kauto Star звали Village Star, мать — Kauto Relka. Отца Сухаря, Seabiscuit, звали Hard Tack — и то и другое значит «морской сухарь». А бывает, что проверку проскакивает то, что не должно было проскочить: в Южной Африке бегал конь по кличке Hoof Hearted — прочтите вслух."
          en:
            text: "Names are most often assembled from the parents’ names. The British champion Kauto Star’s sire was Village Star and his dam was Kauto Relka. Seabiscuit’s sire was Hard Tack: both names mean a ship’s biscuit. Sometimes something slips through that should not: a horse in South Africa raced as Hoof Hearted. Read it aloud."
            draft: true
        sources:
          - title: "Great British Racing — Guide: How do you pick a name for a racehorse?"
            url: https://www.greatbritishracing.com/features/guide-how-do-you-pick-a-name-for-a-racehorse/
          - title: ESPN Classic — Heart of a Champion
            url: https://a.espncdn.com/classic/s/add_seabiscuit.html
          - title: Racing Post — The art, rules and rudeness of naming racehorses
            url: https://www.racingpost.com/news/features/series/the-art-rules-and-rudeness-of-naming-racehorses-aKhbD0H3baKM/
  - id: chapter-4
    name:
      ru: Как записали песню
      en: Recording the song
    blocks:
      - type: text
        text:
          ru: Песню записали осенью 1993 года в Нью-Йорке, в студии Sear Sound. Продюсером вместе с группой был Бутч Виг — тот самый, что за два года до этого записал Nevermind с Nirvana. Основу сыграли живьём, все четверо разом, без наложений. Поёт Ким Гордон, она же написала слова; музыку в выходных данных записали на всю четвёрку — Гордон, Мура, Ранальдо и Шелли.
          en:
            text: "The song was recorded in autumn 1993 at Sear Sound in New York. The band’s co-producer was Butch Vig, who had recorded Nevermind with Nirvana two years earlier. The basic track was played live, all four together, without overdubs. Kim Gordon sings and wrote the lyrics; the music was credited to all four: Gordon, Moore, Ranaldo and Shelley."
            draft: true
        sources:
          - title: SonicYouth.com discography — Bull in the Heather (archived 2015-02-18)
            url: https://web.archive.org/web/20150218044901/http://www.sonicyouth.com/mustang/lp/ep35.html
          - title: Radio & Records — Sonic Youth’s 10th, p. 28
            url: https://www.worldradiohistory.com/Archive-All-Music/Archive-RandR/1990s/1994/RR-1994-03-04.pdf
          - title: Gearspace — Interview with Butch Vig with co-engineer Billy Bush
            url: https://gearspace.com/threads/interview-with-butch-vig-with-co-engineer-billy-bush.1366015/
          - title: "Chris Lawrence — Sonic Youth Timeline: Concert Chronology + Sessionography"
            url: https://www.soniclife.ca/sy/cc/timeline.html
          - title: Chico News & Review — History in the mix
            url: https://www.newsreview.com/chico/content/history-in-the-mix/70653/
          - title: "MusicBrainz — CMJ New Music Monthly, Volume 10: May 1994"
            url: https://musicbrainz.org/release/d210933c-f7ad-42a5-96d6-9fc50dfeb0ad
          - title: "Ana Monroy Yglesias / Recording Academy — Nirvana’s Era-Defining Nevermind: For The Record"
            url: https://www.grammy.com/news/nirvanas-era-defining-nevermind-record/
  - id: chapter-5
    name:
      ru: О чём песня
      en: What the song is about
    blocks:
      - type: text
        text:
          ru: В 1994 году это слушалось рядом с движением riot grrrl — девичьими панк-группами, которые требовали места для женщин в музыке, — и Гордон позвала в клип одну из главных его фигур.
          en:
            text: In 1994, it was heard alongside riot grrrl, the movement of women’s punk bands demanding space for women in music, and Gordon invited one of its leading figures into the video.
            draft: true
        sources:
          - title: Vogue — Why Kim Gordon and Her New Memoir Will Outlive the Lana Del Rey Twitter Controversy
            url: https://www.vogue.com/article/kim-gordon-interview-girl-in-a-band-memoir
  - id: chapter-6
    name:
      ru: Клип
      en: The video
    blocks:
      - type: text
        text:
          ru: "Клип сняла Тамра Дэвис. В нём с группой танцует Кэтлин Ханна, певица Bikini Kill, — в кедах и с косичками, и всё время сбивает музыкантов с их рок-поз. Гордон хотела показать её весёлой: тогда о Ханне и о riot grrrl писали как о чём-то злом и мрачном."
          en:
            text: "Tamra Davis directed the video. Kathleen Hanna, the Bikini Kill singer, dances with the band in sneakers and pigtails, constantly knocking the musicians out of their rock poses. Gordon wanted to show her having fun: at the time, Hanna and riot grrrl were written about as angry and gloomy."
            draft: true
        sources:
          - title: Billboard 106(22), Production Notes p. 34; charts
            url: https://www.worldradiohistory.com/Archive-All-Music/Billboard/90s/1994/BB-1994-05-28.pdf
          - title: CMJ New Music Report, May 9 1994 — video review and album advertisement
            url: https://www.worldradiohistory.com/Archive-All-Music/CMJ/1994/CMJ-New-Music-Report-1994-05-09.pdf
          - title: Alex Frank — On the Eve of Her New Memoir, the Best Videos of Kim Gordon on YouTube
            url: https://www.vogue.com/article/kim-gordon-girl-in-a-band-youtube-videos
          - title: Rolling Stone Australia — Sonic Youth, Bull in the Heather (best music videos)
            url: https://au.rollingstone.com/music/music-lists/best-music-videos-28407/sonic-youth-bull-in-the-heather-28441/
          - title: Vogue — Why Kim Gordon and Her New Memoir Will Outlive the Lana Del Rey Twitter Controversy
            url: https://www.vogue.com/article/kim-gordon-interview-girl-in-a-band-memoir
      - type: art
        src: clip-1-full.webp
        alt:
          ru: Sonic Youth играют
          en: Sonic Youth playing
        size: wide
      - type: video
        id: 8JGBNkLM9_8
