  - id: sticker
    name:
      ru: Наклейка на бампере
      en: "A Bumper Sticker"
    blocks:
      - type: art
        src: sticker-car.webp
        alt:
          ru: Задний бампер старой машины под дождём, на нём белая наклейка
          en: "The rear bumper of an old car in the rain, with a white sticker on it"
        size: wide
      - type: text
        text:
          ru: |
            Откуда у песни такое название, сами музыканты, насколько удалось выяснить, толком не объясняли. Ходит один пересказ, и он очень похож на правду. Боб Настанович, барабанщик группы Pavement, с которой Sonic Youth дружили и ездили в туры, был страстным любителем скачек — из тех, кто знает клички лошадей лучше, чем имена соседей. Говорят, он прислал Терстону и Ким наклейку на бампер с именем коня, который только что выиграл во Флориде.

            Имя было странное и красивое: Bull Inthe Heather, «бык в вереске», причём «in» и «the» срослись в одно слово. Почему так — расскажем во второй части, когда дойдём до коня. А группа слова разлепила обратно, и песня стала называться правильно: Bull in the Heather.
          en: |
            As far as we could establish, the musicians themselves never quite explained where the title came from. One story circulates, and it has the ring of truth. Bob Nastanovich, the drummer in Pavement, friends and touring companions of Sonic Youth, was a passionate racing fan—the kind who knows horses’ names better than his neighbors’. He is said to have sent Thurston and Kim a bumper sticker bearing the name of a horse that had just won in Florida.

            It was a strange and beautiful name: Bull Inthe Heather, with “in” and “the” fused into a single word. We will come to the reason in the second part, when we get to the horse. The band separated the words again, and the song became, properly, Bull in the Heather.
        sources:
          - title: "uDiscover Music — The Best Sonic Youth Songs: Alternative Classics"
            url: https://www.udiscovermusic.com/stories/sonic-youth-best-songs-feature/

  - id: studio
    name:
      ru: Вчетвером, сразу на плёнку
      en: "All Four, Straight to Tape"
    blocks:
      - type: art
        src: band-1993.webp
        alt:
          ru: Четверо музыкантов играют кругом в студии, лицом друг к другу
          en: "Four musicians play in a circle in a studio, facing one another"
        size: bleed
      - type: text
        text:
          ru: |
            Альбом Experimental Jet Set, Trash and No Star записывали осенью 1993 года в Нью-Йорке, на студии Sear Sound. Продюсером вместе с группой был Бутч Виг — тот самый, что за два года до этого записал Nevermind. Можно было ждать, что он сделает и Sonic Youth гладкими и громкими, но вышло наоборот: альбом получился тихим, сухим, местами почти домашним. В журнале Billboard тогда писали, что группа смотрела в сторону лоу-фая — Pavement, Sebadoh, Royal Trux, — молодых групп, которые записывались как придётся и этим гордились.

            Bull in the Heather записали так, как записывали песни в шестидесятые. По словам Вига, основу сыграли живьём: все четверо стояли в одной комнате и играли одновременно, и всё это сразу шло на плёнку. Поверх почти ничего не накладывали. Слова написала Ким Гордон, она же их и спела, а музыку в выходных данных записали на всю четвёрку.

            Обложку сингла нарисовала сама Ким — тонкой линией, лицо. Оформлял пластинку дизайнер Кевин Рейган, он же собрал обложку альбома из четырёх портретов. Сингл вышел весной 1994 года на семидюймовой пластинке, на серебристой десятидюймовой, на компакт-диске и на кассете.
          en: |
            Experimental Jet Set, Trash and No Star was recorded in the fall of 1993 at Sear Sound in New York. Co-producing with the band was Butch Vig—the same man who had recorded Nevermind two years earlier. You might have expected him to make Sonic Youth sound sleek and loud, too. The opposite happened: the album was quiet, dry, at times almost homemade. Billboard wrote at the time that the band was looking toward lo-fi—Pavement, Sebadoh, Royal Trux—young bands who recorded any way they could and were proud of it.

            Bull in the Heather was recorded the way songs had been recorded in the sixties. According to Vig, the basic track was cut live: all four stood in one room and played together, everything going straight to tape. Almost nothing was overdubbed. Kim Gordon wrote the words and sang them; the music was credited to all four.

            Kim herself drew the single’s cover: a face in fine lines. The record’s designer was Kevin Reagan, who also assembled the album cover from four portraits. The single came out in the spring of 1994 on seven-inch vinyl, silver ten-inch vinyl, CD, and cassette.
        sources:
