  - id: band
    kicker:
      ru: Часть первая. Песня
      en: "Part One. The Song"
    name:
      ru: Четверо из Нью-Йорка
      en: "Four from New York"
    blocks:
      - type: text
        text:
          ru: |
            К 1993 году Sonic Youth играли вместе уже двенадцать лет. Группа выросла на нью-йоркской сцене начала восьмидесятых, где шумовая музыка, художественные галереи и панк жили в одних и тех же подвалах. Четверых музыкантов узнавали издалека. Ким Гордон, басистка и певица, — тонкая, светловолосая, с холодным спокойным лицом, в полосатой футболке или коротком платье. Терстон Мур, её муж, — почти двухметровый, нескладный, с чёлкой, которая вечно падала на глаза. Ли Ранальдо — кудрявый, старше на вид остальных, тот, кто мог взять барабанную палочку и водить ею по струнам, как смычком. И Стив Шелли за барабанами — короткая стрижка, очки, самый аккуратный человек в самой неаккуратной группе.

            Гитары у них звучали не так, как у всех. Мур и Ранальдо почти никогда не играли в обычном строе: перестраивали струны как вздумается, засовывали под них отвёртки и палочки, били по струнам за подставкой, где гитара не должна звучать вовсе. Из этого получалась музыка, похожая одновременно на колокола, на сирены и на расстроенное пианино в пустом доме.

            С 1990 года Sonic Youth записывались на большом лейбле DGC — на том же, где через год вышел Nevermind группы Nirvana. А когда мир внезапно полюбил гитарный шум, Sonic Youth, которые занимались им десять лет, оказались не в подвале, а в центре событий.
          en: |
            By 1993, Sonic Youth had been playing together for twelve years. The band had grown out of the early-eighties New York scene, where noise music, art galleries, and punk shared the same basements. You could recognize the four musicians from a distance. Kim Gordon, bassist and singer: slender, fair-haired, her face cool and composed, in a striped T-shirt or a short dress. Thurston Moore, her husband: nearly two meters tall, gangly, with a fringe that kept falling into his eyes. Lee Ranaldo: curly-haired, older-looking than the others, the one who might pick up a drumstick and draw it across the strings like a bow. And Steve Shelley behind the drums: short hair, glasses, the neatest man in the untidiest band.

            Their guitars sounded like nobody else’s. Moore and Ranaldo almost never used standard tuning: they retuned the strings however they pleased, wedged screwdrivers and sticks beneath them, struck them behind the bridge, where a guitar was not supposed to make a sound at all. The music that came out sounded at once like bells, sirens, and an out-of-tune piano in an empty house.

            Since 1990, Sonic Youth had been recording for the major label DGC—the same label that released Nirvana’s Nevermind a year later. And when the world suddenly fell in love with guitar noise, Sonic Youth, who had been making it for ten years, found themselves out of the basement and at the center of things.
        sources:
          - title: Radio & Records — Sonic Youth’s 10th, p. 28
            url: https://www.worldradiohistory.com/Archive-All-Music/Archive-RandR/1990s/1994/RR-1994-03-04.pdf
          - title: Chris Lawrence — Sonic Youth guitar tunings, Experimental Jet Set
            url: https://www.soniclife.ca/sy/tab/tunings.html#jet
