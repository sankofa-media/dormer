  - id: chapter-8
    name:
      ru: Что было с песней дальше
      en: The song’s later life
    blocks:
      - type: text
        text:
          ru: Стивен Малкмус из Pavement говорил, что в своей песне Stereo пытался сделать что-то вроде Bull in the Heather, только поприлипчивее. Её перепели The Go! Team. Sonic Youth сыграли её на концертах больше трёхсот раз — например, 4 июля 2008 года в Баттери-парке в Нью-Йорке, — а журнал SPIN включил её в число тринадцати песен, лучше всего показывающих Ким Гордон.
          en:
            text: Stephen Malkmus of Pavement said that with his song Stereo he was trying to do something like Bull in the Heather, only catchier. The Go! Team covered it. Sonic Youth played it live more than three hundred times, including on July 4, 2008, in Battery Park, New York, and SPIN included it among thirteen songs that best represent Kim Gordon.
            draft: true
        sources:
          - title: William Goodman — Stephen Malkmus on Pavement’s Funky Tune
            url: https://www.spinmagazine.com/2009/01/stephen-malkmus-pavements-funky-tune/
          - title: KEXP — Sub Pop catalogue SP701–SP800, SP0756
            url: https://www.kexp.org/subpop/sp701-sp800/
          - title: The Go! Team — Bull In The Heather, official audio
            url: https://www.youtube.com/watch?v=xwccuQSe98w
          - title: setlist.fm — Bull in the Heather performed by Sonic Youth
            url: https://www.setlist.fm/stats/songs/sonic-youth-2bd6b812.html?songid=5bd68b14
          - title: "Sonic Youth — Bull In The Heather (Battery Park, NYC: July 4th 2008), official audio"
            url: https://www.youtube.com/watch?v=O93OobL8QpI
          - title: SPIN — 13 Best Sonic Youth Songs That Showcase Kim Gordon
            url: https://www.spinmagazine.com/2019/10/kim-gordon-sonic-youth-best-songs/
  - id: chapter-9
    name:
      ru: Финиш
      en: The finish
    blocks:
      - type: text
        text:
          ru: Bull Inthe Heather выходит вперёд на прямой и приходит первым, на два корпуса впереди Storm Tower. Время — минута пятьдесят одна и одна пятая секунды. Тот, кто поставил на него два доллара, получает шестьдесят долларов восемьдесят центов.
          en:
            text: Bull Inthe Heather takes the lead in the stretch and finishes first, two lengths ahead of Storm Tower. His time is one minute, fifty-one and one-fifth seconds. A two-dollar bet on him returns sixty dollars and eighty cents.
            draft: true
        sources:
          - title: "Churchill Downs — Stakes Histories: Florida Derby"
            url: https://www.kentuckyderby.com/wp-content/uploads/sites/2/2025/08/Stakes-Histories-Florida-Derby-2025.pdf
          - title: Gulfstream Park — 2025/2026 Media Guide, Section 2
            url: https://www.gulfstreampark.com/assets/71tzd15sgbj0/6qrG21gebw1MEfinO6tTOh/5d649b43265e678cc4dd55e6f65d9c38/GulfstreamMediaGuide_Sec2_p1-80_FINAL.pdf
          - title: Bill Christine — Bull Inthe Heather Scores Upset, Los Angeles Times
            url: https://www.latimes.com/archives/la-xpm-1993-03-21-sp-13581-story.html
          - title: Les Kjos — Bull Inthe Heather wins Florida Derby, UPI
            url: https://www.upi.com/amp/Archives/1993/03/20/Bull-Inthe-Heather-wins-Florida-Derby/5384732603600/
  - id: kentucky
    name:
      ru: Полтора месяца спустя
      en: Six weeks later
    blocks:
      - type: text
        text:
          ru: Первого мая 1993 года он бежал Кентуккийское дерби, главную скачку Америки, ту самую, что когда-то выиграл его отец. Пришёл одиннадцатым. Потом были другие скачки — вторые места, Belmont Stakes, — но таких побед, как во Флориде, больше не было. Ещё в октябре 1994 года он пришёл в Белмонте девятым, последним.
          en:
            text: On May 1, 1993, he ran in the Kentucky Derby, America’s greatest race, the one his father had once won. He finished eleventh. Other races followed — second places, the Belmont Stakes — but there were no more wins like Florida. In October 1994, he finished ninth and last at Belmont.
            draft: true
        sources:
