chapters:

  - id: intro
    name:
      ru: Бык в вереске
      en: "Bull in the Heather"
    blocks:
      - type: text
        text:
          ru: |
            Весной 1994 года по MTV крутили клип, в котором ничего особенного вроде бы не происходило. Четверо музыкантов играли в комнате с розовыми стенами. Худая блондинка с белой бас-гитарой пела, почти не повышая голоса, будто разговаривала сама с собой. А вокруг них носилась девушка с двумя короткими косичками и в кедах: дёргала гитаристов за рукава, передразнивала их позы, задирала майку, падала на пол и снова вскакивала. Между кадрами то и дело мелькали скаковые лошади.

            Песня называлась «Bull in the Heather» — «Бык в вереске». Её написала группа Sonic Youth, и она стала, пожалуй, самой известной их песней из тех, что крутило радио. Девушку с косичками звали Кэтлин Ханна, она пела в панк-группе Bikini Kill и за год до того перестала разговаривать с журналистами. А название песни принадлежало настоящему коню — серому жеребцу, который весной 1993 года под проливным дождём выиграл во Флориде большую скачку, хотя ставили на него двадцать девять к одному.

            Это история о песне, о девушке и о коне. Песня жива и до сих пор звучит. Конь прожил долгую жизнь и умер на ферме для старых лошадей, которую открыли из-за гибели его отца.
          en: |
            In the spring of 1994, MTV was showing a video in which nothing much seemed to happen. Four musicians played in a room with pink walls. A thin blonde woman with a white bass sang, barely raising her voice, as though talking to herself. Around them darted a girl in sneakers with two short pigtails: tugging at the guitarists’ sleeves, mimicking their poses, lifting her shirt, falling to the floor and springing up again. Between shots, racehorses kept flashing past.

            The song was called “Bull in the Heather.” Sonic Youth had written it, and it became perhaps the best known of their songs to get radio play. The girl with the pigtails was Kathleen Hanna, singer in the punk band Bikini Kill, who a year earlier had stopped speaking to journalists. And the song’s title belonged to a real horse—a gray stallion who, in the spring of 1993, had won a major race in Florida in a downpour, at odds of twenty-nine to one.

            This is a story about a song, a girl, and a horse. The song is still alive, still being played. The horse lived a long life and died at a retirement farm founded because of his father’s death.
        sources:
          - title: Sonic Youth — Bull In The Heather, official music video
            url: https://www.youtube.com/watch?v=8JGBNkLM9_8
          - title: CMJ New Music Report, May 9 1994 — video review
