id: bull-in-the-heather
title:
  ru: Bull in the Heather
  en: Bull in the Heather
dek:
  ru: Песня Sonic Youth, скаковой конь, в честь которого она названа, и его отец
  en: The Sonic Youth song, the racehorse it was named after, and his father
date: 2026-11-20
editorial_notes:
  - Russian quoted blocks copied verbatim from STORYBOARD.ru.md. Markdown emphasis is preserved in content.
  - Omitted the two opening sentences at pole 5 pending verification of words-01; the last sentence at pole 6 pending words-04; the second sentence in April 2014 pending confirmation of location.
  - Bumper sticker account retained as explicitly attributed hearsay; the verification note requests a direct account, not suppression of the attributed secondary version.
  - Runner order provisional; no unverified racing colours are represented.
