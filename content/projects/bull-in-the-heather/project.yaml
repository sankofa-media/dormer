  - id: father
    name:
      ru: Отец
      en: The father
    blocks:
      - type: text
        text:
          ru: А Фердинанда в 1994 году продали в Японию. Шесть лет он стоял там на конном заводе. Потом его следы теряются. В 2003 году журнал Blood-Horse сообщил, что победитель Кентуккийского дерби погиб в Японии в 2002 году — скорее всего, на бойне. Где и когда точно, так и не установили.
          en:
            text: Ferdinand was sold to Japan in 1994. He spent six years at a stud farm there. Then his trail goes cold. In 2003, Blood-Horse reported that the Kentucky Derby winner had died in Japan in 2002, most likely in a slaughterhouse. Exactly where and when was never established.
            draft: true
        sources:
          - title: "America's Best Racing — Ferdinand: Whittingham’s Memorable Derby Winner"
            url: https://www.americasbestracing.net/the-sport/2021-ferdinand-whittinghams-memorable-derby-winner
          - title: Avalyn Hunter — Ferdinand, American Classic Pedigrees
            url: https://www.americanclassicpedigrees.com/ferdinand.html
          - title: "Ray Paulick — Death of a Derby Winner: Slaughterhouse Likely Fate for Ferdinand (reprint)"
            url: https://www.thehorseguide.com/equestrian-news/death-of-a-derby-winner-slaughterhouse-likely-fate-for-ferdinand/
          - title: Thoroughbred Daily News — Ferdinand Likely Slaughtered in Japan
            url: https://www.thoroughbreddailynews.com/pdf/tdn/2003/tdn030723.pdf
      - type: text
        text:
          ru: Американские конники были потрясены. На нью-йоркских ипподромах ввели добровольный «сбор Фердинанда» — два доллара в пользу приютов для старых скаковых лошадей. В договоры о продаже жеребцов за границу стали вписывать право выкупить коня домой, когда он больше не нужен.
          en:
            text: "American horse people were shocked. New York racetracks introduced a voluntary “Ferdinand fee”: two dollars to support homes for retired racehorses. Contracts for stallions sold abroad began to include the right to buy a horse back home when he was no longer needed."
            draft: true
        sources:
          - title: "Ray Paulick — Death of a Derby Winner: Slaughterhouse Likely Fate for Ferdinand (reprint)"
            url: https://www.thehorseguide.com/equestrian-news/death-of-a-derby-winner-slaughterhouse-likely-fate-for-ferdinand/
          - title: Manes and Tails Organization — Spring 2007
            url: https://www.manesandtailsorganization.org/spring_2007.html
          - title: Winnipeg Free Press — Saddling up FOR SLAUGHTER
