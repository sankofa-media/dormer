  - id: derby
    kicker:
      ru: Часть вторая. Конь
      en: "Part Two. The Horse"
    name:
      ru: Двадцать девять к одному
      en: "Twenty-Nine to One"
    blocks:
      - type: art
        src: rain-track.webp
        alt:
          ru: Ипподром во Флориде под дождём, пустая раскисшая дорожка, пальмы вдали
          en: "A Florida racetrack in the rain, the empty track sodden, palm trees in the distance"
        size: bleed
      - type: text
        text:
          ru: |
            А теперь вернёмся на год назад, в Южную Флориду. Двадцатое марта 1993 года, ипподром Галфстрим-парк, скачка Florida Derby — одна из главных весенних проверок для трёхлеток, которые метят в Кентуккийское дерби. Весь день льёт дождь, дорожка раскисла и превратилась в жидкую грязь. Стартуют тринадцать лошадей. Среди них серый жеребец Bull Inthe Heather. Ставки на него — двадцать девять к одному. Это значит, что в него почти никто не верит.

            Девять фурлонгов, чуть меньше двух километров. Он держится где-то восьмым, в середине табуна, где летит грязь из-под копыт идущих впереди. На дальнем повороте жокей находит просвет и проводит его между лошадьми. Фаворит Great Navigator выдыхается. На прямой серый обходит Storm Tower и уходит вперёд.
          en: |
            Now let us go back a year, to South Florida. March 20, 1993, Gulfstream Park, the Florida Derby—one of the major spring tests for three-year-olds with their sights on the Kentucky Derby. Rain has been falling all day, turning the track to liquid mud. Thirteen horses go to the start. Among them is a gray stallion, Bull Inthe Heather. His odds are twenty-nine to one. Almost nobody believes in him.

            Nine furlongs, just under two kilometers. He runs somewhere around eighth, in the middle of the field, where mud flies from the hooves ahead. On the far turn, his jockey finds a gap and guides him between horses. The favorite, Great Navigator, fades. In the stretch, the gray passes Storm Tower and pulls away.
        sources:
          - title: Les Kjos — Bull Inthe Heather wins Florida Derby, UPI
            url: https://www.upi.com/amp/Archives/1993/03/20/Bull-Inthe-Heather-wins-Florida-Derby/5384732603600/
          - title: Bill Christine — Bull Inthe Heather Scores Upset, Los Angeles Times
            url: https://www.latimes.com/archives/la-xpm-1993-03-21-sp-13581-story.html
          - title: "Churchill Downs — Stakes Histories: Florida Derby"
            url: https://www.kentuckyderby.com/wp-content/uploads/sites/2/2025/08/Stakes-Histories-Florida-Derby-2025.pdf
          - title: Gulfstream Park — 2025/2026 Media Guide, Section 2
            url: https://www.gulfstreampark.com/assets/71tzd15sgbj0/6qrG21gebw1MEfinO6tTOh/5d649b43265e678cc4dd55e6f65d9c38/GulfstreamMediaGuide_Sec2_p1-80_FINAL.pdf
      - type: art
        src: pack.webp
        alt:
          ru: Табун скаковых лошадей на повороте в брызгах грязи
          en: "A field of racehorses rounds a turn in a spray of mud"
        size: bleed
      - type: art
        src: finish.webp
        alt:
          ru: Серый конь пересекает финиш один, остальные — бледные тени позади
          en: "A gray horse crosses the finish alone, the others pale shadows behind him"
        size: bleed
