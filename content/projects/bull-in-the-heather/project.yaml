  - id: name
    name:
      ru: Чей он сын и почему Inthe
      en: "His Father’s Son, and Why “Inthe”"
    blocks:
      - type: text
        text:
          ru: |
            Отец Bull Inthe Heather был знаменит. Это Фердинанд, гнедой конь, который в 1986 году выиграл Кентуккийское дерби под пятидесятичетырёхлетним Биллом Шумейкером — старейшим жокеем, когда-либо выигрывавшим дерби, — а через год был признан лучшей лошадью Америки. Мать — кобыла Heather Road, «Вересковая дорога». Жеребёнка вырастили в Кентукки, на ферме Клейборн.

            Откуда имя у отца, рассказывают по-разному. Историк чистокровного коннозаводства Авалин Хантер связывает его с быком Фердинандом из детской книжки Манро Лифа 1936 года — с быком, который не хотел драться на корриде, а любил сидеть под пробковым дубом и нюхать цветы. А сам владелец, нефтяной магнат Говард Кек, вспоминал, что имя пришло от фигурки буйвола, которая была у его жены Элизабет. Так или иначе, у сына в кличке тоже бык — только не под дубом, а в вереске, на материнской дороге. Кто именно выбрал имя Bull Inthe Heather, найти не удалось.
          en: |
            Bull Inthe Heather’s father was famous. He was Ferdinand, the bay who won the Kentucky Derby in 1986 under fifty-four-year-old Bill Shoemaker—the oldest jockey ever to win the Derby—and was named America’s Horse of the Year the following year. His mother was the mare Heather Road. The foal was raised in Kentucky, at Claiborne Farm.

            There are different accounts of where his father’s name came from. The Thoroughbred historian Avalyn Hunter links it to Ferdinand the bull in Munro Leaf’s 1936 children’s book—the bull who did not want to fight in the bullring, preferring to sit beneath a cork tree and smell the flowers. His owner, the oil magnate Howard Keck, recalled that the name came from a buffalo figurine belonging to his wife, Elizabeth. Either way, there is a bull in the son’s name, too—only he is in the heather rather than beneath an oak, on his mother’s road. We could not discover who chose the name Bull Inthe Heather.
        sources:
          - title: Kentucky Derby — Past Winners
            url: https://www.kentuckyderby.com/past-winners/
          - title: UPI — The Kentucky Derby-winning team of jockey Bill Shoemaker and...
            url: https://www.upi.com/Archives/1986/05/04/The-Kentucky-Derby-winning-team-of-jockey-Bill-Shoemaker-and/2709515563200/
          - title: Los Angeles Times — Ferdinand Is Horse of the Year
            url: https://www.latimes.com/archives/la-xpm-1988-01-27-mn-26095-story.html
          - title: Old Friends — BULL INTHE HEATHER (1990–2014)
            url: https://oldfriendsequine.org/horse/bull-inthe-heather/
          - title: Avalyn Hunter — Ferdinand, American Classic Pedigrees
            url: https://www.americanclassicpedigrees.com/ferdinand.html
          - title: "Eric Carle Museum — Under the Cork Tree: The Story of Ferdinand"
            url: https://carlemuseum.org/art-books/exhibitions/current-exhibition/under-cork-tree-story-ferdinand
          - title: Los Angeles Times — Cars Go Too Fast for Howard B. Keck; He Prefers Horses, Such as Ferdinand
            url: https://www.latimes.com/archives/la-xpm-1986-05-15-sp-5308-story.html
      - type: art
        src: bull-flowers.webp
        alt:
          ru: Большой мирный бык сидит под пробковым дубом и нюхает цветы
          en: "A large, peaceful bull sits beneath a cork oak, smelling flowers"
        size: wide
      - type: art
        src: spires-1986.webp
        alt:
          ru: Трибуны Черчилл-Даунс с двумя шпилями, гнедой конь выигрывает
          en: "The twin-spired grandstand at Churchill Downs, a bay horse winning the race"
        size: wide
        caption:
          ru: Черчилл-Даунс, май 1986 года. Фердинанд выигрывает Кентуккийское дерби.
          en: "Churchill Downs, May 1986. Ferdinand wins the Kentucky Derby."
      - type: text
        text:
          ru: |
            Теперь о том, почему «Inthe» пишется слитно. Правила американского Жокей-клуба разрешают скаковой лошади имя не длиннее восемнадцати знаков, причём пробелы и знаки препинания тоже считаются. Посчитайте: «Bull In The Heather» с пробелами — девятнадцать знаков. Не проходит. «Bull Inthe Heather» — ровно восемнадцать. Мы не нашли документа, где было бы написано, что владельцы склеили слова именно поэтому. Но арифметика красноречива.
          en: |
            Now for the reason “Inthe” is written as one word. The American Jockey Club’s rules allow a racehorse a name of no more than eighteen characters, counting spaces and punctuation. Count them: “Bull In The Heather,” with spaces, is nineteen characters. Too long. “Bull Inthe Heather” is exactly eighteen. We found no document stating that this was why the owners joined the words. But the arithmetic speaks for itself.
        sources:
          - title: "The Jockey Club — The American Stud Book: Principal Rules and Requirements"
            url: https://www.registry.jockeyclub.com/RegistryIncludes/pdfs/rule_book.pdf
          - title: The Washington Post — No Easy Task to Name Names
            url: https://www.washingtonpost.com/archive/sports/1992/01/04/no-easy-task-to-name-names/51968299-4a5b-46b6-9766-a608c9027501/
      - type: aside
        title:
          ru: Посчитайте сами
          en: "Count for Yourself"
        text:
          ru: "B-u-l-l, пробел, I-n-t-h-e, пробел, H-e-a-t-h-e-r — восемнадцать. Если разделить In и The, получится девятнадцать, и Жокей-клуб такое имя не зарегистрирует."
          en: "B-u-l-l, space, I-n-t-h-e, space, H-e-a-t-h-e-r—eighteen. Separate In and The and you get nineteen, and the Jockey Club will not register the name."

  - id: naming
    name:
      ru: Как называют скаковых лошадей
      en: "How Racehorses Get Their Names"
    blocks:
      - type: art
        src: ledger.webp
        alt:
          ru: Старая раскрытая книга имён на столе, перьевая ручка и подкова
          en: "An old book of names lies open on a table beside a fountain pen and a horseshoe"
        size: right
      - type: text
        text:
          ru: |
            Назвать скаковую лошадь как вздумается нельзя. В Америке клички утверждает Жокей-клуб, в Британии — компания Weatherbys, а над ними действуют международные правила. Не больше восемнадцати знаков. Нельзя назвать лошадь в честь живого человека без его письменного согласия. Нельзя ничего рекламного и ничего непристойного. И есть список имён, закрытых навсегда: так защищены клички победителей главных скачек мира и самых знаменитых производителей. Второго Сухаря не будет.

            Чаще всего кличку собирают из имён родителей, как шараду. Отца британского чемпиона Kauto Star звали Village Star, мать — Kauto Relka. Отца того самого Сухаря, Seabiscuit, звали Hard Tack, и то и другое значит «морской сухарь», галета, которую брали в долгие плавания. Bull Inthe Heather собран так же: бык от отца, вереск от матери.

            А бывает, что проверку проскакивает то, что не должно было проскочить. В Южной Африке бегал конь Hoof Hearted — прочтите вслух, и станет понятно, что заметили это слишком поздно. Знаменитого жеребца восемнадцатого века звали Potoooooooo. По преданию, конюх, которому велели написать имя Potatoes, «картошка», вывел Pot и восемь букв «о»: по-английски это читается как «пот-эйт-оуз», то есть почти «potatoes».
          en: |
            You cannot name a racehorse just anything you please. In America, names are approved by the Jockey Club; in Britain, by Weatherbys, with international rules governing both. No more than eighteen characters. No naming a horse after a living person without their written consent. Nothing commercial, nothing obscene. And there is a list of names permanently closed to newcomers, protecting the names of winners of the world’s great races and its most celebrated sires. There will be no second Seabiscuit.

            Most often, a name is assembled from the parents’ names, like a riddle. The British champion Kauto Star’s father was Village Star; his mother was Kauto Relka. Seabiscuit’s father was Hard Tack: both names mean the ship’s biscuit taken on long sea voyages. Bull Inthe Heather is put together the same way: the bull from his father, the heather from his mother.

            Sometimes, something slips through that should not have. A horse called Hoof Hearted raced in South Africa—read it aloud and you will understand what they noticed too late. A famous eighteenth-century stallion was called Potoooooooo. According to legend, a stablehand told to write down the name Potatoes wrote Pot followed by eight o’s: “pot-eight-o’s,” which sounds almost like “potatoes.”
        sources:
          - title: The Jockey Club — Principal Rules and Requirements of The American Stud Book, Rule 6
            url: https://www.registry.jockeyclub.com/RegistryIncludes/pdfs/rule_book.pdf
          - title: "Weatherbys Racing Admin — User Guide: Register Horse Name"
            url: https://support.racingadmin.co.uk/opencms/export/sites/weatherbys/racing-admin-support/.galleries/racing-admin-downloads/User-Guide-Register-Name.pdf
          - title: IFHA — International Agreement on Breeding, Racing and Wagering, Article 14
            url: https://www.ifhaonline.org/default.asp?AREA=2&section=IABRW
          - title: IFHA — International List of Protected Names, Appendix 9
            url: https://www.ifhaonline.org/resources/NP_2024.pdf
          - title: "Great British Racing — Guide: How do you pick a name for a racehorse?"
            url: https://www.greatbritishracing.com/features/guide-how-do-you-pick-a-name-for-a-racehorse/
          - title: ESPN Classic — Heart of a Champion
            url: https://a.espncdn.com/classic/s/add_seabiscuit.html
          - title: Racing Post — The art, rules and rudeness of naming racehorses
            url: https://www.racingpost.com/news/features/series/the-art-rules-and-rudeness-of-naming-racehorses-aKhbD0H3baKM/

  - id: kentucky
    name:
      ru: После победы
      en: "After the Victory"
    blocks:
      - type: text
        text:
          ru: |
            Первого мая 1993 года Bull Inthe Heather бежал Кентуккийское дерби — ту самую скачку, которую семью годами раньше выиграл его отец. Пришёл одиннадцатым. Потом были другие старты, вторые места, Белмонт-стейкс, но такой победы, как в флоридский ливень, больше не случилось. В октябре 1994 года, когда песню с его именем уже знали по всему миру, он пришёл в Белмонт-парке девятым — последним.

            Скаковой век короток. Его отправили в производители, и следующие двенадцать лет о нём почти никто не вспоминал.
          en: |
            On May 1, 1993, Bull Inthe Heather ran in the Kentucky Derby—the very race his father had won seven years earlier. He finished eleventh. Other starts followed, second places, the Belmont Stakes, but there was never another victory like the one in the Florida downpour. In October 1994, when the song bearing his name was already known around the world, he finished ninth at Belmont Park—last.

            A racing career is short. He was sent to stud, and for the next twelve years almost nobody thought of him.
        sources:
          - title: Churchill Downs — Kentucky Derby charts 1964–2007
            url: https://www.kentuckyderby.com/wp-content/uploads/sites/2/2023/10/Kentucky-Derby-1964-2007.pdf
          - title: Thoroughbred Daily News, 5 October 1994, p. 3
            url: https://www.thoroughbreddailynews.com/pdf/tdn/1994/tdn941005.pdf
          - title: Joe Nevills — Bull Inthe Heather, Florida Derby winner, dies at Old Friends
            url: https://www.drf.com/news/bull-inthe-heather-florida-derby-winner-dies-old-friends

  - id: father
    name:
      ru: Отец
      en: "The Father"
    blocks:
      - type: art
        src: ship.webp
        alt:
          ru: Коня ведут по сходням в туманном порту, фигуры совсем маленькие
          en: "A horse is led up a gangway in a fogbound port, the figures tiny"
        size: bleed
      - type: text
        text:
          ru: |
            А Фердинанда в 1994 году продали в Японию. Шесть лет он стоял там на конном заводе, но жеребята от него не удались, и его перепродали. Потом следы теряются. В 2003 году американский журнал Blood-Horse сообщил, что победитель Кентуккийского дерби и лучшая лошадь Америки 1987 года погиб в Японии в 2002 году — скорее всего, на бойне. Где и когда точно, так и не установили.

            Американские конники были потрясены. На нью-йоркских ипподромах ввели добровольный «сбор Фердинанда» — два доллара с владельцев в пользу приютов для старых скаковых лошадей. В договоры о продаже жеребцов за границу стали вписывать право выкупить коня домой, когда он больше не будет нужен.
          en: |
            Ferdinand, meanwhile, was sold to Japan in 1994. He stood at stud there for six years, but his offspring proved disappointing, and he was sold on. Then the trail goes cold. In 2003, the American magazine Blood-Horse reported that the Kentucky Derby winner and America’s 1987 Horse of the Year had died in Japan in 2002—most likely in a slaughterhouse. Exactly where and when was never established.

            The American racing world was appalled. New York racetracks introduced a voluntary “Ferdinand Fee”—two dollars from owners to support retirement homes for former racehorses. Contracts for stallions sold abroad began to include the right to buy the horse back and bring him home when he was no longer wanted.
        sources:
          - title: "America's Best Racing — Ferdinand: Whittingham’s Memorable Derby Winner"
            url: https://www.americasbestracing.net/the-sport/2021-ferdinand-whittinghams-memorable-derby-winner
          - title: "Ray Paulick — Death of a Derby Winner: Slaughterhouse Likely Fate for Ferdinand"
            url: https://www.thehorseguide.com/equestrian-news/death-of-a-derby-winner-slaughterhouse-likely-fate-for-ferdinand/
          - title: Thoroughbred Daily News — Ferdinand Likely Slaughtered in Japan
            url: https://www.thoroughbreddailynews.com/pdf/tdn/2003/tdn030723.pdf
          - title: Manes and Tails Organization — Spring 2007
            url: https://www.manesandtailsorganization.org/spring_2007.html
          - title: Winnipeg Free Press — Saddling up FOR SLAUGHTER
            url: https://www.winnipegfreepress.com/historic/2006/09/17/saddling-up-for-slaughter
