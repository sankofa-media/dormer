  - id: start
    name:
      ru: Старт
      en: The start
    blocks:
      - id: start-0
        ru: "20 марта 1993 года, ипподром Галфстрим-парк во Флориде, скачка Florida Derby. Весь день шёл дождь, и дорожка раскисла. Стартуют тринадцать трёхлеток. Среди них — серый жеребец Bull Inthe Heather. Ставят на него двадцать девять к одному: в него почти никто не верит."
        en:
          text: "March 20, 1993, Gulfstream Park in Florida: the Florida Derby. It has rained all day, and the track is sloppy. Thirteen three-year-olds are starting. Among them is a grey colt, Bull Inthe Heather. His odds are twenty-nine to one: almost nobody believes in him."
          draft: true
