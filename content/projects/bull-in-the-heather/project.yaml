  - id: pole-3
    name:
      ru: Как дают имена скаковым лошадям
      en: How racehorses get their names
    blocks:
      - id: pole-3-0
        ru: "Назвать скаковую лошадь как вздумается нельзя. В Америке клички утверждает Жокей-клуб, в Британии — компания Weatherbys, а над ними действуют международные правила. Не больше восемнадцати знаков. Нельзя назвать лошадь в честь живого человека без его письменного согласия. Нельзя рекламу, нельзя непристойное. И есть список имён, закрытых навсегда: так защищены клички победителей главных скачек мира и самых знаменитых производителей."
        en:
          text: You cannot name a racehorse just anything you like. In America, names are approved by The Jockey Club; in Britain, by Weatherbys, with international rules above them. No more than eighteen characters. You cannot name a horse after a living person without their written permission. No advertising, no obscenity. And there is a list of names closed forever, protecting the names of winners of the world’s major races and the most famous breeding horses.
          draft: true
        sources:
