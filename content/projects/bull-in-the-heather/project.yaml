  - id: influence
    name:
      ru: Что она оставила после себя
      en: "What It Left Behind"
    blocks:
      - type: text
        text:
          ru: |
            Влияние песни трудно измерить, но несколько музыкантов признались в нём прямо.

            Стивен Малкмус из Pavement, друзей и учеников Sonic Youth, рассказывал журналу SPIN, что его песня Stereo 1997 года была попыткой сделать что-то вроде Bull in the Heather, «только чуть прилипчивее». Если послушать их подряд, слышно: тот же ленивый голос, та же гитара, которая то звенит, то скрежещет, тот же упругий бас.

            Джулиан Касабланкас из The Strokes, судя по пересказу NME, признавался, что гитарную партию в песне 12:51 2003 года он у Bull in the Heather попросту стащил. Исходного интервью найти не удалось, так что пусть это останется на совести NME, — но если поставить две песни рядом, признание звучит правдоподобно.

            А в 2021 году Аарон Мейн из группы Porches вставил в свою песню Swimming Big тот самый счёт и повторы из Bull in the Heather. Он объяснял, что это было про гитарные группы, которые он слушал, когда сам начинал, и что эта считалка его успокаивала.

            Sonic Youth сыграли Bull in the Heather на концертах больше трёхсот раз — от 1994 года до самого распада группы в 2011-м. Журнал Rolling Stone поставил клип на шестьдесят восьмое место среди ста лучших клипов в истории, SPIN — песню на тридцать седьмое место среди ста лучших альтернативных песен 1994 года. В 1994-м её показывали даже Бивис и Батт-Хед, хотя что они о ней сказали, история умалчивает.
          en: |
            A song’s influence is hard to measure, but several musicians have acknowledged this one directly.

            Stephen Malkmus of Pavement, Sonic Youth’s friends and disciples, told SPIN that his 1997 song Stereo had been an attempt to do something like Bull in the Heather, “but maybe be a little catchier.” Listen to them back to back and you can hear it: the same lazy voice, the same guitar by turns ringing and scraping, the same springy bass.

            Julian Casablancas of the Strokes, according to NME’s account, admitted that he had simply stolen the guitar part for the 2003 song 12:51 from Bull in the Heather. We could not find the original interview, so the claim must remain NME’s responsibility—but put the two songs side by side and the confession sounds plausible.

            In 2021, Aaron Maine of Porches worked the counting and repetition from Bull in the Heather into his song Swimming Big. He explained that it was about the guitar bands he had listened to when he was starting out, and that he found the counting rhyme soothing.

            Sonic Youth played Bull in the Heather more than three hundred times in concert, from 1994 until the band broke up in 2011. Rolling Stone ranked the video sixty-eighth among the hundred greatest music videos of all time; SPIN placed the song thirty-seventh among the hundred best alternative songs of 1994. Even Beavis and Butt-Head showed it in 1994, though history is silent on what they said about it.
        sources:
          - title: William Goodman — Stephen Malkmus on Pavement’s Funky Tune, SPIN
            url: https://www.spinmagazine.com/2009/01/stephen-malkmus-pavements-funky-tune/
          - title: NME — The Roots of the Strokes
            url: https://www.nme.com/blogs/nme-blogs/the-roots-of-the-strokes-774852
          - title: The Pitch — Porches’ Aaron Maine on All Day Gentle Hold !
            url: https://www.thepitchkc.com/porches-aaron-maine-on-creating-all-day-gentle-hold/
          - title: Pitchfork — Porches, All Day Gentle Hold !
            url: https://pitchfork.com/reviews/albums/porches-all-day-gentle-hold/
