  - id: chapter-7
    name:
      ru: Чарты и газеты
      en: Charts and newspapers
    blocks:
      - type: text
        text:
          ru: Весной 1994 года песню крутило лос-анджелесское радио KROQ, клип взял в ротацию MTV. В британском чарте синглов она поднялась до двадцать четвёртого места, в американском чарте альтернативного рока — до тринадцатого. Альбом Experimental Jet Set, Trash and No Star вышел в начале мая и в Британии дошёл до десятого места.
          en:
            text: In spring 1994, Los Angeles radio station KROQ was playing the song, and MTV put the video in rotation. It reached number twenty-four on the UK singles chart and number thirteen on the US alternative rock chart. The album Experimental Jet Set, Trash and No Star came out in early May and reached number ten in Britain.
            draft: true
        sources:
          - title: Los Angeles Times — Hanging Out on the Fringe
            url: https://www.latimes.com/archives/la-xpm-1994-05-08-ca-55173-story.html
          - title: The Hard Report — MTV playlist effective June 27, 1994
