      - type: clipping
        style: magazine
        masthead: CMJ New Music Report
        date: "9 мая 1994"
        headline: "Bull in the Heather"
        deck:
          ru: Рецензия на клип
          en: "Video review"
        body:
          ru: «…главная звезда здесь — riot grrrl номер один и вокалистка Bikini Kill Кэтлин Ханна, в роли без слов».
          en: "“…the star of the show is #1 riot grrrl and Bikini Kill vocalist Kathleen Hanna in a non-speaking part.”"
        cite:
          publication: CMJ New Music Report
          date: "1994-05-09"
          page: "video review"
          url: https://www.worldradiohistory.com/Archive-All-Music/CMJ/1994/CMJ-New-Music-Report-1994-05-09.pdf
        paper: paper-1.webp
      - type: text
        text:
          ru: |
            После съёмок Ханна вернулась в Олимпию. Она пришла в контору лейбла Kill Rock Stars — и там узнала, что Курт Кобейн умер. Его нашли 8 апреля 1994 года; смерть датировали пятым. Клип с ней вышел через несколько недель. Альбом Sonic Youth, записанный ещё осенью, появился в начале мая, и многие слушали его как прощание, хотя группа писала его, когда Кобейн был жив.

            Дальше у Ханны была долгая жизнь. В 1998 году она записала сольный альбом под именем Julie Ruin, через год собрала электронную группу Le Tigre, в которой феминистский панк превратился в танцевальную музыку. Потом надолго исчезла со сцены, и только в 2013 году в документальном фильме «Панк-певица» объяснила почему: у неё болезнь Лайма, и несколько лет она едва могла петь. Она вернулась — сначала с группой The Julie Ruin, а в 2019 году снова с Bikini Kill. В 2024 году вышли её воспоминания «Rebel Girl». Bull in the Heather звучит и в «Панк-певице», и в документальном фильме самой Тамры Дэвис «Лучшее лето», показанном на фестивале «Сандэнс» в 2026 году.
          en: |
            After the shoot, Hanna returned to Olympia. She went to the Kill Rock Stars label’s office—and there learned that Kurt Cobain had died. He was found on April 8, 1994; his death was dated to the fifth. The video featuring her came out a few weeks later. Sonic Youth’s album, recorded the previous fall, appeared in early May, and many heard it as a farewell, though the band had written it while Cobain was alive.

            Hanna had a long life ahead of her. In 1998, she recorded a solo album under the name Julie Ruin; a year later, she formed the electronic band Le Tigre, turning feminist punk into dance music. Then she disappeared from the stage for a long time, only explaining why in the 2013 documentary The Punk Singer: she had Lyme disease, and for several years could barely sing. She came back—first with the band The Julie Ruin, then, in 2019, with Bikini Kill again. Her memoir Rebel Girl appeared in 2024. Bull in the Heather can be heard in both The Punk Singer and Tamra Davis’s own documentary The Best Summer, shown at Sundance in 2026.
        sources:
          - title: Juno Rylee — Kathleen Hanna and Bikini Kill (memoir-based essay)
            url: https://junoryleejournalism.com/2024/12/29/girl-music-003-kathleen-hanna-and-bikini-kill-alone-in-the-basement-naked-on-stage/
          - title: "TIME — Context: the April 5, 1994, death of Kurt Cobain"
            url: https://time.com/59446/nirvana-covers-hall-of-fame-lorde-st-vincent/
          - title: SPIN — Kathleen Hanna on The Julie Ruin, Bikini Kill, Le Tigre
            url: https://www.spinmagazine.com/2016/06/KATHLEEN-HANNA-JULIE-RUIN-BIKINI-KILL-LE-TIGRE-PUNK-SINGER-INTERVIEW/
          - title: KQED — Kathleen Hanna on Riot Grrrl History, Her Battle with Lyme Disease
            url: https://www.kqed.org/pop/10272/kathleen-hanna-on-riot-grrrl-history-her-battle-with-lyme-disease-and-the-punk-singer
          - title: IMDb — The Punk Singer, soundtrack
            url: https://www.imdb.com/title/tt1785612/soundtrack/
          - title: Sundance Institute — The Best Summer
            url: https://www.sundance.org/blogs/2026-sundance-film-festival-best-summer/

  - id: press
    name:
      ru: Весна 1994-го в газетах
      en: "Spring 1994 in the Papers"
    blocks:
      - type: text
        text:
          ru: |
            Девятнадцатого апреля 1994 года лейбл разослал сингл по студенческим и альтернативным радиостанциям. В Лос-Анджелесе его сразу взяла KROQ — самая влиятельная рок-станция Западного побережья. Седьмого мая песня вошла в британский чарт синглов и поднялась до двадцать четвёртого места. В американском чарте альтернативного рока она к середине июня дошла до тринадцатого и продержалась там восемь недель. С конца июня клип стоял в ротации MTV. Альбом в Британии добрался до десятого места, в Америке — до тридцать четвёртого. Это немного по меркам Nirvana и много по меркам группы, которая начинала с концертов в подвалах.
          en: |
            On April 19, 1994, the label sent the single out to college and alternative radio stations. In Los Angeles, KROQ—the West Coast’s most influential rock station—picked it up immediately. On May 7, the song entered the British singles chart, climbing to number twenty-four. By mid-June it had reached number thirteen on the American alternative rock chart, where it spent eight weeks. From late June, the video was in rotation on MTV. The album reached number ten in Britain and number thirty-four in America. Modest by Nirvana’s standards; a great deal for a band that had started out playing basements.
        sources:
          - title: Bradley Bambarger — Sonic Youth Looks Back to the Future; Billboard, 2 April 1994
            url: https://www.worldradiohistory.com/Archive-All-Music/Billboard/90s/1994/BB-1994-04-02.pdf
