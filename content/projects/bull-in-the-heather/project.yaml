            url: https://www.winnipegfreepress.com/historic/2006/09/17/saddling-up-for-slaughter
            title: Winnipeg Free Press — Saddling up FOR SLAUGHTER
      - id: father-1
        ru: Американские конники были потрясены. На нью-йоркских ипподромах ввели добровольный «сбор Фердинанда» — два доллара в пользу приютов для старых скаковых лошадей. В договоры о продаже жеребцов за границу стали вписывать право выкупить коня домой, когда он больше не нужен.
        en:
          text: "American horse people were shocked. New York racetracks introduced a voluntary “Ferdinand fee”: two dollars to support homes for retired racehorses. Contracts for stallions sold abroad began to include the right to buy a horse back home when he was no longer needed."
