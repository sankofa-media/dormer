  - id: old-friends
    name:
      ru: Сын
      en: The son
    blocks:
      - type: text
        text:
          ru: В 2003 году Майкл Блоуэн, бывший кинокритик газеты The Boston Globe, основал в Кентукки, под Джорджтауном, ферму Old Friends, где старые скакуны доживают свой век. Идея появилась у него раньше, но после истории с Фердинандом люди начали помогать всерьёз.
          en:
            text: In 2003, Michael Blowen, a former film critic for The Boston Globe, founded Old Friends near Georgetown, Kentucky, a farm where retired racehorses spend the rest of their lives. He had thought of it earlier, but after Ferdinand’s story people began to help in earnest.
            draft: true
        sources:
          - title: Old Friends — Who We Are
            url: https://oldfriendsequine.org/who-we-are/
          - title: Bruce Schreiner / AP — For ex-Derby winner Silver Charm, it's a life of leisure and Old Friends at Kentucky retirement farm
            url: https://apnews.com/article/55262eab5519c853be20b8c55a8a487c
          - title: Michael Blowen — Introduction to The Ride of Their Lives
            url: https://therideoftheirlives.com/introduction
      - type: text
        text:
          ru: В 2006 году туда привезли Bull Inthe Heather. На ферме его звали Булли. Он любил угощения, любил, когда ему чешут спину, и устраивал скачки с соседями через изгородь паддока.
          en:
            text: Bull Inthe Heather arrived in 2006. On the farm he was called Bully. He liked treats and having his back scratched, and raced his neighbours across the paddock fence.
            draft: true
        sources:
          - title: Old Friends — BULL INTHE HEATHER (1990–2014)
