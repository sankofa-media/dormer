  - id: covers
    name:
      ru: Кто её перепевал
      en: "Who Covered It"
    blocks:
      - type: text
        text:
          ru: |
            У Bull in the Heather нет громкой кавер-версии, которую знали бы все, как знают каверы на песни Боба Дилана. Зато её перепевали удивительно разные люди, и каждый раз по-своему.

            Первыми были, судя по всему, Madder Rose — нью-йоркская группа, которая, если верить базе концертных программ setlist.fm, сыграла песню в лондонской «Астории» уже 9 апреля 1994 года, когда сингл ещё не дошёл до радио. Записи этого концерта не нашлось.

            Самый трогательный кавер вышел в 1995 году. Жозефина Уиггс из The Breeders и Кейт Шелленбах из Luscious Jackson — когда-то она была барабанщицей самых первых Beastie Boys — назвали себя Ladies Who Lunch, «дамы, которые обедают», и выпустили на лейбле Grand Royal семидюймовую пластинку «Kims We Love» — «Ким, которых мы любим». На одной стороне — Bull in the Heather Ким Гордон, на другой — Gigantic группы Pixies, которую пела Ким Дил. Обе песни они переиграли на электронный, механический лад, и журнал CMJ назвал результат «окрафтверченной версией».
          en: |
            Bull in the Heather has no famous cover that everyone knows, the way everyone knows covers of Bob Dylan songs. But a remarkably varied assortment of people have covered it, each in their own way.

            The first, it seems, were Madder Rose—a New York band who, according to the concert database setlist.fm, played the song at London’s Astoria as early as April 9, 1994, before the single had even reached radio. No recording of that show could be found.

            The most touching cover came out in 1995. Josephine Wiggs of the Breeders and Kate Schellenbach of Luscious Jackson—once the drummer in the earliest incarnation of the Beastie Boys—called themselves Ladies Who Lunch and released a seven-inch on Grand Royal titled Kims We Love. On one side was Kim Gordon’s Bull in the Heather; on the other, the Pixies’ Gigantic, sung by Kim Deal. They recast both songs in an electronic, mechanical idiom, and CMJ called the result a “Kraftwerkified version.”
        sources:
          - title: setlist.fm — Madder Rose song statistics
            url: https://www.setlist.fm/stats/songs/madder-rose-1bd7e17c.html?songid=5bd68b14
          - title: CMJ New Music Monthly, March 1996
            url: https://www.worldradiohistory.com/Archive-All-Music/CMJ/New-Music/CMJ-New-Music-1996-03.pdf
          - title: JOY, Triple X playlist — Kims We Love
            url: https://joy.org.au/triplex/2016/02/31-january-2016/
      - type: art
        src: covers.webp
        alt:
          ru: Молодая группа весело играет; впереди девушка с микрофоном, сзади две ударные установки
          en: "A young band plays exuberantly; a girl with a microphone out front, two drum kits behind her"
        size: wide
      - type: text
        text:
          ru: |
            Самую известную версию записали в 2007 году британцы The Go! Team — шумная, радостная группа Иэна Партона, где девушка по прозвищу Ниндзя читает рэп, а за спиной у неё стучат две ударные установки. Bull in the Heather у них звучит как песня со школьного двора, игривая и бодрая, но узнаваемая с первых тактов. Кавер вышел на виниловом сингле Grip Like a Vice и среди бонусов к альбому Proof of Youth. Почему они выбрали именно эту песню, музыканты, кажется, нигде не рассказывали.

            Дальше — по нарастающей странности. В 2008 году американская группа Cavedoll положила песню на альбом Robot Love. Японская группа ORIGAMI сделала версию, о которой рецензент написал, что с оригиналом её роднит разве что выкрикнутое в конце название. В январе 2018 года на трибьюте Sonic Youth, собранном в Bandcamp, вышли сразу две версии: La Fea склеила свою из обрывков Klaxons, битлов, Уильяма Шетнера и диджея Grandmixer D.ST, а The Bionick Mann соединил Bull in the Heather с Winner's Blues, песней, которой открывается альбом, — в одну шестиминутную сюиту. В 2020 году коннектикутская группа Doom Beach записала её для благотворительного сборника. А в 2024 году группа Sponge, ветераны тех же девяностых, выпустила к тридцатилетию своего первого альбома пластинку «1994» из песен того года, и Bull in the Heather у них, по словам рецензента Goldmine, стала «психоделической и закрученной».

            Pearl Jam целиком её никогда не играли. Но в 1996 и 2000 годах Эдди Веддер на концертах по крайней мере шесть раз вплетал её строчки в конец своей песни Daughter — в Корке, на «Уэмбли», в Стамбуле, Барселоне, Питтсбурге и Сиэтле.
          en: |
            The best-known version was recorded in 2007 by Britain’s The Go! Team—Ian Parton’s noisy, joyful band, in which a woman called Ninja raps while two drum kits clatter behind her. Their Bull in the Heather sounds like a playground song, playful and buoyant but recognizable from its first bars. The cover appeared on the vinyl single Grip Like a Vice and among the bonus tracks for Proof of Youth. The musicians seem never to have explained why they chose this particular song.

            After that, things grow steadily stranger. In 2008, the American band Cavedoll put the song on their album Robot Love. The Japanese band ORIGAMI made a version that, one reviewer wrote, had little in common with the original beyond the title shouted near the end. In January 2018, a Sonic Youth tribute assembled on Bandcamp yielded two versions at once: La Fea pieced theirs together from fragments of Klaxons, the Beatles, William Shatner, and the DJ Grandmixer D.ST, while The Bionick Mann joined Bull in the Heather to Winner's Blues, the album’s opening song, in a single six-minute suite. In 2020, the Connecticut band Doom Beach recorded it for a charity compilation. And in 2024, Sponge, fellow veterans of the nineties, marked the thirtieth anniversary of their debut with 1994, an album of songs from that year; their Bull in the Heather became, in the words of a Goldmine reviewer, “swirly psychedelic.”

            Pearl Jam have never played it in full. But in 1996 and 2000, Eddie Vedder wove lines from it into the end of Daughter at least six times in concert—in Cork, at Wembley, in Istanbul, Barcelona, Pittsburgh, and Seattle.
        sources:
          - title: KEXP — Sub Pop catalogue SP0756
            url: https://www.kexp.org/subpop/sp701-sp800/
          - title: The Go! Team — Bull in the Heather, Bandcamp
            url: https://thegoteam.bandcamp.com/track/bull-in-the-heather
          - title: No Pics Reviews — The Go! Team
            url: https://nopicsreviews.blogspot.com/search/label/The%20Go%20Team
          - title: "Cavedoll — Robot Love: Scene 1"
            url: https://cavedoll.bandcamp.com/album/robot-love-scene-1
          - title: Make Believe Melodies — ORIGAMI cover
            url: https://makebelievemelodies.com/controlled-karoke-origami-cover-sonic-youths-bull-in-the-heather/
          - title: "PRF Monthly Tribute Series — December 2017: Sonic Youth"
            url: https://prfmonthlytributeseries.bandcamp.com/album/december-2017-sonic-youth
          - title: ctverses benefit compilation vol. 1
            url: https://ctverses.bandcamp.com/album/ctverses-benefit-compilation-vol-1
          - title: Goldmine — Sponge ‘1994’ is a time warp of a record
            url: https://www.goldminemag.com/reviews/album-reviews/sponge-1994-is-a-time-warp-of-a-record
          - title: Livefootsteps — Pearl Jam, Daughter song history
            url: https://livefootsteps.org/song/?song_id=68
      - type: video
        id: xwccuQSe98w
        title:
          ru: The Go! Team — Bull in the Heather, 2007
          en: "The Go! Team — Bull in the Heather, 2007"
        poster: covers.webp
        caption:
          ru: Официальная запись кавера The Go! Team.
          en: "The official recording of The Go! Team’s cover."
