            url: https://www.officialcharts.com/songs/sonic-youth-bull-in-the-heather/
          - title: Billboard — Modern Rock Tracks, week ending July 2 1994
            url: https://www.worldradiohistory.com/Archive-All-Music/Billboard/90s/1994/BB-1994-07-02.pdf
          - title: ChartVault — Bull In The Heather, Sonic Youth
