  - id: old-friends
    name:
      ru: Старые друзья
      en: "Old Friends"
    blocks:
      - type: text
        text:
          ru: |
            В 2003 году Майкл Блоуэн, бывший кинокритик газеты The Boston Globe, открыл в Кентукки, под Джорджтауном, ферму Old Friends — «Старые друзья», где отслужившие своё скакуны могут спокойно дожить до старости. Идея появилась у него раньше, но после истории с Фердинандом люди начали помогать всерьёз.

            В 2006 году туда привезли сына Фердинанда, Bull Inthe Heather. На ферме его звали просто Булли. Он любил угощения, любил, когда ему чешут спину, и затевал с соседями скачки вдоль изгороди паддока — уже не за деньги и не за славу.
          en: |
            In 2003, Michael Blowen, a former film critic for The Boston Globe, opened Old Friends, a farm near Georgetown, Kentucky, where retired racehorses could live out their days in peace. He had had the idea earlier, but after Ferdinand’s story, people began to offer serious help.

            In 2006, Ferdinand’s son, Bull Inthe Heather, arrived. At the farm they simply called him Bully. He loved treats, loved having his back scratched, and challenged his neighbors to races along the paddock fence—no longer for money or glory.
        sources:
          - title: Old Friends — Who We Are
            url: https://oldfriendsequine.org/who-we-are/
          - title: Michael Blowen — Introduction to The Ride of Their Lives
            url: https://therideoftheirlives.com/introduction
          - title: Old Friends — BULL INTHE HEATHER (1990–2014)
            url: https://oldfriendsequine.org/horse/bull-inthe-heather/
          - title: Bruce Schreiner / AP — Silver Charm and Old Friends
            url: https://apnews.com/article/55262eab5519c853be20b8c55a8a487c
      - type: art
        src: old-friends.webp
        alt:
          ru: Старый серый конь пасётся один в зелёном паддоке под большим деревом
          en: "An old gray horse grazes alone in a green paddock beneath a large tree"
        size: bleed

  - id: april
    name:
      ru: Апрель
      en: "April"
    blocks:
      - type: text
        text:
          ru: |
            В апреле 2014 года Булли было двадцать четыре года. Его мучили болезни старости, и его усыпили — тихо, на ферме Old Friends, которая появилась из-за гибели его отца.

            Почти ровно двадцать лет прошло с той весны, когда по MTV крутили клип с его именем и девушкой в кедах. Он, конечно, ничего об этом не знал.
          en: |
            In April 2014, Bully was twenty-four. He was suffering from the ailments of old age, and he was put to sleep—quietly, at Old Friends, the farm that had come into being because of his father’s death.

            Almost exactly twenty years had passed since the spring when MTV was showing a video with his name and a girl in sneakers. He knew nothing about it, of course.
        sources:
          - title: Joe Nevills — Bull Inthe Heather, Florida Derby winner, dies at Old Friends
            url: https://www.drf.com/news/bull-inthe-heather-florida-derby-winner-dies-old-friends
          - title: Equibase / BloodHorse — Bull Inthe Heather Euthanized at Old Friends
            url: https://cms.equibase.com/node/4118
