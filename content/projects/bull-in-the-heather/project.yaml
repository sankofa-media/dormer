  - id: pole-8
    name:
      ru: Что было с песней дальше
      en: The song’s later life
    blocks:
      - id: pole-8-0
        ru: Стивен Малкмус из Pavement говорил, что в своей песне Stereo пытался сделать что-то вроде Bull in the Heather, только поприлипчивее. Её перепели The Go! Team. Sonic Youth сыграли её на концертах больше трёхсот раз — например, 4 июля 2008 года в Баттери-парке в Нью-Йорке, — а журнал SPIN включил её в число тринадцати песен, лучше всего показывающих Ким Гордон.
        en:
          text: Stephen Malkmus of Pavement said that with his song Stereo he was trying to do something like Bull in the Heather, only catchier. The Go! Team covered it. Sonic Youth played it live more than three hundred times, including on July 4, 2008, in Battery Park, New York, and SPIN included it among thirteen songs that best represent Kim Gordon.
          draft: true
        sources:
