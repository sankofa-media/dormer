        text:
          ru: |
            Он приходит первым, на два корпуса впереди. Время — минута пятьдесят одна и одна пятая секунды. Тот, кто поставил на него два доллара, получает шестьдесят долларов восемьдесят центов.
          en: |
            He finishes first, two lengths clear. The time is one minute fifty-one and one-fifth seconds. Anyone who put two dollars on him collects sixty dollars and eighty cents.
