  ru: Bull in the Heather
  en: Bull in the Heather
dek:
  ru: Песня Sonic Youth, скаковой конь, в честь которого она названа, и его отец
  en: The Sonic Youth song, the racehorse it was named after, and his father
date: 2026-11-20
