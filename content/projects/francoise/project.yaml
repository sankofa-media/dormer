  - id: grown-up
    kicker:
      ru: Глава десятая
      en: "Chapter Ten"
    name:
      ru: Как сказать «прощай»
      en: "How to Say Goodbye"
    blocks:
      - type: text
        text:
          ru: |
            К 1967 году йе-йе кончалось. Подростки Насьона выросли, а через год вышли на баррикады. Арди тоже повзрослела — и песни её стали взрослее. В 1967-м вышел её альбом, названный по песне «Моя юность уходит». В 1968 году она перестала выступать с концертами: страх сцены оказался сильнее. Это был не уход из музыки — только со сцены. Петь она продолжала в студии и на телевидении.

            В том же 1967 году она сошлась с Жаком Дютроном — тем самым, что когда-то написал музыку к Le Temps de l'amour. Сына Тома они родили в 1973-м, поженились в 1981-м.
          en: |
            By 1967, yé-yé was coming to an end. The teenagers of the Place de la Nation had grown up; a year later, they would take to the barricades. Hardy had grown up, too, and so had her songs. In 1967, she released an album named after the song Ma jeunesse fout le camp—“My youth is slipping away”. In 1968, she stopped giving concerts: stage fright had won. She was leaving the stage, not music. She continued to sing in the studio and on television.

            In that same year, 1967, she began a relationship with Jacques Dutronc—the very man who had once written the music for Le Temps de l’amour. Their son Thomas was born in 1973; they married in 1981.
        sources:
          - title: Le Figaro — « J’ai arrêté en 1968 », 27.11.2006
            url: https://www.lefigaro.fr/2006/11/27/03004-20061127ARTFIG90021-francoise_hardy_et_ses_douze_partages.php
          - title: Le Monde (EN) — Pop culture icon Françoise Hardy has died, 12.06.2024
            url: https://www.lemonde.fr/en/obituaries/article/2024/06/12/pop-culture-icon-francoise-hardy-has-died_6674549_15.html
      - type: song
        title: "Ma jeunesse fout le camp…"
        year: "1967"
        credits: {ru: "Слова и музыка — Ги Бонтемпелли", en: "Words and music by Guy Bontempelli"}
        text:
          ru: В двадцать три года — песня о том, что молодость уходит. Подростковая тоска превращается в тему времени. С этой песни начинается взрослая Арди.
          en: "At twenty-three, a song about youth slipping away. Teenage melancholy becomes a meditation on time. The grown-up Hardy begins here."
        sources:
          - title: Ultratop — Ma jeunesse fout l’camp
            url: https://www.ultratop.be/fr/song/604b5/Francoise-Hardy-Ma-jeunesse-fout-l%27camp
      - type: song
        title: "La Maison où j'ai grandi"
        year: "1966"
        credits: {ru: "Французский текст — Эдди Марне, музыка — Адриано Челентано", en: "French lyrics by Eddy Marnay; music by Adriano Celentano"}
        text:
          ru: Французская версия Il ragazzo della via Gluck Челентано — о доме детства, который снесли, и о городе, который съел луг. Ностальгия по миру, которого больше нет. Это не про её собственный дом, но поёт она так, будто про свой.
          en: "The French version of Celentano’s Il ragazzo della via Gluck, about a childhood home demolished and a city that swallowed a meadow. Nostalgia for a world that no longer exists. It is not about her own home, but she sings as though it were."
        sources:
          - title: Musée Sacem — Françoise Hardy
            url: https://musee.sacem.fr/index.php/ExhibitionCMS/ExhibitionCMS/SimpleExhibitions?id=4821
      - type: song
        title: "Des ronds dans l'eau"
        year: "1967"
        credits: {ru: "Слова — Пьер Бару, музыка — Раймон Ле Сенешаль", en: "Lyrics by Pierre Barouh; music by Raymond Le Sénéchal"}
        text:
          ru: Круги на воде — то, что остаётся от брошенного камня, и от детства, и от любви. Песня из мира Клода Лелуша и его фильма «Жить, чтобы жить». По-английски — Now You Want to Be Loved.
          en: "Ripples on water: what remains of a thrown stone, of childhood, of love. A song from the world of Claude Lelouch and his film Vivre pour vivre. In English, Now You Want to Be Loved."
        sources:
          - title: BnF — Des ronds dans l’eau
            url: https://catalogue.bnf.fr/ark%3A/12148/cb39650648b
      - type: song
        title: "Comment te dire adieu"
        year: "1968"
        credits: {ru: "Французский текст — Серж Генсбур; оригинал It Hurts to Say Goodbye — Арнольд Голанд и Джек Голд", en: "French lyrics by Serge Gainsbourg; original song, It Hurts to Say Goodbye, by Arnold Goland and Jack Gold"}
        text:
          ru: Американскую песню Генсбур переписал по-французски так, что в каждой строке звенит одна и та же сухая рифма на «экс» — будто слова сами спотыкаются, не решаясь сказать «прощай». Лёгкий быстрый поп, под который удобно расставаться. Одна из главных её песен; на видео — телевизионное исполнение 28 февраля 1969 года.
          en: "Gainsbourg rewrote the American song in French so that the same dry “ex” rhyme rings through every line, as though the words themselves were stumbling, unable to bring themselves to say goodbye. Light, brisk pop to break up to. One of her defining songs; the video shows a television performance from 28 February 1969."
        video_id: dqZDRWdZRd4
        video_note: {ru: "Архив INA, 28.02.1969", en: "INA archive, 28.02.1969"}
        sources:
          - title: Académie de la Chanson — Comment te dire adieu
            url: https://academiedelachanson.fr/francoise-hardy-comment-te-dire-adieu/
          - title: Comment te dire adieu (chanson)
            url: https://fr.wikipedia.org/wiki/Comment_te_dire_adieu_%28chanson%29
      - type: song
        title: "Il n'y a pas d'amour heureux"
        year: "1968"
        credits: {ru: "Стихи — Луи Арагон, музыка — Жорж Брассенс", en: "Poem by Louis Aragon; music by Georges Brassens"}
        text:
          ru: «Нет счастливой любви» — стихи Арагона, написанные во время войны, в песне Брассенса. Поп-певица выходит к большой французской поэзии и поёт её без пафоса, тем же ровным голосом, что и про мальчиков и девочек.
          en: "Il n’y a pas d’amour heureux—“There is no happy love”: Aragon’s wartime poem, set to music by Brassens. A pop singer steps into the world of great French poetry and sings it without grand gestures, in the same even voice she used for the boys and girls."
        video_id: cKVka46k_sY
        video_note: {ru: "Архив INA, 24.09.1968", en: "INA archive, 24.09.1968"}
        sources:
          - title: MusicBrainz — recording credits
            url: https://musicbrainz.org/release/cb9f9cb6-900c-4b93-b682-641c1b9b16c4
      - type: song
        title: "Suzanne"
        year: "1968"
        credits: {ru: "Леонард Коэн, французский текст — Грэм Олрайт", en: "Leonard Cohen; French lyrics by Graeme Allwright"}
        text:
          ru: Вот кого из североамериканских бардов она пела, — не Дилана, а Коэна. Сюзанна, чай с апельсинами, река.
          en: "Here was the North American bard she sang: Cohen, rather than Dylan. Suzanne, tea with oranges, the river."
        video_id: c7zhA2O7GRk
        video_note: {ru: "Архив INA, 31.12.1968", en: "INA archive, 31.12.1968"}
        sources:
          - title: Parlophone — One-Nine-Seven-Zero, Suzanne credits
            url: https://www.youtube.com/watch?v=ewrWAZpbtpE

  - id: after
    kicker:
      ru: Глава одиннадцатая
      en: "Chapter Eleven"
    name:
      ru: После йе-йе
      en: "After Yé-Yé"
    blocks:
      - type: text
        text:
          ru: |
            Семидесятые Арди начала с пластинки, которую многие считают её лучшей. Альбом La Question 1971 года она записала с бразильской певицей и гитаристкой Тукой, которая написала почти всю музыку. Голос, акустическая гитара, контрабас Ги Педерсена и струнные — больше ничего. Тихий, чувственный, тревожный альбом, на тридцать лет опередивший моду на такую музыку. Певица Стереолаба Летиция Садье говорила, что именно La Question значил для неё очень много.

            Потом пришёл Мишель Бергер, и в 1973 году — Message personnel: песня, которая начинается с того, что Арди не поёт, а говорит, как будто записывает сообщение на автоответчик человеку, которому не решается признаться. В конце семидесятых — неожиданный диско-фанк J'écoute de la musique saoule с композитором Габриэлем Яредом. Параллельно она стала всерьёз заниматься астрологией и написала о ней несколько книг.
          en: |
            Hardy began the seventies with the record many consider her finest. She made La Question in 1971 with the Brazilian singer and guitarist Tuca, who wrote almost all the music. A voice, an acoustic guitar, Guy Pedersen’s double bass and strings—nothing more. Quiet, sensual and uneasy, the album anticipated the vogue for such music by thirty years. Stereolab’s singer Lætitia Sadier said that La Question, in particular, had meant a great deal to her.

            Then came Michel Berger, and in 1973, Message personnel: a song that begins with Hardy speaking rather than singing, as though leaving an answering-machine message for someone she cannot bring herself to tell how she feels. In the late seventies came the unexpected disco-funk of J’écoute de la musique saoule, with the composer Gabriel Yared. Alongside her music, she began to study astrology seriously and wrote several books about it.
        sources:
          - title: Magic RPM — entrevue Françoise Hardy, 08.04.2010
            url: https://www.magicrpm.com/entrevue-08-04-10/
          - title: OndaRock — Laetitia Sadier interview, 2024
            url: https://ondarock.com/interviews/laetitiasadier/
          - title: Message personnel (chanson)
            url: https://fr.wikipedia.org/wiki/Message_personnel_%28chanson%29
          - title: Mollat — Les Rythmes du zodiaque, 2003
            url: https://www.mollat.com/livres/729565/francoise-hardy-les-rythmes-du-zodiaque
      - type: song
        title: "La Question"
        year: "1971"
        credits: {ru: "Слова — Арди, музыка — Тука", en: "Lyrics by Hardy; music by Tuca"}
        text:
          ru: Вопрос, на который любимый так и не отвечает. Голос почти шёпотом, гитара Туки, ощущение очень близкого разговора в полутёмной комнате.
          en: "A question the beloved never answers. A voice almost whispering, Tuca’s guitar, the feeling of an intimate conversation in a dimly lit room."
        sources:
          - title: MusicBrainz — La Question
            url: https://musicbrainz.org/release/bc80c6e0-f1be-3948-9a1a-55604f98c13a
      - type: song
        title: "Message personnel"
        year: "1973"
        credits: {ru: "Слова — Мишель Бергер и Франсуаза Арди, музыка — Бергер", en: "Lyrics by Michel Berger and Françoise Hardy; music by Berger"}
        text:
          ru: Сначала она говорит, потом начинает петь — и расстояние между двумя людьми становится почти физическим. Знаменитое разговорное вступление написала она сама. Одна из самых любимых французских песен семидесятых.
          en: "First she speaks, then she begins to sing, and the distance between two people becomes almost physical. She wrote the famous spoken introduction herself. One of the best-loved French songs of the seventies."
        video_id: ANchsQz11po
        video_note: {ru: "Архив INA, 11.11.1973", en: "INA archive, 11.11.1973"}
        sources:
          - title: Message personnel (chanson)
            url: https://fr.wikipedia.org/wiki/Message_personnel_%28chanson%29
      - type: song
        title: "J'écoute de la musique saoule"
        year: "1978"
        credits: {ru: "Слова — Мишель Жонас, музыка — Габриэль Яред", en: "Lyrics by Michel Jonasz; music by Gabriel Yared"}
        text:
          ru: «Пьяная музыка» — и игра слов saoule и soul. Арди танцует. Неожиданная, весёлая, с отдельным диско-миксом.
          en: "“Drunken music”—and a play on saoule and soul. Hardy dances. Unexpected, cheerful, and with a separate disco mix."
        video_id: 9U13DDZTxDg
        video_note: {ru: "Архив INA, 03.01.1979", en: "INA archive, 03.01.1979"}
        sources:
          - title: Discographie de Françoise Hardy
            url: https://fr.wikipedia.org/wiki/Discographie_de_Fran%C3%A7oise_Hardy
      - type: song
        title: "Partir quand même"
        year: "1988"
        credits: {ru: "Слова — Арди, музыка — Жак Дютрон", en: "Lyrics by Hardy; music by Jacques Dutronc"}
        text:
          ru: Уйти, всё равно уйти — хотя любишь. Взрослая баллада, тридцать третье место во французском чарте. Вскоре она объявит, что заканчивает карьеру. И не закончит.
          en: "To leave, to leave anyway, even though you love. A grown-up ballad that reached number thirty-three in the French chart. Soon she would announce that her career was over. It was not."
        video_id: NiEx6yPjoww
        video_note: {ru: "Архив INA, 13.05.1988", en: "INA archive, 13.05.1988"}
        sources:
          - title: Lescharts — Partir quand même
            url: https://lescharts.com/showitem.asp?cat=s&interpret=Fran%EF%BF%BDoise+Hardy&titel=Enregistrement
      - type: text
        text:
          ru: |
            В девяностые она вернулась — и оказалось, что её ждали люди, которые родились, когда йе-йе уже кончилось. В марте 1995 года Blur записали с ней на Abbey Road французскую версию своей песни To the End. В 1996 году она выпустила жёсткий, электрический альбом Le Danger. В 1997-м спела с Игги Попом старый стандарт I'll Be Seeing You. Для группы Air написала слова песни Jeanne. В 2000 году вместе с Дютроном спела Puisque vous partez en voyage — песню своей учительницы Мирей.
          en: |
            She returned in the nineties and found that people born after yé-yé had ended were waiting for her. In March 1995, Blur recorded a French version of their song To the End with her at Abbey Road. In 1996, she released the hard-edged, electric album Le Danger. In 1997, she sang the old standard I’ll Be Seeing You with Iggy Pop. She wrote the lyrics to Jeanne for Air. In 2000, she and Dutronc sang Puisque vous partez en voyage, a song by her teacher Mireille.
        sources:
          - title: To the End (Blur song)
            url: https://en.wikipedia.org/wiki/To_the_End_%28Blur_song%29
          - title: Le Monde — Françoise Hardy chante le pessimisme du temps sur un rythme rock, 16.04.1996
            url: https://www.lemonde.fr/archives/article/1996/04/16/francoise-hardy-chante-le-pessimisme-du-temps-rythme-rock_3730673_1819218.html
          - title: EL PAÍS — Françoise Hardy con Iggy Pop, 20.11.1997
            url: https://elpais.com/diario/1997/11/20/cultura/879980410_850215.html
          - title: Apple Music — Air & Françoise Hardy, Jeanne
            url: https://music.apple.com/us/song/699604882
          - title: Ultratop — Puisque vous partez en voyage
            url: https://www.ultratop.be/fr/song/356f1/Francoise-Hardy-%26-Jacques-Dutronc-Puisque-vous-partez-en-voyage
      - type: song
        title: "To the End (La Comédie)"
        year: "1995"
        credits: {ru: "Blur и Франсуаза Арди. Слова — Деймон Албарн, музыка — Blur", en: "Blur and Françoise Hardy. Lyrics by Damon Albarn; music by Blur"}
        text:
          ru: Брит-поп встречает шансон. Деймон Албарн поёт по-английски, она отвечает по-французски — почти тот же разговор на двух языках, что и в ту ночь в «Георге V», только на этот раз все всё понимают.
          en: "Britpop meets chanson. Damon Albarn sings in English, she answers in French—almost the same conversation in two languages as on that night at the George V, except that this time everyone understands."
        video_id: WtpvikPvewk
        video_note: {ru: "Видео дуэта, 1995", en: "Duet video, 1995"}
        sources:
          - title: To the End (Blur song)
            url: https://en.wikipedia.org/wiki/To_the_End_%28Blur_song%29
      - type: song
        title: "Tant de belles choses"
        year: "2004"
        credits: {ru: "Слова — Арди, музыка — Паскаль Даниэль и Ален Любрано", en: "Lyrics by Hardy; music by Pascale Daniel and Alain Lubrano"}
        text:
          ru: "Она писала её, думая о сыне Тома, когда уже была больна. Мать утешает сына: если меня не станет, любовь останется, и вокруг будет столько прекрасного. Голос сдержанный, без единой слезы, — поэтому плачет слушатель."
          en: "She wrote it thinking of her son Thomas, when she was already ill. A mother comforts her son: if I am gone, love will remain, and there will still be so much beauty around you. Her voice is restrained, without a single tear—which is why the listener cries."
        sources:
          - title: Version Femina — Tant de belles choses, écrite pour son fils Thomas Dutronc
            url: https://prod.femina.lejdd.fr/article/mort-de-francoise-hardy-la-touchante-histoire-derriere-sa-chanson-tant-de-belles-choses-ecrite-pour-son-fils-thomas-dutronc
      - type: song
        title: "Le Large"
        year: "2018"
        credits: {ru: "Слова и музыка — Ла Гранд Софи; клип — Франсуа Озон", en: "Words and music by La Grande Sophie; video directed by François Ozon"}
        text:
          ru: Последняя её большая песня. Уйти в открытое море — спокойно, без жалоб. Клип снял Франсуа Озон. Альбом Personne d'autre вышел 6 апреля 2018 года и стал последним.
          en: "Her last great song. To set out for the open sea, calmly, without complaint. François Ozon directed the video. Personne d’autre was released on 6 April 2018 and would be her final album."
        video_id: opJZildiOlo
        video_note: {ru: "Официальный клип, реж. Франсуа Озон", en: "Official video, directed by François Ozon"}
        sources:
          - title: Françoise Hardy — Le Large (official video)
            url: https://www.youtube.com/watch?v=opJZildiOlo
      - type: text
        text:
          ru: |
            Последние двадцать лет она тяжело болела: лимфома, потом рак гортани. Лечение отнимало голос. Франсуаза Арди умерла 11 июня 2024 года, ей было восемьдесят лет. Об этом сообщил её сын Тома.
          en: |
            For her last twenty years, she was seriously ill: lymphoma, then cancer of the larynx. Treatment took away her voice. Françoise Hardy died on 11 June 2024, aged eighty. Her son Thomas announced her death.
        sources:
          - title: Le Monde — Françoise Hardy, icône de la culture pop, est morte, 11.06.2024
            url: https://www.lemonde.fr/disparitions/article/2024/06/11/francoise-hardy-icone-de-la-culture-pop-est-morte_6238944_3382.html
          - title: Ministère de la Culture — Hommage à Françoise Hardy, 12.06.2024
            url: https://www.culture.gouv.fr/presse/communiques-de-presse/hommage-de-mme-rachida-dati-ministre-de-la-culture-a-mme-francoise-hardy

  - id: echo
    kicker:
      ru: Глава двенадцатая
      en: "Chapter Twelve"
    name:
      ru: Эхо
      en: "Echoes"
    blocks:
      - type: text
        text:
          ru: |
            Что она изменила в музыке? Она доказала, что девушка внутри большой поп-индустрии может петь собственные песни — о своей застенчивости, неуверенности, одиночестве, — и что миллионам это нужно. Первой женщиной во Франции, писавшей песни, она не была. Но она была первой звездой йе-йе, которая пела не чужое, а своё, и пела тихо, когда все кричали.

            Её эхо слышно у тех, кто прямо её признавал: у Летиции Садье и Stereolab, у Air, с которыми она работала, у Боба Стэнли из Saint Etienne, у Этьена Даона, для которого она была, по словам министерства культуры Франции, «образцом и кумиром». В день её смерти Belle and Sebastian играли в Ниме и спели в её память Comment te dire adieu.

            Когда её спрашивали о грусти, о которой она пела всю жизнь, она отвечала двумя словами: «C'est la beauté». Это красота.
          en: |
            What did she change in music? She proved that a young woman inside the vast pop industry could sing her own songs—about her shyness, her uncertainty, her loneliness—and that millions of people needed to hear them. She was not the first woman in France to write songs. But she was the first yé-yé star to sing her own material rather than someone else’s, and to sing quietly when everyone was shouting.

            Her echo can be heard in those who openly acknowledged her: Lætitia Sadier and Stereolab; Air, with whom she worked; Bob Stanley of Saint Etienne; Étienne Daho, for whom, in the words of the French Ministry of Culture, she was “un modèle et une idole”—a role model and an idol. On the day she died, Belle and Sebastian were playing in Nîmes, and sang Comment te dire adieu in her memory.

            When asked about the sadness she had sung of all her life, she answered with two words: “C’est la beauté”. It is beauty.
        sources:
          - title: OndaRock — Laetitia Sadier interview
            url: https://ondarock.com/interviews/laetitiasadier/
          - title: Le Progrès — Saint Etienne, 21.10.2025
            url: https://www.leprogres.fr/culture-loisirs/2025/10/21/saint-etienne-ce-groupe-britannique-qui-a-choisi-son-nom-en-hommage-a-l-asse
