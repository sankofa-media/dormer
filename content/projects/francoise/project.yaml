  - id: yeye
    kicker:
      ru: Глава четвёртая
      en: "Chapter Four"
    name:
      ru: «Салют, приятели!»
      en: "“Salut les copains!”"
    blocks:
      - type: text
        text:
          ru: |
            Почему двадцатидвухлетнюю девушку в 1966 году знал каждый француз? Чтобы ответить, нужно рассказать про йе-йе.

            Девятнадцатого октября 1959 года радиостанция Europe 1 запустила передачу Salut les copains — «Салют, приятели». Придумали её двое любителей джаза, Даниэль Филипаки и Франк Тено. Каждый день после школы французские подростки бросали портфели, включали транзисторы и слушали рок-н-ролл, твист и новые песни своих ровесников. Летом 1962 года у передачи появился одноимённый ежемесячный журнал — на обложке первого номера был Джонни Холлидей, — и журнал стал расходиться так, как не расходилось ни одно издание для молодёжи. Ещё раньше, в 1961-м, вышел первый номер журнала Disco Revue, а по телевизору шла программа Альбера Рэснера «Нежный возраст и деревянная голова» — с музыкальным автоматом и флиппером прямо в студии.
          en: |
            Why did everyone in France know a twenty-two-year-old woman in 1966? To answer that, we need to talk about yé-yé.

            On 19 October 1959, the radio station Europe 1 launched Salut les copains—“Hello, friends”. It was devised by two jazz enthusiasts, Daniel Filipacchi and Frank Ténot. Every day after school, French teenagers dropped their satchels, switched on their transistor radios and listened to rock ’n’ roll, the twist and new songs by people their own age. In the summer of 1962, the programme acquired a monthly magazine of the same name, with Johnny Hallyday on the first cover. It sold as no youth magazine had sold before. Disco Revue had appeared earlier, in 1961, while television had Albert Raisner’s Âge tendre et tête de bois, with a jukebox and a pinball machine right there in the studio.
        sources:
          - title: Europe 1 — 19 octobre 1959, Europe 1 lance Salut les copains
            url: https://www.europe1.fr/emissions/Zoom-arriere/19-octobre-1959-Europe-1-lance-Salut-les-copains-930438
          - title: BnF — Salut les copains (périodique), 1962–1976
            url: https://catalogue.bnf.fr/ark%3A/12148/cb343492469
          - title: Musée Sacem — La presse jeunesse yéyé
            url: https://musee.sacem.fr/index.php/ExhibitionCMS/ExhibitionCMS/View?id=3921
          - title: Disco Revue n°1, 28.09.1961 (catalogue)
            url: https://ctlgs.org/c/books/edition/385110/disco-revue-series-1-n-01/
          - title: INA — Âge tendre et tête de bois, 30 mai 1961
            url: https://catalogue.ina.fr/doc/TV-RADIO/DA_CPF86600631/age-tendre-et-tete-de-bois-emission-du-30-mai-1961
      - type: art
        src: salut-copains.webp
        alt:
          ru: Французские подростки в комнате 1962 года слушают транзистор и переносной проигрыватель
          en: "French teenagers in a room in 1962, listening to a transistor radio and a portable record player"
        size: bleed
      - type: photo
        src: salut-les-copains-01-1962.jpg
        alt:
          ru: Обложка первого номера журнала Salut les copains с Джонни Холлидеем
          en: "The cover of the first issue of Salut les copains, featuring Johnny Hallyday"
        caption:
          ru: Первый номер Salut les copains, июль–август 1962 года. На обложке — Джонни Холлидей.
          en: "The first issue of Salut les copains, July–August 1962. Johnny Hallyday on the cover."
        credit: "Salut les copains, 1962. Фотограф обложки не установлен. Скан: jhallyday.com"
        source_url: https://www.jhallyday.com/presse/slc/slc1-07-62.html
        size: right
        treatment: print
      - type: text
        text:
          ru: |
            Двадцать второго июня 1963 года журнал отмечал первый день рождения бесплатным концертом на площади Насьон в Париже. Ждали несколько тысяч человек. Пришло, по самым распространённым оценкам, около ста пятидесяти тысяч — подростки сидели на фонарях, на деревьях, на памятнике. Франция вдруг увидела своих детей разом, целым поколением, и испугалась.

            Через две недели социолог Эдгар Морен напечатал в Le Monde две статьи под названием Salut les copains. Первая называлась «Новый возрастной класс». Морен описывал этих подростков как отдельный народ со своей музыкой, своей одеждой, своими пластинками и транзисторами — и закрепил за ними имя «йе-йе». Слово это — просто французское эхо английского «yeah, yeah», которое без конца звучало в песнях.
          en: |
            On 22 June 1963, the magazine celebrated its first birthday with a free concert at the Place de la Nation in Paris. A few thousand people were expected. According to the most widely cited estimates, about a hundred and fifty thousand came. Teenagers perched on lampposts, in trees, on the monument. France suddenly saw its children all at once, an entire generation, and took fright.

            Two weeks later, the sociologist Edgar Morin published two articles in Le Monde under the heading Salut les copains. The first was called “Une nouvelle classe d’âge”—a new age group. Morin described these teenagers as a people apart, with their own music, clothes, records and transistor radios, and gave them a lasting name: yé-yé. The word was simply a French echo of the English “yeah, yeah” that rang endlessly through the songs.
        sources:
          - title: Cambridge — The Salut les copains generation, Popular Music, 2021
            url: https://www.cambridge.org/core/journals/popular-music/article/abs/salut-les-copains-generation/E210D4045FA1BB467BBEC6644FC85479
          - title: Le Monde — Edgar Morin, Salut les copains. I. Une nouvelle classe d’âge, 06.07.1963
            url: https://www.lemonde.fr/archives/article/1963/07/06/i-une-nouvelle-classe-d-age_2207794_1819218.html
          - title: Le Monde — Antoine crie « O yeah », 06.08.1998
            url: https://www.lemonde.fr/archives/article/1998/08/06/antoine-crie-o-yeah_3665651_1819218.html
          - title: Jean Segura — Nation 1963, documentary description
            url: https://www.youtube.com/watch?v=9X10z9nVTr8
      - type: art
        src: nation-1963.webp
        alt:
          ru: Огромная толпа подростков на площади, ребята сидят на фонарях и памятнике, далеко маленькая сцена
          en: "An enormous crowd of teenagers in a square, youngsters perched on lampposts and a monument, a small stage in the distance"
        size: bleed
      - type: clipping
        style: french-daily
        masthead: "Le Monde"
        date: "6 juillet 1963"
        headline: "Salut les copains"
        deck:
          ru: "I. Une nouvelle classe d'âge — Эдгар Морен"
          en: "I. Une nouvelle classe d'âge — Edgar Morin"
        body:
          ru: Первая из двух статей социолога о подростках, собравшихся на площади Насьон. Здесь поколению дано имя «йе-йе».
          en: "The first of the sociologist’s two articles about the teenagers gathered at the Place de la Nation. Here, the generation was given the name “yé-yé”."
        cite:
          publication: Le Monde
          date: "1963-07-06"
          page: "1"
          url: https://www.lemonde.fr/archives/article/1963/07/06/i-une-nouvelle-classe-d-age_2207794_1819218.html
        paper: paper-news.webp
      - type: text
        text:
          ru: |
            У йе-йе было своё созвездие: Сильви Вартан, Франс Галль, Шейла, Джонни Холлидей, Клод Франсуа, Шанталь Гойя, а с 1966 года — Жак Дютрон. И Франсуаза Арди. Двенадцатого апреля 1966 года фотограф Жан-Мари Перье собрал сорок шесть певцов и певиц на одну постановочную фотографию; в июне её напечатали плакатом к четырёхлетию журнала, и её до сих пор называют «фотографией века».

            У этого поколения были и свои вещи. Переносной проигрыватель Teppaz, похожий на чемоданчик, который можно унести на пляж или в гости. Маленькие пластинки — «сорокапятки», а во Франции чаще всего «супер-45»: четыре песни на одном диске в картонном конверте с фотографией. Транзисторный приёмник в кожаном чехле. Велосипед с моторчиком «Велосолекс». Всё это — йе-йе не меньше, чем песни.
          en: |
            Yé-yé had its own constellation of stars: Sylvie Vartan, France Gall, Sheila, Johnny Hallyday, Claude François, Chantal Goya and, from 1966, Jacques Dutronc. And Françoise Hardy. On 12 April 1966, the photographer Jean-Marie Périer assembled forty-six singers for a single staged photograph. Published in June as a poster to mark the magazine’s fourth anniversary, it is still known as the “photo of the century”.

            The generation had its objects, too. The portable Teppaz record player, like a little suitcase you could take to the beach or a friend’s house. Small records—45s, or, most often in France, “super 45s”: four songs on one disc in a cardboard picture sleeve. A transistor radio in a leather case. A VéloSolex motorised bicycle. All of it was as much yé-yé as the songs.
        sources:
          - title: Polka — Jean-Marie Périer, « photo du siècle », 12 avril 1966
            url: https://www.polkagalerie.com/docs/artistes/Jean-Marie-Perier/Presse/Polka1Perier.pdf
          - title: Photo du siècle (participants, SLC n°47)
            url: https://fr.wikipedia.org/wiki/Photo_du_si%C3%A8cle
          - title: MuPop — Teppaz Oscar, vers 1960
            url: https://www.mupop.fr/wp-content/uploads/2022/07/LivretEnseignant-Oralite-ok.pdf
      - type: gallery
        layout: scatter
        items:
