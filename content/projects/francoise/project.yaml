  - id: debut
    kicker:
      ru: Глава пятая
      en: "Chapter Five"
    name:
      ru: Гитара за аттестат
      en: "A Guitar for Passing Her Exams"
    blocks:
      - type: text
        text:
          ru: |
            Франсуаза Арди родилась 17 января 1944 года в Париже, в девятом округе, ещё при немецкой оккупации. Её растила мать, Мадлен, помощница бухгалтера; отец жил с другой семьёй и появлялся редко. Франсуаза и младшая сестра учились в католической школе у монахинь на улице Лабрюйер. Девочка была замкнутой, неуверенной в себе, много читала и слушала по радио английскую и американскую поп-музыку, которую любила всю жизнь.

            Когда она сдала экзамены на аттестат зрелости, ей подарили гитару. В каком году — то ли в 1960-м, то ли в 1961-м, — источники спорят. Аккордов она знала несколько, но этого хватило: она начала сочинять. Мелодия и слова приходили одновременно, прямо под пальцами. Позже она привыкнет к другому способу — сначала музыка, потом слова, «я всегда кладу слова на музыку», — но первые песни родились именно так.

            Дальше были прослушивания. На Pathé-Marconi её не взяли. На Philips прослушивание стоило денег, а денег не было. Тогда она пошла в «Маленькую консерваторию песни» — школу певицы Мирей, которую показывали по телевизору. Шестого февраля 1962 года восемнадцатилетняя Франсуаза впервые появилась на экране: Мирей с ней разговаривает, а потом она поёт.
          en: |
            Françoise Hardy was born on 17 January 1944 in the ninth arrondissement of Paris, still under German occupation. She was brought up by her mother, Madeleine, an accounts assistant; her father lived with another family and rarely appeared. Françoise and her younger sister attended a Catholic school run by nuns on the Rue La Bruyère. She was a withdrawn, insecure child who read a great deal and listened on the radio to the British and American pop music she would love all her life.

            When she passed her baccalauréat, she was given a guitar. Sources disagree about the year: it may have been 1960 or 1961. She knew only a few chords, but they were enough. She began to write. The tune and the words came together, straight from her fingers. Later, she would adopt a different method—music first, words afterwards: “I always put the words on the music.” But this was how the first songs were born.

            Then came the auditions. Pathé-Marconi turned her down. An audition at Philips cost money, and she had none. So she went to Le Petit Conservatoire de la chanson, the singer Mireille’s school, which featured on television. On 6 February 1962, eighteen-year-old Françoise made her first appearance on screen: Mireille talks to her, and then she sings.
        sources:
          - title: Musée Sacem — Françoise Hardy, 11.06.2024
            url: https://musee.sacem.fr/index.php/ExhibitionCMS/ExhibitionCMS/SimpleExhibitions?id=4821
          - title: Marie Claire — Françoise Hardy, biographie
            url: https://www.marieclaire.fr/francoise-hardy%2C1336089.asp
          - title: Le Temps — Françoise Hardy interview
            url: https://www.letemps.ch/culture/francoise-hardy-vis-virtuel-cest-reve
          - title: AP — Françoise Hardy obituary, 12.06.2024
            url: https://apnews.com/article/b097b2a2dcc26b4181f3487b8ab2f8e2
          - title: "Télérama — Françoise Hardy : Johnny avait une volonté insensée, 2017"
            url: https://www.telerama.fr/musique/francoise-hardy-johnny-avait-une-volonte-insensee%2Cn5391339.php
      - type: video
        id: SByMAUM1nd0
        title:
          ru: 1962. Первое появление Франсуазы Арди на телевидении
          en: "1962. Françoise Hardy’s First Television Appearance"
        poster: studio-vogue.webp
        caption:
          ru: RTF, 6 февраля 1962 года. «Маленькая консерватория» Мирей.
          en: "RTF, 6 February 1962. Mireille’s Le Petit Conservatoire de la chanson."
        credit: "Archive INA / INA Culte"
      - type: text
        text:
          ru: |
            Четырнадцатого ноября 1961 года она подписала контракт с фирмой Disques Vogue — звукозаписывающей, не путать с модным журналом. Её открыл художественный руководитель Жак Вольфсон. Двадцать пятого апреля 1962 года записали первую пластинку: четыре песни, «супер-45» Vogue EPL 7967. Три из четырёх она написала сама. Фирма поначалу сделала ставку на бодрую Oh oh chéri, и на конверте крупно стояло её название.

            Но всё решил не конверт, а политика. Двадцать восьмого октября 1962 года во Франции проходил референдум о том, чтобы президента выбирали всенародным голосованием. Вечером вся страна сидела у телевизоров и ждала результатов. Между выпусками с цифрами шли музыкальные паузы. В одной из них тихая девушка с гитарой спела Tous les garçons et les filles — «Все мальчики и девочки». Наутро её знала вся Франция. За тот год продали, по данным L'Express, пятьсот тысяч пластинок. Конверт пришлось переделать: теперь на нём крупно стояли Tous les garçons et les filles и J'suis d'accord.
          en: |
            On 14 November 1961, she signed with Disques Vogue—the record company, distinct from the fashion magazine. Its artistic director, Jacques Wolfsohn, had discovered her. On 25 April 1962, she recorded her first disc: four songs on a “super 45”, Vogue EPL 7967. Three of the four were her own. The label initially backed the jaunty Oh oh chéri, printing its title large on the sleeve.

            But politics, rather than the sleeve, decided everything. On 28 October 1962, France held a referendum on electing the president by popular vote. That evening, the whole country sat in front of its television sets, waiting for the results. Musical interludes filled the gaps between the figures. In one of them, a quiet girl with a guitar sang Tous les garçons et les filles—“All the boys and girls”. By morning, all France knew her. According to L’Express, five hundred thousand records were sold that year. The sleeve had to be redesigned: now Tous les garçons et les filles and J’suis d’accord took pride of place.
        sources:
          - title: Marie Claire — Premier contrat signé le 14 novembre 1961
            url: https://www.marieclaire.fr/francoise-hardy%2C1336089.asp
          - title: Encyclopédisque — Vogue EPL 7967
            url: https://www.encyclopedisque.fr/disque/19790.html
          - title: Le Monde — Françoise Hardy, icône de la culture pop, est morte, 11.06.2024
            url: https://www.lemonde.fr/disparitions/article/2024/06/11/francoise-hardy-icone-de-la-culture-pop-est-morte_6238944_3382.html
          - title: L’Express — Françoise Hardy, icône française de la chanson, 05.03.2015
            url: https://www.lexpress.fr/culture/musique/francoise-hardy-icone-francaise-de-la-chanson_1658165.html
