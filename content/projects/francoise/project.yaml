  - id: hits-1962
    kicker:
      ru: Глава шестая
      en: "Chapter Six"
    name:
      ru: Песни одинокой девочки
      en: "Songs of a Lonely Girl"
    blocks:
      - type: text
        text:
          ru: |
            Почему именно эта песня? В начале шестидесятых французские подростки пели в основном переделки американских хитов: брали чужую мелодию и сочиняли к ней бойкие французские слова. Песни были весёлые, громкие, про танцы и про то, что всё будет хорошо.

            Арди спела другое. В Tous les garçons et les filles девушка идёт по улице, а вокруг парочки — мальчики и девочки её возраста, которые держатся за руки и смотрят друг другу в глаза. А она одна. И не знает, когда наконец кто-нибудь возьмёт за руку и её. Никакого танца, никакого твиста. Простая мелодия, как будто подобранная на гитаре, и голос, который не старается понравиться. Миллионы подростков узнали в этой девушке себя. Одиночество, оказалось, тоже может быть хитом.

            Это и есть главное, что Арди сделала с французской эстрадой: внутри весёлого йе-йе она запела о том, о чём пели французские шансонье, — о тоске, неуверенности, печали, — но голосом девочки, а не взрослой дивы. Сама она объясняла это просто: её всю жизнь тянуло к меланхолическим мелодиям. «Это красота», — отвечала она, когда её спрашивали про грусть.
          en: |
            Why this song? In the early sixties, French teenagers mostly sang reworkings of American hits: someone else’s melody fitted with lively French words. The songs were cheerful and loud, about dancing and the promise that everything would be all right.

            Hardy sang something else. In Tous les garçons et les filles, a girl walks down the street surrounded by couples—boys and girls her age, holding hands and looking into each other’s eyes. She is alone. And she does not know when someone will finally take her hand, too. No dancing, no twist. A simple melody, as though picked out on a guitar, and a voice that makes no effort to please. Millions of teenagers recognised themselves in this girl. Loneliness, it turned out, could be a hit as well.

            This was Hardy’s great contribution to French pop: within the bright world of yé-yé, she began to sing about the things the French chanson tradition had always sung about—longing, uncertainty, sorrow—but in a girl’s voice, rather than a grown-up diva’s. Her own explanation was simple: melancholy melodies had drawn her all her life. “C’est la beauté,” she would answer when asked about sadness. It is beauty.
        sources:
          - title: Pitchfork — Françoise Hardy, La Question (review)
            url: https://pitchfork.com/reviews/albums/francoise-hardy-la-question/
          - title: "Rock&Folk — Françoise Hardy : « Les guitares électriques planantes… », 20.05.2018"
            url: https://www.rocknfolk.com/interview/francoise-hardy-les-guitares-electriques-planantes-cest-ce-dont-jai-reve-toute-ma-vie/4087
      - type: song
        title: "Tous les garçons et les filles"
        year: "1962"
        credits: {ru: "Слова — Франсуаза Арди, музыка — Арди и Роже Самин", en: "Lyrics by Françoise Hardy; music by Hardy and Roger Samyn"}
        label: "Vogue EPL 7967"
        text:
          ru: Девушка одна среди влюблённых пар. Самая простая мелодия на свете, и в этом сила. Во Франции песня прогремела после вечера референдума 28 октября 1962 года, в 1964-м добралась до тридцать шестого места в британском чарте. Скопитон к ней снял будущий автор «Мужчины и женщины» Клод Лелуш.
          en: "A girl alone among couples in love. The simplest melody in the world, and that is its strength. The song took France by storm after the referendum evening of 28 October 1962; in 1964, it reached number thirty-six in the British chart. Its Scopitone film was directed by Claude Lelouch, the future director of Un homme et une femme."
        video_id: m94_C8Z7wLk
        video_note: {ru: "Официальный скопитон, реж. Клод Лелуш", en: "Official Scopitone film, directed by Claude Lelouch"}
        sources:
          - title: Encyclopédisque — Vogue EPL 7967
            url: https://www.encyclopedisque.fr/disque/19790.html
          - title: Official Charts — Françoise Hardy
            url: https://www.officialcharts.com/artist/11186/francoise-hardy/
      - type: aside
        title:
          ru: Что такое скопитон
          en: "What Is a Scopitone?"
        text:
          ru: "Музыкальный автомат с экраном, который в шестидесятые стоял во французских кафе. Бросаешь монету, выбираешь песню — и смотришь короткий цветной фильм на шестнадцатимиллиметровой плёнке, минуты на три. Певцы снимались под готовую фонограмму. Это прадедушка музыкального клипа."
          en: "A jukebox with a screen, a fixture of French cafés in the sixties. Drop in a coin, choose a song, and watch a short colour film on sixteen-millimetre stock, about three minutes long. Singers performed to a prerecorded soundtrack. The great-grandfather of the music video."
        sources:
          - title: Musée Sacem — La télévision yéyé
            url: https://musee.sacem.fr/index.php/ExhibitionCMS/ExhibitionCMS/View?id=3881
      - type: song
        title: "Le Temps de l'amour"
        year: "1962"
        credits: {ru: "Слова — Люсьен Мориз и Андре Сальве, музыка — Жак Дютрон", en: "Lyrics by Lucien Morisse and André Salvet; music by Jacques Dutronc"}
        text:
          ru: Любовь, друзья, приключения и чувство, что юность проходит быстрее, чем хотелось бы. Упругая гитара. Мелодию сочинил Жак Дютрон — задолго до того, как стал её мужем. Через пятьдесят лет Уэс Андерсон поставил эту песню в «Королевство полной луны», и под неё танцуют на пляже двое двенадцатилетних беглецов.
          en: "Love, friends, adventures, and the feeling that youth is slipping away faster than you would like. A springy guitar line. Jacques Dutronc wrote the melody long before he became her husband. Fifty years later, Wes Anderson put the song in Moonrise Kingdom, where two twelve-year-old runaways dance to it on a beach."
        sources:
          - title: Musée Sacem — Françoise Hardy
            url: https://musee.sacem.fr/index.php/ExhibitionCMS/ExhibitionCMS/SimpleExhibitions?id=4821
          - title: ABKCO — Moonrise Kingdom soundtrack
            url: https://www.abkco.com/film/moonrise-kingdom-2/
      - type: song
        title: "J'suis d'accord"
        year: "1962"
        credits: {ru: "Слова — Арди, музыка — Арди и Роже Самин", en: "Lyrics by Hardy; music by Hardy and Roger Samyn"}
        text:
          ru: Бойкая сторона ранней Арди. Девушка соглашается на ухаживание — но у её согласия есть свои условия. Песня стояла на первой пластинке рядом с главным хитом.
          en: "The spirited side of early Hardy. A girl agrees to be courted—but her agreement comes with conditions. The song appeared on her first record alongside the big hit."
        sources:
          - title: Encyclopédisque — Vogue EPL 7967
            url: https://www.encyclopedisque.fr/disque/19790.html
      - type: song
        title: "Le Premier Bonheur du jour"
        year: "1963"
        credits: {ru: "Слова — Франк Жеральд, музыка — Жан Ренар", en: "Lyrics by Frank Gérald; music by Jean Renard"}
        text:
          ru: Первое счастье дня — это маленькие вещи, из которых складывается любовь. Камерная, почти домашняя песня, по которой назвали её второй альбом. На видео — новогодний выпуск телешоу Саша Дистеля 30 декабря 1963 года.
          en: "The first happiness of the day lies in the little things that make up love. An intimate, almost domestic song that gave her second album its title. The video comes from the New Year edition of Sacha Distel’s television show, broadcast on 30 December 1963."
        video_id: 7jh40FpjdQ0
        video_note: {ru: "Sacha Show, эфир 30.12.1963", en: "Sacha Show, broadcast 30.12.1963"}
        sources:
          - title: BnF — Le Premier Bonheur du jour, partition
            url: https://catalogue.bnf.fr/ark%3A/12148/cb44261036v
      - type: song
        title: "L'amour s'en va"
        year: "1963"
        credits: {ru: "Слова и музыка — Франсуаза Арди", en: "Words and music by Françoise Hardy"}
        text:
          ru: Любовь уходит — и всё равно её ищешь снова. С этой песней девятнадцатилетняя парижанка поехала на «Евровидение» в Лондон 23 марта 1963 года, но представляла не Францию, а Монако, и разделила пятое место. На конверте потом гордо написали «лауреат Евровидения». Не победа — но вся Европа её увидела.
          en: "Love goes away—and still you look for it again. With this song, the nineteen-year-old Parisienne travelled to the Eurovision Song Contest in London on 23 March 1963. She represented Monaco rather than France and tied for fifth place. The sleeve would later proudly proclaim her a “Eurovision laureate”. She had not won, but all Europe had seen her."
        video_id: SFf1lNB4Uas
        video_note: {ru: "«Евровидение-1963», Лондон", en: "Eurovision 1963, London"}
        sources:
          - title: Eurovision — London 1963, final
            url: https://www.eurovision.com/eurovision-song-contest/london-1963/london-1963-final/
          - title: Encyclopédisque — L’amour s’en va
            url: https://www.encyclopedisque.fr/disque/7694.html
      - type: art
        src: eurovision.webp
        alt:
          ru: Телестудия 1963 года, высокая девушка поёт перед оркестром, камеры на кранах
          en: "A television studio in 1963: a tall young woman sings in front of an orchestra, with cameras on cranes"
        size: wide
      - type: song
        title: "J'aurais voulu"
        year: "1963"
        credits: {ru: "Слова и музыка — Франсуаза Арди", en: "Words and music by Françoise Hardy"}
        text:
          ru: «Я хотела бы» — ещё одна песня о несбывшемся. В 1964 году она записала её по-английски, как I Wish It Were Me. На видео — архивное телевыступление из INA.
          en: "“I would have liked”—another song about what never came to be. In 1964, she recorded it in English as I Wish It Were Me. The video is an archival television performance from INA."
        video_id: bb9kVPZZoSo
        video_note: {ru: "Архив INA, 1963", en: "INA archive, 1963"}
        sources:
          - title: Françoise Hardy Sings in English, tracklist
            url: https://fr.wikipedia.org/wiki/Fran%C3%A7oise_Hardy_Sings_in_English

  - id: london
    kicker:
      ru: Глава седьмая
      en: "Chapter Seven"
    name:
      ru: Лондон звучит иначе
      en: "London Sounds Different"
    blocks:
      - type: text
        text:
          ru: |
            Скоро Арди поняла, что её не устраивает, как звучат её пластинки. Она слушала английский и американский поп, а парижские студийные музыканты играли его по-своему, тяжеловато и старомодно. Эстрадный певец Ришар Антони посоветовал ей ехать в Англию. С 1964 года она записывается в Лондоне, в студии Pye, с британскими аранжировщиками — прежде всего с Чарльзом Блэкуэллом, а ещё с Тони Хэтчем, Бобом Липером, Микки Бейкером, Джонни Харрисом.

            Лондон середины шестидесятых её обожал. Мик Джаггер, по распространённой цитате, называл её своей идеальной женщиной. Она бывала в кругу Брайана Джонса и Аниты Палленберг. Дэвид Боуи много лет спустя признавался, что был в неё страстно влюблён. Около 1970 года она встретилась с Ником Дрейком и хотела записать его песни; продюсер Джо Бойд пытался их свести, но из этого ничего не вышло.
          en: |
            Hardy soon realised she was unhappy with the sound of her records. She listened to British and American pop, but Parisian session musicians played it in their own rather heavy, old-fashioned style. The pop singer Richard Anthony advised her to go to England. From 1964, she recorded at Pye Studios in London with British arrangers—above all Charles Blackwell, but also Tony Hatch, Bob Leaper, Mickey Baker and Johnny Harris.

            London in the mid-sixties adored her. Mick Jagger, in a much-repeated quotation, called her his ideal woman. She spent time in Brian Jones and Anita Pallenberg’s circle. Many years later, David Bowie admitted to having been passionately in love with her. Around 1970, she met Nick Drake and wanted to record his songs; the producer Joe Boyd tried to bring them together, but nothing came of it.
        sources:
          - title: Rock&Folk — interview, 20.05.2018
            url: https://www.rocknfolk.com/interview/francoise-hardy-les-guitares-electriques-planantes-cest-ce-dont-jai-reve-toute-ma-vie/4087
          - title: Mon amie la rose (album), studio Pye
            url: https://fr.wikipedia.org/wiki/Mon_amie_la_rose
          - title: Vogue — Françoise Hardy, French girl style, 16.01.2015
            url: https://www.vogue.com/article/francoise-hardy-french-girl-style
          - title: Le Monde — Le Swinging London sous le charme de la Française, 17.11.2004
            url: https://www.lemonde.fr/archives/article/2004/11/17/le-swinging-london-sous-le-charme-de-la-francaise_387422_1819218.html
          - title: AP — Françoise Hardy obituary, 12.06.2024
            url: https://apnews.com/article/b097b2a2dcc26b4181f3487b8ab2f8e2
          - title: The Guardian — Françoise Hardy, France’s yé-yé groundbreaking artist, 12.06.2024
            url: https://www.theguardian.com/music/article/2024/jun/12/francoise-hardy-frances-ye-ye-groundbreaking-musical-artist
      - type: art
        src: london-studio.webp
        alt:
          ru: Высокая девушка выходит из лондонской студии в сумерках с гитарным кофром, красный автобус, дождь
          en: "A tall young woman leaves a London studio at dusk carrying a guitar case; a red bus, rain"
        size: bleed
      - type: song
        title: "Mon amie la rose"
        year: "1964"
        credits: {ru: "Слова — Сесиль Колье, музыка — Колье и Жак Лаком", en: "Lyrics by Cécile Caulier; music by Caulier and Jacques Lacome"}
        label: "Лондон, студия Pye, аранжировка Чарльза Блэкуэлла"
        text:
          ru: Роза, которая утром расцвела, а к вечеру увяла, — и девушка, которая понимает, что и с ней будет так же. Двадцатилетняя певица впервые поёт о смерти — тихо и нежно, отчего ещё страшнее. Не её собственная песня, но одна из самых её.
          en: "A rose that blooms in the morning and withers by evening—and a girl who understands that the same will happen to her. At twenty, the singer sings about death for the first time, softly and tenderly, which makes it all the more frightening. She did not write the song, but few songs are more completely hers."
        video_id: Oc702n95FC0
        video_note: {ru: "Архив INA, 26.04.1965", en: "INA archive, 26.04.1965"}
        sources:
          - title: BnF — Mon amie la rose
            url: https://catalogue.bnf.fr/rechercher.do?index=AUT3&numNotice=14835202
      - type: song
        title: "Et même"
        year: "1964"
        credits: {ru: "Слова и музыка — Франсуаза Арди", en: "Words and music by Françoise Hardy"}
        text:
          ru: «И даже если ты скажешь, что любишь, — после измены всё уже не будет как прежде». Настойчивый ритм, решительная девушка. В Британии песня поднялась до тридцать первого места.
          en: "“And even if you say you love me, after betrayal nothing will be as it was.” An insistent rhythm, a girl who has made up her mind. In Britain, the song reached number thirty-one."
        sources:
          - title: Official Charts — Françoise Hardy
            url: https://www.officialcharts.com/artist/11186/francoise-hardy/
      - type: song
        title: "All Over the World"
        year: "1965"
        credits: {ru: "Музыка — Арди (Dans le monde entier), английский текст — Джулиан Мор, аранжировка — Чарльз Блэкуэлл", en: "Music by Hardy (Dans le monde entier); English lyrics by Julian More; arrangement by Charles Blackwell"}
        text:
          ru: Её главный английский хит — шестнадцатое место в британском чарте и пятнадцать недель в нём. Любовь и одиночество, которые понятны «по всему миру». Француженка, поющая по-английски с акцентом, оказалась в Лондоне своей.
          en: "Her biggest English-language hit: number sixteen in the British chart, where it stayed for fifteen weeks. Love and loneliness understood “all over the world”. A Frenchwoman singing English with an accent had found a home in London."
        sources:
          - title: Official Charts — All Over the World
            url: https://www.officialcharts.com/songs/francoise-hardy-all-over-the-world/
      - type: song
        title: "L'Amitié"
        year: "1965"
        credits: {ru: "Слова — Жан-Макс Ривьер, музыка — Жерар Буржуа", en: "Lyrics by Jean-Max Rivière; music by Gérard Bourgeois"}
        text:
          ru: Не всё у Арди про несчастную любовь. Эта песня — про дружбу как убежище, про друзей, которые приходят и уходят, но оставляют в тебе часть себя. Тёплая, гостеприимная, одна из самых любимых во Франции.
          en: "Not every Hardy song is about unhappy love. This one is about friendship as a refuge, about friends who come and go but leave something of themselves with you. Warm and welcoming, it remains one of her best-loved songs in France."
        sources:
          - title: Discographie de Françoise Hardy
            url: https://fr.wikipedia.org/wiki/Discographie_de_Fran%C3%A7oise_Hardy
      - type: song
        title: "Ce petit cœur"
        year: "1965"
        credits: {ru: "Слова и музыка — Франсуаза Арди, оркестр Чарльза Блэкуэлла", en: "Words and music by Françoise Hardy; Charles Blackwell’s orchestra"}
        text:
          ru: Маленькое сердце, которое никакими обещаниями не привяжешь. Короткий упругий поп лондонского звучания. По-английски — This Little Heart.
          en: "A little heart that no promise can tie down. A short, buoyant piece of pop with a London sound. In English, This Little Heart."
        sources:
          - title: MusicBrainz — Comment te dire adieu, recording credits
            url: https://musicbrainz.org/release/cb9f9cb6-900c-4b93-b682-641c1b9b16c4
      - type: song
        title: "Le Temps des souvenirs"
        year: "1965"
        credits: {ru: "Французский текст — Жак Датен и Морис Видален, музыка — Чарльз Блэкуэлл", en: "French lyrics by Jacques Datin and Maurice Vidalin; music by Charles Blackwell"}
        text:
          ru: "Здесь Блэкуэлл не только аранжировщик, но и автор: это французская версия его песни Just Call and I'll Be There. Память о любви и готовность откликнуться на зов."
          en: "Here Blackwell is the composer as well as the arranger: this is the French version of his song Just Call and I'll Be There. The memory of love, and the willingness to answer its call."
        sources:
          - title: Discographie de Françoise Hardy
            url: https://fr.wikipedia.org/wiki/Discographie_de_Fran%C3%A7oise_Hardy

  - id: cinema
    kicker:
      ru: Глава восьмая
      en: "Chapter Eight"
    name:
      ru: Лицо для кино
      en: "A Face for the Cinema"
    blocks:
      - type: text
        text:
          ru: |
            Лицо Арди было создано для камеры, и кино это быстро заметило. В 1963 году Роже Вадим снял её в «Замке в Швеции» в роли Офелии. В 1966-м — в тот самый год, когда к ней приставал Дилан, — она мелькнула у Жан-Люка Годара в «Мужском — женском»: проходит по кадру спутницей военного, всего несколько секунд. Главную певицу там играла другая звезда йе-йе, Шанталь Гойя. В том же году Джон Франкенхаймер снял её в «Гран-при», голливудском фильме об автогонках, в роли Лизы.

            Но настоящим её кино были фотографии. Жан-Мари Перье, главный фотограф Salut les copains, был её возлюбленным и автором её образа. Это он снимал её для обложек — длинную, тонкую, серьёзную, с прямыми волосами и чёлкой, на фоне парижских крыш и лондонских улиц.
          en: |
            Hardy’s face was made for the camera, and cinema soon noticed. In 1963, Roger Vadim cast her as Ophélie in Château en Suède. In 1966—the very year Dylan was pursuing her—she appeared fleetingly in Jean-Luc Godard’s Masculin féminin: just a few seconds, crossing the frame beside a soldier. The principal singer in that film was played by another yé-yé star, Chantal Goya. That same year, John Frankenheimer cast Hardy as Lisa in Grand Prix, his Hollywood film about motor racing.

            But her real cinema was photography. Jean-Marie Périer, the principal photographer at Salut les copains, was her lover and the creator of her image. He photographed her for the covers: tall, slender, serious, with straight hair and a fringe, against Parisian rooftops and London streets.
        sources:
          - title: L’Officiel des spectacles — Château en Suède
            url: https://www.offi.fr/cinema/evenement/chateau-en-suede-5398.html
          - title: Cinémathèque française — Masculin féminin
            url: https://www.cinematheque.fr/film/48812.html
          - title: Vogue France — Françoise Hardy, Grand Prix, 1966
            url: https://www.vogue.fr/culture/a-voir/articles/francoise-hardy-grand-prix-image-vintage-film-1966/55125
          - title: Agnès C. Poirier — The New York Times, 9 May 2018 (via WRAL)
