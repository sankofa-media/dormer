  - id: fashion
    kicker:
      ru: Глава девятая
      en: "Chapter Nine"
    name:
      ru: Смокинг, сапоги и девять килограммов золота
      en: "A Dinner Suit, Boots and Nine Kilograms of Gold"
    blocks:
      - type: text
        text:
          ru: |
            Говорят, Арди не интересовалась модой. Это неправда — или правда только наполовину. Она не любила наряжаться, как наряжались эстрадные певицы, но одежду подбирала сознательно и точно знала, что ей идёт. А шло ей то, что никому из певиц до неё не приходило в голову надеть.

            Очень высокая для своего времени, с узкими плечами, длинными ногами и почти мальчишеской фигурой. Пышные юбки и кружева пятидесятых на ней выглядели бы чужими. Зато мужская рубашка, прямые джинсы, плащ-тренч, брюки, короткое прямое платье и плоские сапоги сидели на ней так, будто их придумали для неё. Длинные прямые волосы, тяжёлая чёлка до бровей, почти никакой косметики и строгое, немного печальное лицо. Через несколько лет так захочет выглядеть половина европейских девушек.
          en: |
            People say Hardy was not interested in fashion. It is untrue, or only half true. She disliked dressing up the way other pop singers did, but she chose her clothes deliberately and knew exactly what suited her. What suited her, as it happened, were things no female singer before her had thought to wear.

            She was unusually tall for her time, with narrow shoulders, long legs and an almost boyish figure. The full skirts and lace of the fifties would have looked alien on her. But a man’s shirt, straight-leg jeans, a trench coat, trousers, a short shift dress and flat boots looked as though they had been invented for her. Long, straight hair, a heavy fringe down to her eyebrows, almost no make-up and a solemn, faintly sad face. Within a few years, half the young women in Europe would want to look like that.
        sources:
          - title: L’Express — Françoise Hardy, icône française de la chanson, 05.03.2015
            url: https://www.lexpress.fr/culture/musique/francoise-hardy-icone-francaise-de-la-chanson_1658165.html
          - title: Vogue — Françoise Hardy, French girl style, 16.01.2015
            url: https://www.vogue.com/article/francoise-hardy-french-girl-style
      - type: gallery
        layout: grid
        items:
          - type: art
            src: fashion-courreges.webp
            alt: {ru: "Высокая девушка в белом коротком платье и белых плоских сапогах", en: "A tall young woman in a short white dress and flat white boots"}
            caption: {ru: "Курреж, 1965", en: "Courrèges, 1965"}
          - type: art
            src: fashion-smoking.webp
            alt: {ru: "Высокая девушка в чёрном смокинге с брюками, руки в карманах", en: "A tall young woman in a black dinner jacket and trousers, hands in her pockets"}
            caption: {ru: "Ив Сен-Лоран, 1967", en: "Yves Saint Laurent, 1967"}
          - type: art
            src: fashion-metal.webp
            alt: {ru: "Высокая девушка в платье из металлических пластин", en: "A tall young woman in a dress made of metal plates"}
            caption: {ru: "Пако Рабан, 1968", en: "Paco Rabanne, 1968"}
          - type: art
            src: fashion-street.webp
            alt: {ru: "Высокая девушка в плаще, джинсах и мужской рубашке с гитарным кофром", en: "A tall young woman in a trench coat, jeans and a man’s shirt, carrying a guitar case"}
            caption: {ru: "Сама по себе", en: "On Her Own Terms"}
      - type: text
        text:
          ru: |
            **Курреж.** В середине шестидесятых модельер Андре Курреж придумал «космическую» моду: белые геометрические платья-трапеции выше колена, белые плоские сапоги, очки-щели. Арди стала одним из лиц этой моды на сцене. Она сама вспоминала белую тунику от Куррежа, в которой выступала.

            **Мини.** В её гардеробе была и мини-юбка лондонской портнихи Мэри Куант. Первой в мире в мини Арди не была, как иногда пишут, — но одной из первых, кто носил её во Франции так естественно, будто иначе и быть не могло.
          en: |
            **Courrèges.** In the mid-sixties, the designer André Courrèges invented “space-age” fashion: white geometric A-line dresses above the knee, flat white boots, slit sunglasses. Hardy became one of its faces onstage. She herself remembered performing in a white Courrèges tunic.

            **The mini.** Her wardrobe also included a miniskirt by the London designer Mary Quant. Hardy was not the first woman in the world to wear a mini, as is sometimes claimed. But she was among the first to wear one in France so naturally that it seemed she could hardly have worn anything else.
        sources:
          - title: Agnès C. Poirier — The New York Times, 9 May 2018 (via WRAL)
            url: https://www.wral.com/archive/17543183/
          - title: "The Museum at FIT — Paris, Refashioned: fashion and celebrity"
            url: https://exhibitions.fitnyc.edu/paris-refashioned/fashion-and-celebrity/
          - title: RTL — Mort de Françoise Hardy, 11.06.2024
            url: https://www.rtl.fr/culture/musique/mort-de-francoise-hardy-une-legende-de-la-culture-pop-sublime-et-moderne-7900045873
      - type: photo
        src: hardy-1967-ysl-crudo.jpg
        alt:
          ru: Франсуаза Арди в смокинге на сцене «Олимпии», над сценой эмблема Interparade 67
          en: "Françoise Hardy in a dinner suit onstage at the Olympia, with the Interparade 67 emblem above the stage"
        caption:
          ru: Interparade, «Олимпия», 25 января 1967 года. Арди в смокинге Ив Сен-Лорана.
          en: "Interparade, Olympia, 25 January 1967. Hardy in an Yves Saint Laurent dinner suit."
        credit: "Фото: André Crudo / Photo12"
        source_url: https://www.photo12.com/fr/image/acd23a00_027
        size: wide
        treatment: print
      - type: text
        text:
          ru: |
            **Смокинг.** Осенью 1966 года Ив Сен-Лоран показал Le Smoking — женский смокинг с брюками. Тогда женщину в брюках могли не пустить в ресторан. Двадцать пятого января 1967 года Арди вышла в таком смокинге на сцену «Олимпии» на гала-концерте Interparade — и фотограф Андре Крюдо это снял. Существует и рассказ, будто в смокинге её освистала публика в Парижской опере; когда это было и на каком снимке, установить не удалось.
          en: |
            **Le Smoking.** In the autumn of 1966, Yves Saint Laurent unveiled Le Smoking, a dinner jacket and trousers for women. At the time, a woman in trousers could still be refused entry to a restaurant. On 25 January 1967, Hardy wore one onstage at the Olympia for the Interparade gala, and the photographer André Crudo captured it. There is also a story that an audience at the Paris Opéra booed her for wearing a dinner suit; when this happened, and which photograph records it, could not be established.
        sources:
          - title: Musée YSL — dossier pédagogique, Le Smoking, automne-hiver 1966
            url: https://s3-eu-west-1.amazonaws.com/musee-ysl-paris/press-releases/Dossier-p%C3%A9dagogique-GOLD-Les-ors-dYves-Saint-Laurent-14.10.22-14.05.2023.pdf
          - title: Photo12 — André Crudo, Interparade, Olympia, 25 janvier 1967
            url: https://www.photo12.com/fr/image/acd23a00_027
          - title: Le Monde — Le tailleur pour dames indémodable, 08.05.2025
            url: https://www.lemonde.fr/m-styles/article/2025/05/08/le-tailleur-pour-dames-indemodable_6603989_4497319.html
      - type: photo
        src: hardy-1968-rabanne-perier.jpg
        alt:
          ru: Франсуаза Арди в комбинезоне из блестящих металлических пластин, руки на бёдрах
          en: "Françoise Hardy in a jumpsuit made of gleaming metal plates, hands on her hips"
        caption:
          ru: В металле Пако Рабана, май 1968 года. Снимок Жан-Мари Перье.
          en: "In Paco Rabanne’s metal, May 1968. Photograph by Jean-Marie Périer."
        credit: "Фото: Jean-Marie Périer / Photo12"
        source_url: https://www.photo12.com/fr/image/jmp01316_009
        size: right
        treatment: print
      - type: text
        text:
          ru: |
            **Золото.** Модельер Пако Рабан шил платья не из ткани, а из металлических пластин, соединённых колечками, — плоскогубцами, а не иглой. В мае 1968 года, пока Париж строил баррикады, он сделал для Арди платье из золотых пластинок. Дом Rabanne пишет о девяти килограммах чистого золота; Vogue — о тысяче пластин и тремстах каратах бриллиантов. Рабан объяснял, что видит в ней сочетание дистанции, современности, твёрдости и романтизма. Лучше и не скажешь.

            **После.** Её стиль пережил её моду. Тренч, прямые джинсы, мужская рубашка, чёлка — на это и сегодня ссылаются, когда говорят о «французском шике». Алекса Чанг называла Арди своей иконой стиля. Критики видели отсылки к ней в коллекциях Эди Слимана для Celine. Сама Арди, когда её называли иконой, отвечала, что это кажется ей нелепым.
          en: |
            **Gold.** Paco Rabanne made dresses from metal plates joined by little rings, working with pliers rather than a needle. In May 1968, while Paris was building barricades, he made Hardy a dress of gold plates. The house of Rabanne describes nine kilograms of pure gold; Vogue mentions a thousand plates and three hundred carats of diamonds. Rabanne explained that he saw in her a combination of distance, modernity, strength and romanticism. It is hard to put it better.

            **Afterwards.** Her style outlasted the fashions she wore. The trench coat, the straight-leg jeans, the man’s shirt, the fringe: these are still reference points whenever anyone speaks of “French chic”. Alexa Chung named Hardy as her style icon. Critics saw echoes of her in Hedi Slimane’s collections for Celine. Hardy herself said she found it ridiculous to be called an icon.
        sources:
          - title: Rabanne — Monsieur Paco Rabanne, histoire de la maison
            url: https://fashion.rabanne.com/fr/pages/monsieur-paco-rabanne
          - title: Vogue — Paco Rabanne obituary, 03.02.2023
            url: https://www.vogue.com/article/paco-rabanne-obituary
          - title: Le Monde — Métal conquérant, 08.05.2024
            url: https://www.lemonde.fr/m-styles/article/2024/05/08/metal-conquerant_6232153_4497319.html
          - title: Harper’s Bazaar UK — Best French style heroes, 2019
            url: https://www.harpersbazaar.com/uk/fashion/g26945676/best-french-style-heroes/
          - title: DireDonna — Celine autunno inverno 2020-2021
            url: https://www.diredonna.it/celine-autunno-inverno-2020-2021-3322949.html
          - title: AFP via La Gazette France — Françoise Hardy, icône pop malgré elle, 2024
            url: https://www.lagazettefrance.fr/article/francoise-hardy-icone-pop-malgre-elle
      - type: gallery
        layout: strip
        items:
          - type: photo
            src: hardy-1969-amsterdam-0817.jpg
            alt: {ru: "Франсуаза Арди в меховой шубе, Амстердам", en: "Françoise Hardy in a fur coat, Amsterdam"}
            caption: {ru: "Амстердам, 16 декабря 1969 года.", en: "Amsterdam, 16 December 1969."}
            credit: "Фото: Joost Evers / Anefo, Nationaal Archief, CC0"
            source_url: https://commons.wikimedia.org/wiki/File:Franse_zangeres-actrice_Francoise_Hardy_in_Amsterdam,_Bestanddeelnr_923-0819.jpg
            treatment: print
          - type: photo
            src: hardy-1969-amsterdam-0819.jpg
            alt: {ru: "Франсуаза Арди в меховой шубе смотрит в камеру", en: "Françoise Hardy in a fur coat, looking at the camera"}
            caption: {ru: "Там же.", en: "The same occasion."}
            credit: "Фото: Joost Evers / Anefo, Nationaal Archief, CC0"
            source_url: https://commons.wikimedia.org/wiki/File:Franse_zangeres-actrice_Francoise_Hardy_in_Amsterdam,_Bestanddeelnr_923-0819.jpg
            treatment: print
          - type: photo
            src: hardy-1969-amsterdam-0820.jpg
            alt: {ru: "Франсуаза Арди, портрет", en: "Françoise Hardy, portrait"}
            caption: {ru: "Там же.", en: "The same occasion."}
            credit: "Фото: Joost Evers / Anefo, Nationaal Archief, CC0"
            source_url: https://commons.wikimedia.org/wiki/File:Franse_zangeres-actrice_Francoise_Hardy_in_Amsterdam,_Bestanddeelnr_923-0819.jpg
