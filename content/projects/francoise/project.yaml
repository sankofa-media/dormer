chapters:

  - id: intermission
    kicker:
      ru: Глава первая
      en: "Chapter One"
    name:
      ru: Антракт, который не кончался
      en: "The Intermission That Would Not End"
    blocks:
      - type: poster
        paper: "#f4ead6"
        lines:
          - {text: "OLYMPIA", size: xl, font: display, color: "#d7262e"}
          - {text: "Bruno Coquatrix présente", size: s, font: grotesk, color: "#1d2a5b"}
          - {text: "BOB DYLAN", size: xl, font: grotesk, color: "#1d2a5b"}
          - {text: "mardi 24 mai 1966", size: m, font: script, color: "#d7262e"}
          - {text: "1re partie : seul à la guitare · 2e partie : avec ses musiciens", size: s, font: grotesk, color: "#1d2a5b"}
      - type: text
        text:
          ru: |
            Двадцать четвёртого мая 1966 года Бобу Дилану исполнилось двадцать пять лет. Вечер своего дня рождения он проводил на сцене парижского мюзик-холла «Олимпия», на бульваре Капуцинок, — там, где пела Эдит Пиаф. Это было одно из самых тяжёлых турне в его жизни. Первое отделение он играл один, с акустической гитарой и губной гармошкой, как играл раньше. Во втором выходил с электрической группой, и по всей Европе зал в этот момент начинал свистеть, топать и кричать «предатель». Парижане исключением не были.

            В антракте за кулисами что-то пошло не так. Антракт затягивался. Публика ждала. А потом к одной из зрительниц подошли и передали: Дилан не вернётся на сцену, пока она не придёт к нему.

            Зрительнице было двадцать два года. Её звали Франсуаза Арди, и во Франции её знал каждый.
          en: |
            On 24 May 1966, Bob Dylan turned twenty-five. He spent the evening of his birthday onstage at the Olympia music hall on the Boulevard des Capucines in Paris, where Édith Piaf had sung. It was one of the hardest tours of his life. For the first half he played alone, with an acoustic guitar and a harmonica, as he always had. For the second, he came out with an electric band, and all over Europe this was the moment when audiences began to whistle, stamp their feet and shout “traitor”. Paris was no exception.

            During the interval, something went wrong backstage. The intermission dragged on. The audience waited. Then someone approached a young woman in the crowd with a message: Dylan would not return to the stage until she came to see him.

            She was twenty-two. Her name was Françoise Hardy, and everyone in France knew who she was.
        sources:
          - title: Bob Dylan — Olympia Theatre, Paris, May 24, 1966 (official concert archive)
            url: https://www.bobdylan.com/date/1966-05-24-olympia-theatre/
          - title: Agnès C. Poirier — Françoise Hardy interview, The New York Times (via WRAL)
            url: https://www.wral.com/archive/17543183/
          - title: Le Monde — Le Swinging London sous le charme de la Française, 17.11.2004
            url: https://www.lemonde.fr/archives/article/2004/11/17/le-swinging-london-sous-le-charme-de-la-francaise_387422_1819218.html
      - type: art
        src: olympia-night.webp
        alt:
          ru: Фасад парижского мюзик-холла ночью, красный неон, очередь молодых людей в пальто, у тротуара машина
          en: "The façade of a Paris music hall at night, red neon, young people in coats queuing, a car at the kerb"
        size: bleed
      - type: photo
        src: dylan-olympia-1966-poster.jpg
        alt:
          ru: Афиша концерта Боба Дилана в «Олимпии», 1966
          en: "Poster for Bob Dylan’s concert at the Olympia, 1966"
        caption:
          ru: Афиша парижского концерта 24 мая 1966 года.
          en: "Poster for the Paris concert on 24 May 1966."
        credit: "Автор афиши не установлен. Скан: коллекция Come Writers and Critics"
        source_url: https://www.bobdylan-comewritersandcritics.com/pages/programmes/dylan-paris-24-may-1966.htm
        size: right
        treatment: print
      - type: art
        src: dylan-stage.webp
        alt:
          ru: Худой кудрявый певец один на тёмной сцене с акустической гитарой и гармошкой
          en: "A thin, curly-haired singer alone on a dark stage with an acoustic guitar and harmonica"
        size: wide
      - type: art
        src: intermission.webp
        alt:
          ru: Певец в тёмных очках сидит на кофре за кулисами, скрестив руки, вокруг встревоженные люди
          en: "A singer in dark glasses sits backstage on a flight case, arms folded, surrounded by anxious people"
        size: bleed
      - type: quote
        text:
          ru: Боб Дилан отказывался вернуться на сцену, пока я немедленно не приду к нему.
          en: "Bob Dylan refused to go back onstage unless I came to see him immediately"
        attribution: "Франсуаза Арди, интервью The New York Times, 2018"
        source:
          title: Agnès C. Poirier — The New York Times, 9 May 2018 (via WRAL)
          url: https://www.wral.com/archive/17543183/
      - type: text
        text:
          ru: |
            Так эту историю рассказывала сама Арди — и в 2008 году в мемуарах «Отчаяние обезьян и прочие пустяки», и в интервью полвека спустя. Похожий рассказ напечатан ещё в 2004 году в книге о Дилане, на которую ссылалась Le Monde. Слышала ли она этот ультиматум из уст самого Дилана, неизвестно: ей его передали. Но она пошла.

            Высокая, тонкая, с длинными прямыми волосами и тяжёлой чёлкой, она прошла по коридору за сценой, глядя в пол. Она была очень застенчива — так застенчива, что через два года бросит выступать на сцене совсем. Дилан её увидел. И вернулся к публике.
          en: |
            That is how Hardy herself told the story, both in her 2008 memoir, Le Désespoir des singes… et autres bagatelles, and in interviews half a century after the event. A similar account had appeared as early as 2004 in a book about Dylan cited by Le Monde. Whether she heard the ultimatum from Dylan himself is unknown: someone relayed it to her. But she went.

            Tall and slender, with long, straight hair and a heavy fringe, she walked down the backstage corridor with her eyes on the floor. She was painfully shy—so shy that two years later she would give up live performance altogether. Dylan saw her. And went back to his audience.
        sources:
          - title: Le Désespoir des singes… et autres bagatelles, Robert Laffont, 2008, pp. 73–74 (via bibliographic citation)
            url: https://fr.wikipedia.org/wiki/Fran%C3%A7oise_Hardy_Sings_in_English
          - title: Le Monde — Le Swinging London sous le charme de la Française, 17.11.2004
            url: https://www.lemonde.fr/archives/article/2004/11/17/le-swinging-london-sous-le-charme-de-la-francaise_387422_1819218.html
          - title: Le Figaro — Françoise Hardy et ses douze partages, 27.11.2006
            url: https://www.lefigaro.fr/2006/11/27/03004-20061127ARTFIG90021-francoise_hardy_et_ses_douze_partages.php
      - type: art
        src: she-arrives.webp
        alt:
          ru: Высокая девушка с чёлкой в плаще быстро идёт по коридору за кулисами, опустив глаза
          en: "A tall young woman with a fringe, wearing a raincoat, hurries down a backstage corridor with her eyes lowered"
        size: column

  - id: seine
    kicker:
      ru: Глава вторая
      en: "Chapter Two"
    name:
      ru: «У берега Сены»
      en: "“At the Seine’s Edge”"
    blocks:
      - type: text
        text:
          ru: |
            Чтобы понять, почему Дилан так её ждал, нужно вернуться на два года назад. В августе 1964 года вышел его четвёртый альбом, Another Side of Bob Dylan. На обороте конверта, мелким шрифтом, были напечатаны его стихи — длинный цикл свободных строк без заглавных букв. И одно стихотворение начиналось так: «for françoise hardy / at the seine's edge» — «для франсуазы арди / у берега сены». Дальше — Париж, каким его видит человек, ни разу там не бывавший: Нотр-Дам, студенты, велосипеды, влюблённые, река.

            Лично они знакомы не были. Арди потом объясняла это так: Дилан, по её словам, был романтически очарован её фотографией. В 1964 году её лицо уже смотрело с обложек пластинок и журналов по всей Европе, и с одной из этих фотографий, видимо, всё и началось.
          en: |
            To understand why Dylan was so determined to see her, we have to go back two years. In August 1964, he released his fourth album, Another Side of Bob Dylan. On the back of the sleeve, in small print, were his poems: a long sequence of free verse without capital letters. One began “for françoise hardy / at the seine's edge”. What followed was Paris as imagined by someone who had never been there: Notre-Dame, students, bicycles, lovers, the river.

            They had never met. Hardy later explained that Dylan had developed, in her words, a “romantic fixation on a photo of me”. By 1964, her face was on record sleeves and magazine covers across Europe, and one of those photographs seems to have been where it all began.
        sources:
          - title: Bob Dylan — Another Side of Bob Dylan, liner notes (official site)
            url: https://www.bobdylan.com/albums/another-side-of-bob-dylan/
          - title: Pitchfork — French Icon Françoise Hardy on the Music of Her Life, 10.05.2018
            url: https://pitchfork.com/features/5-10-15-20/french-icon-francoise-hardy-on-the-music-of-her-life/
          - title: MusicBrainz — Another Side of Bob Dylan, editions
            url: https://musicbrainz.org/release-group/b18ef710-0e47-3c10-ab0b-6631533549ee
      - type: art
        src: seine.webp
        alt:
          ru: Высокая девушка одна облокотилась на парапет набережной Сены, зелёные ящики букинистов
          en: "A tall young woman leans alone against the parapet beside the Seine, with the green boxes of the booksellers nearby"
        size: bleed
      - type: clipping
        style: magazine
        masthead: "Another Side of Bob Dylan"
        date: "1964"
        headline: "for françoise hardy"
        deck:
          ru: Стихи на обороте конверта, Columbia CS 8993
          en: "Poems on the back cover, Columbia CS 8993"
        body:
          ru: "for françoise hardy / at the seine's edge…"
          en: "for françoise hardy / at the seine's edge…"
        cite:
          publication: Bob Dylan, Another Side of Bob Dylan, liner notes
          date: "1964-08-08"
          page: "back cover"
          url: https://www.bobdylan.com/albums/another-side-of-bob-dylan/
        paper: paper-news.webp
      - type: photo
        src: dylan-1963-hunstein.jpg
        alt:
          ru: Молодой Боб Дилан у микрофона в студии
          en: "A young Bob Dylan at a studio microphone"
        caption:
          ru: Боб Дилан в студии, 1963 год, рекламный снимок к альбому The Times They Are a-Changin'. Через год он напишет стихи для Франсуазы.
          en: "Bob Dylan in the studio, 1963, in a publicity photograph for The Times They Are a-Changin'. A year later, he would write poems for Françoise."
        credit: "Фото: Don Hunstein / Columbia Records, Wikimedia Commons (public domain)"
        source_url: https://commons.wikimedia.org/wiki/File:Bob_Dylan_1963_promo_photo_by_Don_Hunstein.jpg
        size: left
        treatment: halftone
      - type: text
        text:
          ru: |
            Долго держалась легенда, будто они встречались раньше, в Лондоне в 1964 или 1965 году, где оба записывались и выступали. Подтверждения этому нет, а сама Арди в 2018 году прямо называла Париж местом их первой встречи. Лондонская встреча — из тех историй, которые хочется рассказать, но рассказывать не стоит.
          en: |
            For years, a story persisted that they had met earlier, in London in 1964 or 1965, where both were recording and performing. There is no evidence for it, and in 2018 Hardy explicitly named Paris as the place of their first meeting. The London encounter is one of those stories that is tempting to tell, but better left untold.
        sources:
          - title: Agnès C. Poirier — The New York Times, 9 May 2018 (via WRAL)
            url: https://www.wral.com/archive/17543183/

  - id: george-v
    kicker:
      ru: Глава третья
      en: "Chapter Three"
    name:
      ru: Ночь в «Георге V»
      en: "A Night at the George V"
    blocks:
      - type: text
        text:
          ru: |
            После концерта Арди оказалась в отеле «Георг V», в двух шагах от Елисейских Полей, где жил Дилан. Накануне там же он давал пресс-конференцию. Теперь в его номере толпились гости. И тут Дилан попросил её прийти — одну, — чтобы дать послушать две новые песни. Альбом Blonde on Blonde ещё не вышел. Песни назывались Just Like a Woman и I Want You.

            Сыграл ли он их на гитаре или поставил свежие студийные записи — рассказы расходятся. Газета The Independent писала про гитару, испанская El País — что он дал ей их послушать. Мы скажем осторожно: в ту ночь Франсуаза Арди одной из первых в мире услышала две песни, которые потом знал наизусть весь мир.

            И почти ничего не поняла. Английский у неё был школьный, смысл она улавливала урывками. А разговора не получилось вовсе.
          en: |
            After the concert, Hardy found herself at the Hôtel George V, a short walk from the Champs-Élysées, where Dylan was staying. He had held a press conference there the day before. Now his room was crowded with guests. Then Dylan asked her to come over—alone—to hear two new songs. Blonde on Blonde had not yet been released. The songs were Just Like a Woman and I Want You.

            Whether he played them on his guitar or put on the new studio recordings depends on whose account you read. The Independent wrote of a guitar; Spain’s El País said he let her hear them. We can put it cautiously: that night, Françoise Hardy was among the first people in the world to hear two songs the whole world would later know by heart.

            And she understood almost nothing. Her English was what she had learnt at school; she caught the meaning in fragments. As for conversation, there was none.
        sources:
          - title: Billboard, 11 June 1966 — press conference in the George V Hotel
            url: https://www.worldradiohistory.com/Archive-All-Music/Billboard/60s/1966/Billboard%201966-06-11.pdf
          - title: ELLE — Quand Bob Dylan était obsédé par Françoise Hardy, 2026
            url: https://www.elle.fr/Loisirs/Musique/News/Lettres-d-amour-poemes-Quand-Bob-Dylan-etait-obsede-par-Francoise-Hardy-4305662
          - title: "The Independent — Françoise Hardy: Belle star, 2005"
            url: https://www.independent.co.uk/news/people/profiles/frana-oise-hardy-belle-star-13471.html
          - title: EL PAÍS — Cuando Bob Dylan conoció a Françoise Hardy, 12.06.2024
            url: https://elpais.com/cultura/2024-06-12/cuando-bob-dylan-conocio-a-francoise-hardy.html
      - type: art
        src: hotel-room.webp
        alt:
          ru: Роскошный гостиничный номер ночью, кудрявый певец играет, девушка вежливо слушает на диване, дым, подносы, пластинки
          en: "A luxurious hotel room at night: a curly-haired singer plays while a young woman listens politely on a sofa, amid smoke, trays and records"
        size: bleed
      - type: quote
        text:
          ru: Он казался очень застенчивым, и я тоже была очень застенчива.
          en: "he seemed very shy, and I was very shy too"
        attribution: "Франсуаза Арди, Pitchfork, 2018"
        source:
          title: Pitchfork — French Icon Françoise Hardy on the Music of Her Life
          url: https://pitchfork.com/features/5-10-15-20/french-icon-francoise-hardy-on-the-music-of-her-life/
      - type: text
        text:
          ru: |
            Вот и вся сцена: двое самых застенчивых людей в шумной комнате, один не говорит по-французски, другая еле говорит по-английски, между ними — две песни. Остальное додумали журналисты. Сама Арди впечатлением делилась невесёлым. В 2001 году она вспоминала, что Дилан был «в очень плохом состоянии»: страшно худой, издёрганный, на пределе — это было турне, после которого он разобьётся на мотоцикле и на годы исчезнет из виду. Что именно с ним было, она не говорила, и гадать мы не будем.

            Романа не было. В 2005 году она сказала британской газете — во всяком случае, так передал её слова испанский перевод, — что Дилан интересовал её как артист, а не как мужчина. И больше они, кажется, не виделись. В одном интервью она говорила, что встречалась с ним только однажды — в Париже, в 1966-м.
          en: |
            That was the whole scene: two desperately shy people in a noisy room, one speaking no French, the other barely any English, and two songs between them. Journalists imagined the rest. Hardy’s own recollection was far from happy. In 2001, she recalled that “il était en très mauvais état”—he was in a very bad way: terribly thin, strung out, at the end of his tether. This was the tour after which he would crash his motorcycle and disappear from public view for years. She did not say exactly what was wrong with him, and we will not speculate.

            There was no affair. In 2005, she told a British newspaper—or so a Spanish translation reported her words—that Dylan interested her as an artist, not as a man. And it seems they never met again. In one interview she said she had met him only once, in Paris in 1966.
        sources:
          - title: ELLE — Quand Bob Dylan était obsédé par Françoise Hardy (Catherine Ceylac interview, 2001)
            url: https://www.elle.fr/Loisirs/Musique/News/Lettres-d-amour-poemes-Quand-Bob-Dylan-etait-obsede-par-Francoise-Hardy-4305662
          - title: EFE / EL PAÍS — 14.01.2005
            url: https://elpais.com/diario/2005/01/14/agenda/1105657206_850215.html
          - title: APA/dpa — Bob Dylans Briefe an Hardy, 02.05.2018
            url: https://www.tt.com/artikel/14312904/bob-dylans-briefe-an-hardy-muss-sehr-in-mich-verliebt-gewesen-sein
      - type: aside
        title:
          ru: Фотографии той ночи
          en: "Photographs of That Night"
        text:
          ru: "В тот вечер их снимали вместе по крайней мере два фотографа — Жан-Пьер Лелуар (кадр хранится в архиве Лелуара, его продаёт парижская галерея Polka) и Джанкарло Ботти из агентства Gamma-Rapho, чей снимок есть в Getty Images. Найти их можно по ссылкам ниже."
          en: "At least two photographers took pictures of them together that evening: Jean-Pierre Leloir, whose photograph is held in the Leloir archive and sold by the Paris gallery Polka, and Giancarlo Botti of Gamma-Rapho, whose image is available through Getty Images. You can find them at the links below."
        sources:
          - title: Polka — Bob Dylan et Françoise Hardy à l’Olympia (Jean-Pierre Leloir)
            url: https://www.polka.paris/factory/bob-dylan-et-francoise-hardy-a-l-olympia.htm
          - title: Getty Images 1272435131 — Françoise Hardy à l’Olympia avec Bob Dylan (Giancarlo Botti / Gamma-Rapho)
            url: https://www.gettyimages.co.uk/detail/news-photo/fran%C3%A7oise-hardy-%C3%A0-lolympia-avec-bob-dylan-qui-vient-dy-news-photo/1272435131
      - type: text
        text:
          ru: |
            У этой истории есть странный эпилог. В 2018 году Арди рассказала немецкому журналу Zeit, что ей недавно достались два черновика писем Дилана — любовных, так никогда и не отправленных. «Должно быть, он был сильно в меня влюблён», — сказала она. Откуда взялись эти листки и что в них, проверить не удалось. Взаимной переписки, во всяком случае, не было.

            А вот чего не было точно — это песен Дилана в её исполнении. Она перепевала Леонарда Коэна, Фила Окса, Нила Янга, Брассанса на стихи Арагона. Дилана — ни разу, по крайней мере ни на одной изданной пластинке. Он написал для неё стихи. Она пришла к нему в антракте. На этом их история и кончается.
          en: |
            The story has a curious epilogue. In 2018, Hardy told the German magazine Zeit that she had recently received two drafts of letters from Dylan—love letters that had never been sent. “He must have been very much in love with me,” she said. Where those pages came from, and what was in them, could not be verified. In any case, there was no correspondence between them.

            One thing there certainly was not: Hardy singing Dylan’s songs. She covered Leonard Cohen, Phil Ochs, Neil Young, and Brassens’s settings of Aragon’s poetry. Dylan, never—at least on any released record. He wrote poems for her. She came to see him during an intermission. That is where their story ends.
        sources:
          - title: "APA/dpa — Bob Dylans Briefe an Hardy: „Muss sehr in mich verliebt gewesen sein“, 02.05.2018"
            url: https://www.tt.com/artikel/14312904/bob-dylans-briefe-an-hardy-muss-sehr-in-mich-verliebt-gewesen-sein
          - title: Discographie de Françoise Hardy
            url: https://fr.wikipedia.org/wiki/Discographie_de_Fran%C3%A7oise_Hardy
