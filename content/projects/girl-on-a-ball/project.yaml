      {
       "x": 4,
       "y": 22,
       "w": 18,
       "h": 20,
       "title": {
        "ru": "Женщина, дети и собака",
        "en": "A woman, children and a dog"
       },
       "text": {
        "ru": "Слева, далеко, женщина в длинном платье держит младенца, рядом ребёнок в красном, ниже тёмная собака. Это, наверное, та же бродячая труппа. И никто из них, как и лошадь, не смотрит на трюк. Самое трудное, что есть на картине, происходит для одного-единственного зрителя.",
        "en": "On the left, far off, a woman in a long dress holds a baby, a child in red beside her and a dark dog below. Probably the same travelling troupe. And none of them, like the horse, watches the trick. The hardest thing in the picture happens for a single spectator."
