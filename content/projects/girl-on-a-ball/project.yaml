  {
   "id": "inside-another",
   "name": {
    "ru": "Картина в картине",
    "en": "A picture inside a picture"
   },
   "blocks": [
    {
     "type": "text",
     "text": {
      "ru": "Девочка на шаре родилась внутри другой картины. Весной 1905 года Пикассо работал над огромным полотном с бродячей труппой, которое теперь называется «Семейство комедиантов» и висит в Национальной галерее в Вашингтоне. Рентгенограммы и подготовительная акварель показывают, что в первом варианте там был ребёнок, балансирующий на шаре, а Арлекин стоял рядом, подбоченясь, и смотрел на него. Фернанда Оливье запомнила ту первую большую картину так: ребёнок пытается удержать равновесие на большом шаре, а холст переписывался несколько раз.\n\nПотом Пикассо этот эпизод записал, и в вашингтонской картине девочки на шаре больше нет. Под слоем краски там, кстати, есть и белая лошадь, а поверх шара видна нога другого ребёнка. Девочку он вынес на отдельный холст, а вместо Арлекина посадил рядом с ней атлета. Сохранились и перовые наброски: девочка, балансирующая на кубике, и этюд к самой картине.",
      "en": "The girl on the ball was born inside another painting. In spring 1905 Picasso was working on a huge canvas of a travelling troupe, now called Family of Saltimbanques, in the National Gallery in Washington. X-rays and a preparatory watercolour show that the first version had a child balancing on a ball, with Harlequin beside it, hands on hips, studying it. Fernande Olivier remembered that first large picture this way: a child is trying to balance on a large ball, and the canvas was repainted several times.\n\nThen Picasso painted the episode out, and the girl on the ball is gone from the Washington picture. Beneath its paint, incidentally, there is also a white horse, and a second child’s leg shows over the ball. He moved the girl to a canvas of her own and seated an athlete beside her instead of Harlequin. Pen sketches survive too: a girl balancing on a block, and a study for the painting itself."
     },
