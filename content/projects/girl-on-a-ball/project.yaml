       "y": 93,
       "w": 13,
       "h": 6,
       "title": {
        "ru": "Подпись",
        "en": "The signature"
       },
       "text": {
        "ru": "В правом нижнем углу тёмной краской: Picasso. Без даты. Ему двадцать три или двадцать четыре года, он беден и ещё не знает, что эту картину будут печатать на марках и чеканить на монетах в стране, где она окажется через восемь лет.",
