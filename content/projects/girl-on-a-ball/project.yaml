   "id": "earth-ball",
   "name": {
    "ru": "Девочка на шарике земном",
    "en": "A girl on the earthly ball"
   },
   "blocks": [
    {
     "type": "text",
     "text": {
      "ru": "В России у этой картины давно своя жизнь. Есть рассказ Виктора Драгунского «Девочка на шаре» из «Денискиных рассказов» и фильм 1966 года, хотя прямой связи рассказа с Пикассо мы не нашли. Евгений Евтушенко в 1967 году написал строчку «как девочка на шарике земном». В 2012 году Банк России отчеканил картину на серебряной монете к столетию Пушкинского музея, а Камила Валиева два сезона подряд выходила на лёд с короткой программой по мотивам «Девочки на шаре».\n\nСама картина за это время тоже поездила. В 2011 году её показали в мадридском Прадо, в 2018-м в парижском музее Орсе, а в 2021–2022 годах в Фонде Louis Vuitton на выставке коллекции Морозова, которую посмотрели больше миллиона двухсот тысяч человек. Весной 2022 года самолёты в Россию уже не летали, и картины везли домой на грузовиках пятнадцатью рейсами, через Бельгию, Германию и паромом через Финляндию. К маю все работы вернулись в музеи.",
      "en": "In Russia this painting has long had a life of its own. There is Viktor Dragunsky’s story The Girl on the Ball from the Deniska Stories and a 1966 film, though we found no direct link between the story and Picasso. In 1967 Yevgeny Yevtushenko wrote the line ‘like a girl on the earthly ball’. In 2012 the Bank of Russia struck the painting on a silver coin for the Pushkin Museum’s centenary, and Kamila Valieva skated two seasons running with a short programme inspired by the painting.\n\nThe painting itself has travelled too. In 2011 it was shown at the Prado in Madrid, in 2018 at the Musée d’Orsay in Paris, and in 2021–22 at the Fondation Louis Vuitton in the Morozov collection exhibition, seen by more than 1.2 million people. By spring 2022 planes no longer flew to Russia, and the paintings went home by truck in fifteen convoys, through Belgium, Germany and by ferry via Finland. By May every work was back in its museum."
     },
