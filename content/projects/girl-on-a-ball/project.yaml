   "id": "background",
   "name": {
    "ru": "Фон, который не смотрит",
    "en": "A background that does not look"
   },
   "blocks": [
    {
     "type": "text",
     "text": {
      "ru": "За двумя героями лежит пустой выжженный пейзаж розово-охристых холмов, а над ним зеленовато-серое небо. Подоксик видел в этих холмах гористую Испанию и бродячие труппы, которые Пикассо помнил с детства. В середине пасётся белая лошадь, слева далеко женщина с младенцем, ребёнок в красном и собака.\n\nАполлинер в 1905 году писал о бродячих акробатах Пикассо почти этими словами: среди привычных обезьян, белых лошадей и собак; звери учат их религиозной тайне; они совершают немые обряды с трудной ловкостью. А о девочках на шарах написал, что те повелевают этими сферами, как сияющим движением миров. Говорил ли он именно об этой картине, по тексту установить нельзя, но лучше о ней никто не сказал.\n\nОбратите внимание: никто на фоне не смотрит на трюк. Ни лошадь, ни мать, ни ребёнок, ни собака. Онлайн-журнал «Культура Москвы» прочитал это как невостребованность искусства. Для нас это знак того, что вся картина происходит между двумя людьми: самое трудное на свете она делает для одного-единственного зрителя.",
      "en": "Behind the two figures lies an empty scorched landscape of pinkish-ochre hills under a greenish-grey sky. Podoksik saw mountainous Spain in these hills and the travelling troupes Picasso remembered from childhood. In the middle a white horse grazes; far to the left a woman with a baby, a child in red and a dog.\n\nIn 1905 Apollinaire wrote of Picasso’s acrobats almost in these words: among familiar monkeys, white horses and dogs; the animals teach them religious mystery; they celebrate mute rites with difficult agility. Of the girls on the balls he wrote that they command these spheres with the radiant movement of worlds. Whether he meant this very painting cannot be established from the text, but no one has put it better.\n\nNotice that no one in the background watches the trick. Not the horse, not the mother, not the child, not the dog. The online magazine Kultura Moskvy read this as art going unwanted. For us it is a sign that the whole picture happens between two people: she does the hardest thing in the world for a single spectator."
     },
     "sources": [
      {
       "title": "G. Apollinaire — Les Peintres cubistes, 1913",
       "url": "https://archive.org/details/lespeintrescubis00apol"
