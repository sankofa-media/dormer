   "name": {
    "ru": "Из Парижа в Москву",
    "en": "From Paris to Moscow"
   },
   "blocks": [
    {
     "type": "text",
     "text": {
      "ru": "Первыми владельцами картины стали американцы Лео и Гертруда Стайн, брат и сестра, которые одними из первых начали покупать Пикассо. Когда именно и у кого они её купили, неизвестно, но на фотографии их парижской квартиры на улице Флёрюс, сделанной около 1907 года, «Девочка на шаре» уже висит на стене рядом с «Мальчиком, ведущим лошадь».\n\nВ 1913 году брат и сестра поссорились и делили коллекцию. Торговец Даниэль-Анри Канвейлер оценил «Девочку на шаре» в десять тысяч франков. 17 октября 1913 года Гертруда отдала её Канвейлеру вместе с двумя другими ранними работами в обмен на новую кубистическую картину Пикассо «Человек с гитарой». Похоже, новый Пикассо интересовал её уже больше прежнего.\n\nКанвейлер сразу перепродал «Девочку» московскому промышленнику Ивану Морозову. Сколько тот заплатил, источники расходятся: тринадцать или шестнадцать тысяч франков. Для сравнения, «Странствующих гимнастов» Пикассо Морозов купил у Воллара всего за триста. За всю жизнь у Морозова было только три картины Пикассо, а у его соперника Сергея Щукина около пятидесяти.",
      "en": "The first owners were the Americans Leo and Gertrude Stein, brother and sister, among the first to buy Picasso. When and from whom they bought it is unknown, but in a photograph of their Paris flat on the rue de Fleurus taken around 1907 the girl on the ball already hangs on the wall beside Boy Leading a Horse.\n\nIn 1913 the siblings fell out and divided the collection. The dealer Daniel-Henry Kahnweiler valued the girl on the ball at ten thousand francs. On 17 October 1913 Gertrude gave it to Kahnweiler with two other early works in exchange for Picasso’s new Cubist Man with a Guitar. The new Picasso, it seems, now interested her more than the old.\n\nKahnweiler immediately resold the girl to the Moscow industrialist Ivan Morozov. Sources disagree on what he paid: thirteen or sixteen thousand francs. For comparison, Morozov had bought Picasso’s Two Acrobats from Vollard for just three hundred. In all, Morozov owned only three Picassos; his rival Sergei Shchukin had about fifty."
     },
     "sources": [
      {
       "title": "Enrique Mallen — Reaching for Success: Picasso’s Rise in the Market, Arts, 2017",
