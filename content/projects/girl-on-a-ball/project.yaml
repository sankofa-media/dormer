       "w": 34,
       "h": 11,
       "title": {
        "ru": "Руки",
        "en": "The hands"
       },
       "text": {
        "ru": "Пальцы раскрыты, левая рука выше правой. Посмотрите на небо вокруг рук: краска здесь лежит так тонко, что сквозь неё проступает плетение холста, а контур кисти обведён тёмной линией прямо поверх живописи. Пикассо рисует кистью, как карандашом.",
        "en": "The fingers are spread, the left hand higher than the right. Look at the sky around the hands: the paint is so thin here that the weave of the canvas shows through, and the outline of the hand is drawn in a dark line right over the painting. Picasso draws with the brush as with a pencil."
       }
      },
      {
