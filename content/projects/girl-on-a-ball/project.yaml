  {
   "id": "storage",
   "name": {
    "ru": "Запасники и очередь",
    "en": "Storerooms and a queue"
   },
   "blocks": [
    {
     "type": "text",
     "text": {
      "ru": "Через пять лет после покупки собрание Морозова национализировали. В 1919 году оно стало музеем, а самого Морозова назначили заместителем хранителя собственной коллекции, и весной того же года он навсегда уехал из России. Потом собрания Морозова и Щукина объединили в Государственный музей нового западного искусства.\n\nВ 1948 году этот музей закрыли как рассадник формализма, а его картины разделили между Пушкинским музеем и Эрмитажем. Так «Девочка на шаре» попала в Пушкинский музей, но не в залы, а в запасники: Пикассо в те годы не показывали.\n\nВ октябре 1956 года, в оттепель, Илья Эренбург добился выставки Пикассо к его семидесятипятилетию. «Девочку на шаре» повесили в самом центре как самую бесспорную картину: ранний, человечный Пикассо был понятен и приемлем даже для чиновников. По пересказу Леонида Парфёнова, Эренбург успокаивал толпу у дверей: ждали этой выставки двадцать пять лет, подождите теперь спокойно ещё двадцать пять минут. А в 1971 году картина вышла на советской почтовой марке и на афише выставки «Пикассо в советских музеях» в Париже, впервые вернувшись в город, где была написана.",
      "en": "Five years after the purchase Morozov’s collection was nationalised. In 1919 it became a museum, Morozov himself was appointed deputy curator of his own collection, and that spring he left Russia for good. Later the Morozov and Shchukin collections were merged into the State Museum of New Western Art.\n\nIn 1948 that museum was closed as a breeding ground of formalism and its paintings divided between the Pushkin Museum and the Hermitage. So the girl on the ball reached the Pushkin — not its galleries but its storerooms: Picasso was not shown in those years.\n\nIn October 1956, during the Thaw, Ilya Ehrenburg secured a Picasso exhibition for the artist’s seventy-fifth birthday. The girl on the ball hung right in the centre as the least controversial work: the early, humane Picasso was understandable and acceptable even to officials. As Leonid Parfyonov retells it, Ehrenburg calmed the crowd at the door: you waited twenty-five years for this exhibition, now wait calmly another twenty-five minutes. And in 1971 the painting appeared on a Soviet postage stamp and on the poster of the exhibition Picasso in Soviet Museums in Paris, returning for the first time to the city where it was painted."
     },
