  {
   "id": "technique",
   "name": {
    "ru": "Матовость фрески",
    "en": "The mattness of a fresco"
   },
   "blocks": [
    {
     "type": "text",
     "text": {
      "ru": "В 1905 году поэт Гийом Аполлинер, только что подружившийся с Пикассо, написал о его новых картинах, что у этого цвета матовость фресок, а линии твёрдые. Пушкинский музей относит эти слова прямо к «Девочке на шаре», и, если подойти к холсту близко, понятно почему. Краска лежит тонким, матовым, почти сухим слоем, и в небе вокруг поднятых рук девочки сквозь неё проступает плетение холста. Нигде нет блеска и густых мазков.\n\nВторое, что видно вблизи, — рисунок. Контуры рук, кистей и лица девочки обведены тёмной линией прямо поверх живописи, как карандашом. А спина атлета, наоборот, вылеплена широкими протёртыми мазками с тёмными заливками в тенях. Её Пикассо не рисует, а лепит.\n\nИ третье — цвет. На всю картину у Пикассо всего две пары красок: тёплая розово-охристая, из которой сделаны земля и тело атлета, и холодная голубая, из которой сделаны трико девочки, ткань на кубе и небо. Пушкинский музей замечает, что пейзаж написан почти теми же пепельными розовато-голубоватыми оттенками, что и фигуры, и от этого стирается разница между людьми и землёй. Ярких точек всего две: красный цветок в волосах девочки и красная одежда ребёнка вдалеке.",
      "en": "In 1905 the poet Guillaume Apollinaire, newly befriended by Picasso, wrote of his new paintings that the colour has the mattness of frescoes and the lines are firm. The Pushkin Museum applies these words directly to the girl on the ball, and up close you see why. The paint lies in a thin, matt, almost dry layer, and in the sky around the girl’s raised arms the canvas weave shows through. There is no gloss and no thick impasto anywhere.\n\nThe second thing visible up close is drawing. The outlines of the girl’s arms, hands and face are traced with a dark line over the paint, as if with a pencil. The athlete’s back, by contrast, is modelled with broad, rubbed strokes and dark washes in the shadows. Picasso does not draw it; he sculpts it.\n\nAnd the third is colour. For the whole painting Picasso has essentially two pairs of colours: a warm pinkish ochre for the earth and the athlete’s body, and a cool blue for the girl’s leotard, the cloth on the cube and the sky. The Pushkin Museum notes that the landscape is painted in almost the same ashen pinkish-bluish tones as the figures, blurring the difference between people and land. There are only two bright spots: the red flower in the girl’s hair and the red clothes of the child far away."
     },
     "sources": [
      {
       "title": "G. Apollinaire — Les Peintres cubistes, 1913 (reprint of La Plume, 15.05.1905)",
       "url": "https://archive.org/details/lespeintrescubis00apol"
      },
      {
       "title": "ГМИИ — «Девочка на шаре»",
       "url": "https://pushkinmuseum.art/data/fonds/europe_and_america/j/1001_2000/zh_3399/index.php"
      }
     ]
    },
    {
     "type": "quote",
     "text": {
      "ru": "Цвет его картин обладает матовостью фресок, линии твёрдые.",
      "en": "The colour has the mattness of frescoes; the lines are firm."
     },
     "attribution": "Гийом Аполлинер, 1905",
     "source": {
      "title": "G. Apollinaire, Les Peintres cubistes, 1913",
      "url": "https://archive.org/details/lespeintrescubis00apol"
     }
    }
   ]
  },
  {
   "id": "ball-and-cube",
   "name": {
    "ru": "Шар и куб",
    "en": "The ball and the cube"
   },
   "blocks": [
    {
     "type": "text",
     "text": {
      "ru": "На картине всего две геометрические фигуры, и обе несут смысл. Шар — то, на чём невозможно устоять: он всё время катится, и равновесие на нём длится секунды. Куб — то, с чего невозможно сдвинуться: он тяжёл, устойчив и срезан краем холста, будто уходит за раму и врос в землю.\n\nАнатолий Бабин увидел здесь старую эмблему: в эпоху Возрождения говорили, что престол Фортуны круглый, а престол Доблести квадратный. Фортуна, удача, стоит на шаре, потому что удача непостоянна; Доблесть сидит на кубе, потому что она надёжна. Американский искусствовед Мейер Шапиро прочитал картину иначе: равновесие акробата для него — образ работы самого художника, который всё время выверяет линии и массы. А автор каталога вашингтонской выставки 1980 года Э. А. Кармин сформулировал главное противопоставление этой пары тремя парами слов: изящество и сила, лёгкое и тяжёлое, исполнитель и наблюдатель.",
      "en": "There are only two geometric shapes in the painting, and both carry meaning. The ball is something you cannot stand still on: it keeps rolling, and balance on it lasts seconds. The cube is something you cannot move from: heavy, stable, cut by the edge of the canvas as if it went beyond the frame and grew into the earth.\n\nAnatoly Babin saw an old emblem here: in the Renaissance it was said that the seat of Fortune is round and the seat of Virtue square. Fortune, luck, stands on a ball because luck is fickle; Virtue sits on a cube because it is reliable. The American art historian Meyer Schapiro read it differently: the acrobat’s balance is for him an image of the artist’s own work, constantly adjusting lines and masses. And the author of the 1980 Washington exhibition catalogue, E. A. Carmean, framed the pair’s central opposition in three pairs of words: grace and strength, light and heavy, actor and observer."
     },
     "sources": [
      {
       "title": "E. A. Carmean Jr. — Picasso: The Saltimbanques, NGA, 1980",
       "url": "https://www.nga.gov/content/dam/ngaweb/research/publications/pdfs/picasso-the-saltimbanques.pdf"
      },
      {
       "title": "Девочка на шаре — ru.wikipedia",
       "url": "https://ru.wikipedia.org/wiki/Девочка_на_шаре"
      }
     ]
    },
    {
     "type": "quote",
     "text": {
      "ru": "Изящество и сила, лёгкое и тяжёлое, исполнитель и наблюдатель.",
      "en": "Grace and strength, light and heavy, actor and observer."
     },
     "attribution": "Э. А. Кармин, 1980",
     "source": {
      "title": "E. A. Carmean Jr., Picasso: The Saltimbanques, 1980",
      "url": "https://www.nga.gov/content/dam/ngaweb/research/publications/pdfs/picasso-the-saltimbanques.pdf"
     }
    }
   ]
  },
  {
   "id": "him",
   "name": {
    "ru": "Он",
    "en": "Him"
   },
   "blocks": [
    {
     "type": "text",
     "text": {
      "ru": "Официальное прочтение Пушкинского музея такое. Атлет подобен египетскому фараону, царственно восседающему на кубе. Хрупкость девочки подчёркивает его силу, а его сила как бы защищает её от жестокости действительности. Бродячие акробаты — изгои, и они нужны друг другу: это мир людей, которые нуждаются друг в друге. Искусствовед Нина Дмитриева называла такую труппу идеальной моделью семьи.\n\nМы прочитаем его иначе, и это наше прочтение, а не музейное. Посмотрите ещё раз на его позу. Фараон сидел бы прямо, а этот человек сидит, подавшись вперёд, плечи опущены, голова мала для такой спины и утоплена в тени. Рука не держит, не готова подхватить, просто лежит на колене. Вся огромная сила, которую Пикассо так подчеркнул, сейчас ни на что не направлена. Это сила человека, который устал её носить.\n\nИ тогда картина становится историей о привязанности — той, где он смотрит на неё снизу, тяжёлый, неподвижный, придавленный собственным весом, а она стоит над ним на шаре, невесомая, вся в усилии не упасть, и даже не смотрит на него. Она держит равновесие сама. Он только смотрит. Может быть, это он и держится за неё — за то, что в мире ещё бывает такая лёгкость. Музей видит защитника. Нам видится человек, которого держит на земле только то, что она есть.",
      "en": "The Pushkin Museum’s official reading is this. The athlete is like an Egyptian pharaoh sitting regally on the cube. The girl’s fragility underlines his strength, and his strength seems to shield her from the cruelty of reality. Travelling acrobats are outcasts and need one another: a world of people who need each other. The art historian Nina Dmitrieva called such a troupe an ideal model of a family.\n\nWe will read him differently, and this is our reading, not the museum’s. Look at his posture again. A pharaoh would sit upright; this man sits leaning forward, shoulders lowered, his head small for such a back and sunk in shadow. His hand does not hold, is not ready to catch — it just lies on his knee. All the enormous strength Picasso so stressed is directed at nothing. It is the strength of a man tired of carrying it.\n\nAnd then the painting becomes a story of attachment — where he looks up at her, heavy, still, pressed down by his own weight, while she stands above him on the ball, weightless, all effort not to fall, and does not even look at him. She keeps her balance herself. He only watches. Perhaps it is he who holds on to her — to the fact that such lightness still exists in the world. The museum sees a protector. We see a man held on earth only by the fact that she exists."
     },
     "sources": [
      {
       "title": "ГМИИ — «Девочка на шаре»",
       "url": "https://pushkinmuseum.art/data/fonds/europe_and_america/j/1001_2000/zh_3399/index.php"
      },
      {
       "title": "Вокруг света — «А был ли мальчик»",
