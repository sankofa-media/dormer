   "blocks": [
    {
     "type": "text",
     "text": {
      "ru": "Это одна из самых известных картин в России. Её видели на марках, монетах, в учебниках и на плакатах, под неё катались фигуристки, а «Девочкой на шаре» называется и рассказ Драгунского. Пикассо написал её в Париже в 1905 году, когда ему было двадцать три года, и с 1913 года она живёт в Москве, сейчас в Пушкинском музее.\n\nНа картине двое. Тонкая девочка-акробатка балансирует на шаре, вся вытянутая вверх, лёгкая, почти бесплотная. А рядом, спиной к нам, сидит на тяжёлом кубе огромный атлет. Он сильнее всех на этой картине и, наверное, во всей бродячей труппе. Но сидит он так, будто эта сила ему давно ни к чему: плечи опущены, лицо в тени, рука лежит на колене.\n\nМы будем смотреть на эту картину как на историю о привязанности и заботе — не взрослой любви, а той, что бывает между ребёнком и взрослым, который рядом. О той, где один лёгкий и воздушный, а другой тяжёлый, усталый и сломленный при всей своей силе, и где неизвестно, кто кого держит. Сразу оговоримся: так её читаем мы. Пушкинский музей видит атлета иначе, как царственного защитника, и мы ещё дойдём до этого спора. Но сначала просто посмотрим на картину, деталь за деталью. Листайте вниз, и картина будет приближаться к тому, о чём идёт речь.",
      "en": "It is one of the best-known paintings in Russia. People have seen it on stamps, coins, in textbooks and on posters, figure skaters have skated to it, and a Dragunsky story shares its title. Picasso painted it in Paris in 1905, aged twenty-three, and since 1913 it has lived in Moscow, now in the Pushkin Museum.\n\nThere are two people in it. A slender girl acrobat balances on a ball, stretched upwards, light, almost bodiless. And beside her, with his back to us, a huge athlete sits on a heavy cube. He is the strongest figure in the picture and probably in the whole travelling troupe. Yet he sits as if that strength had long been of no use to him: shoulders lowered, face in shadow, hand on his knee.\n\nWe will look at this painting as a story of attachment and care — not adult love, but the kind that exists between a child and the grown-up beside her. The kind where one is light and airy and the other heavy, tired and broken for all his strength, and where it is unclear who holds whom. A caveat up front: this is our reading. The Pushkin Museum sees the athlete differently, as a regal protector, and we will come to that argument. But first, let us simply look at the painting, detail by detail. Scroll down and the picture will move closer to whatever is being discussed."
     },
