   "blocks": [
    {
     "type": "text",
     "text": {
      "ru": "В 1904 году Пикассо окончательно перебрался из Барселоны в Париж и поселился на Монмартре, в доме, который прозвали Бато-Лавуар, «плавучая прачечная». Пушкинский музей описывает его как причудливый дом, состоящий только из чердаков и подвалов. Там же, в 1904-м, он познакомился с Фернандой Оливье, которая стала его возлюбленной на следующие годы.\n\nТолько что закончился его голубой период: нищие, слепые, больные, всё написано холодным синим цветом. Его друг Хайме Сабартес вспоминал, что Пикассо тогда верил, будто искусство рождается из печали и боли. А теперь в картинах появились розовые и охристые тона, и вместо нищих — бродячие акробаты, арлекины и циркачи.\n\nЦирк был совсем рядом, у подножия Монмартра: цирк Медрано. Пикассо потом вспоминал, что был по-настоящему околдован цирком и иногда приходил туда по три-четыре вечера в неделю. Гертруда Стайн писала, что вся их компания встречалась в Медрано по крайней мере раз в неделю и водила знакомство с клоунами, жонглёрами и наездниками. Фернанда Оливье добавляла, что Пикассо клоунами восхищался и по-настоящему им сочувствовал. Американский исследователь Э. А. Кармин даже предполагал, что «розовый» период назван так в честь розового шатра Медрано, но это только гипотеза.",
      "en": "In 1904 Picasso moved from Barcelona to Paris for good and settled in Montmartre, in a building nicknamed the Bateau-Lavoir, the ‘laundry boat’. The Pushkin Museum describes it as a whimsical house made only of attics and cellars. There, in 1904, he met Fernande Olivier, who became his lover for the years that followed.\n\nHis Blue Period had just ended: beggars, the blind, the sick, all painted in cold blue. His friend Jaime Sabartés recalled that Picasso then believed art was born of sadness and pain. Now pink and ochre tones appeared, and instead of beggars came travelling acrobats, harlequins and circus people.\n\nThe circus was close by, at the foot of Montmartre: the Médrano. Picasso later recalled that he was really under the spell of the circus and sometimes came three or four nights a week. Gertrude Stein wrote that their whole crowd met at the Médrano at least once a week and befriended the clowns, jugglers and riders. Fernande Olivier added that Picasso admired the clowns and had real sympathy for them. The American scholar E. A. Carmean even suggested the Rose Period might owe its name to the pink tent of the Médrano, though that is only a hypothesis."
     },
