  {
   "id": "reverse",
   "name": {
    "ru": "Оборотная сторона",
    "en": "The other side"
   },
   "blocks": [
    {
     "type": "text",
     "text": {
      "ru": "Самая неожиданная история этой картины спрятана с другой стороны холста. Реставраторы Пушкинского музея называют холст «перелицованным»: на его обороте есть другое, незаконченное изображение. Искусствовед Анатолий Бабин рассказывает подробнее. Холст сначала служил для мужского портрета, написанного раньше, а потом Пикассо перевернул его и написал «Девочку на шаре» на оборотной стороне. Биограф Ричардсон объяснял это просто: художник был беден и экономил.\n\nСорок лет спорили, кто на этом портрете. В 1979 году хранитель Пикассо в Пушкинском музее Марина Бессонова передала Бабину рентгенограммы. Бабин был уверен, что это баскский художник Франсиско Итуррино, с которым Пикассо летом 1901 года выставлялся у знаменитого торговца Воллара. Бессонова и ленинградский искусствовед Анатолий Подоксик считали, что это отец художника, Хосе Руис Бласко. Решающим доводом оказалась фотография 1901 года из книги Ричардсона, на которой Пикассо сидит в мастерской на фоне того самого портрета Итуррино. По словам Бабина, в каталоге музея 2001 года Бессонова согласилась с этой версией.\n\nЕсть у оборота и практическое следствие. Красочный слой у картины хрупкий, он боится влажности и вибрации. Перед выставкой в Париже в 2018 году в музее всерьёз сомневались, можно ли вообще её выпускать, и реставраторы сделали для перевозки специальную систему крепления.",
      "en": "The most unexpected story of this painting is hidden on the other side of the canvas. The Pushkin Museum’s conservators call the canvas ‘turned’: on its reverse is another, unfinished image. The art historian Anatoly Babin tells more. The canvas first served for an earlier portrait of a man; then Picasso turned it over and painted the girl on the ball on the back. Richardson explained it simply: the artist was poor and saved money.\n\nFor forty years people argued about who was in the portrait. In 1979 the Pushkin’s Picasso curator Marina Bessonova gave Babin the X-rays. Babin was sure it was the Basque painter Francisco Iturrino, with whom Picasso had exhibited at the dealer Vollard’s in summer 1901. Bessonova and the Leningrad art historian Anatoly Podoksik believed it was the artist’s father, José Ruiz Blasco. The decisive evidence was a 1901 photograph in Richardson’s book showing Picasso in his studio in front of that very portrait of Iturrino. According to Babin, Bessonova accepted this version in the museum’s 2001 catalogue.\n\nThe reverse has a practical consequence too. The paint layer is fragile and sensitive to humidity and vibration. Before the Paris exhibition of 2018 the museum seriously doubted whether it could be lent at all, and the conservators built a special mounting system for the journey."
     },
     "sources": [
      {
       "title": "ГМИИ, отдел реставрации — «Путешествие „Девочки на шаре“», 2018",
       "url": "https://conservation.pushkinmuseum.art/news/archive/2018/devochka_na_share/"
      },
      {
       "title": "А. А. Бабин // «Пикассо сегодня». Коллективная монография. М.: Прогресс-Традиция, 2015",
       "url": "https://www.pushkinmuseum.art"
      }
     ]
    }
   ]
