    {
     "type": "text",
     "text": {
      "ru": "Откуда поза? Ричардсон связывал её с бронзовой статуэткой берлинского скульптора Йоханнеса Гётца «Мальчик, балансирующий на шаре», модель 1888 года, — её отливка есть в той же Национальной галерее в Вашингтоне. Стоять так, как стоит девочка, можно лишь несколько секунд, поэтому писать её с живой модели было бы почти невозможно. Кто позировал для девочки и для атлета, неизвестно; Ричардсон полагал, что атлетом мог быть кто-то из знакомых по Медрано.",
      "en": "Where does the pose come from? Richardson linked it to a bronze by the Berlin sculptor Johannes Götz, Boy Balancing on a Ball, modelled in 1888, a cast of which is in the same National Gallery in Washington. One can stand as the girl stands for only a few seconds, so painting her from a live model would have been nearly impossible. Who posed for the girl and the athlete is unknown; Richardson thought the athlete might have been a Médrano acquaintance."
