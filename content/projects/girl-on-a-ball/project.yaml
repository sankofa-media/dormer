     "caption": {
      "ru": "Пабло Пикассо, «Семейство комедиантов», 1905. Национальная галерея искусства, Вашингтон. В первом варианте здесь была девочка на шаре.",
      "en": "Pablo Picasso, Family of Saltimbanques, 1905. National Gallery of Art, Washington. The first version included the girl on the ball."
