        "en": "The ball"
       },
       "text": {
        "ru": "Шар тёмный, тяжёлый, нижняя половина почти сливается с землёй. Ступни касаются его в одной точке. Такую позу невозможно держать дольше нескольких секунд, поэтому её почти наверняка писали не с натуры: биограф Пикассо Джон Ричардсон искал её источник в берлинской бронзовой статуэтке «Мальчик, балансирующий на шаре».",
        "en": "The ball is dark and heavy, its lower half almost merging with the ground. The feet touch it at a single point. No one can hold such a pose for more than a few seconds, so it was almost certainly not painted from life: Picasso’s biographer John Richardson looked for its source in a Berlin bronze, Boy Balancing on a Ball."
       }
      },
      {
       "x": 54,
       "y": 14,
       "w": 26,
       "h": 18,
       "title": {
        "ru": "Его лицо",
        "en": "His face"
       },
       "text": {
        "ru": "Атлет сидит к нам спиной, голова повёрнута в профиль, к ней. Лицо почти целиком в тени: тёмный глаз, сжатые губы, маленькая для такого тела голова. Он смотрит на девочку, но в этом взгляде нет ни восхищения, ни строгости, только усталое внимание.",
        "en": "The athlete sits with his back to us, head turned in profile towards her. His face is almost entirely in shadow: a dark eye, pressed lips, a head small for such a body. He watches the girl, but there is neither admiration nor sternness in his gaze, only weary attention."
       }
      },
      {
       "x": 50,
       "y": 26,
       "w": 48,
       "h": 34,
       "title": {
        "ru": "Спина",
        "en": "The back"
       },
       "text": {
        "ru": "Спина занимает почти половину первого плана. Она розово-охристая, как выжженная земля за ним, и вылеплена широкими протёртыми мазками с тёмными пятнами в тенях. Пикассо нарочно увеличил его: сидящий атлет головой почти достаёт до груди стоящей на шаре девочки. Это не тело, а скала.",
        "en": "The back takes up almost half of the foreground. It is pinkish ochre, like the scorched earth behind him, modelled with broad, rubbed strokes and dark patches in the shadows. Picasso enlarged him on purpose: seated, the athlete’s head almost reaches the chest of the girl standing on her ball. This is not a body but a rock."
       }
      },
      {
       "x": 42,
       "y": 46,
       "w": 18,
       "h": 14,
       "title": {
        "ru": "Рука на колене",
        "en": "A hand on the knee"
       },
       "text": {
        "ru": "Его рука просто лежит на колене. Вся сила, которая есть в этом теле, сейчас ни на что не направлена. Он не готовится поймать её, если она упадёт, и не помогает ей стоять. Он сидит.",
        "en": "His hand simply rests on his knee. All the strength in that body is directed at nothing right now. He is not preparing to catch her if she falls, nor helping her stand. He sits."
       }
      },
      {
       "x": 42,
       "y": 60,
       "w": 58,
       "h": 39,
       "title": {
        "ru": "Куб",
        "en": "The cube"
       },
       "text": {
        "ru": "Под ним тяжёлый серо-бурый куб, правый край которого срезан рамой. Голубая ткань свисает с куба и рифмуется с трико девочки: это единственное, что их связывает по цвету. Шар неустойчив, куб неподвижен. На одном нельзя устоять, с другого невозможно сдвинуться.",
        "en": "Beneath him is a heavy grey-brown cube, its right edge cut off by the frame. The blue cloth hanging from it rhymes with the girl’s leotard: the only colour that connects them. The ball is unstable; the cube is immovable. On one you cannot stand still; from the other you cannot move."
       }
      },
      {
       "x": 39,
       "y": 21,
       "w": 17,
       "h": 9,
       "title": {
        "ru": "Белая лошадь",
        "en": "The white horse"
       },
       "text": {
        "ru": "В середине пустого выжженного пейзажа пасётся белая лошадь, опустив голову. Белые лошади были в цирке Медрано, куда Пикассо ходил по нескольку вечеров в неделю, и Аполлинер в 1905 году писал о белых лошадях среди акробатов. Лошадь на них не смотрит.",
        "en": "In the middle of the empty scorched landscape a white horse grazes, head lowered. There were white horses at the Médrano circus, where Picasso went several evenings a week, and in 1905 Apollinaire wrote of white horses among the acrobats. The horse does not look at them."
