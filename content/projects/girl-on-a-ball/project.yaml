       "text": {
        "ru": "Девочка стоит на шаре на самых носках, ступни почти сомкнуты, обе руки подняты над головой. Фигура вытянута сильнее, чем бывает у живых людей, и от этого кажется, что она весит не больше, чем воздух вокруг неё. Трико голубое, как небо в просветах, — из тех же красок, что и всё небесное на картине.",
        "en": "The girl stands on the ball on the very tips of her toes, feet almost together, both arms raised above her head. The figure is stretched further than living bodies are, so she seems to weigh no more than the air around her. Her leotard is blue, like the sky between the clouds, painted with the same colours as everything heavenly in the picture."
       }
      },
      {
       "x": 17,
       "y": 9,
       "w": 16,
       "h": 13,
       "title": {
        "ru": "Цветок и взгляд вниз",
        "en": "A flower and a downward glance"
       },
       "text": {
        "ru": "В волосах у неё красный цветок, одна из двух самых ярких точек на всём холсте. Голова наклонена, взгляд опущен: она смотрит не на зрителя и не на него, а под ноги, туда, где решается, упадёт она или нет. Её лёгкость — это сосредоточенность.",
        "en": "In her hair is a red flower, one of the two brightest spots on the whole canvas. Her head is bent, her eyes lowered: she looks neither at us nor at him, but at her feet, where it is being decided whether she will fall. Her lightness is concentration."
       }
      },
