    {
     "type": "text",
     "text": {
      "ru": "Сам Пикассо об этой картине, насколько удалось найти, ничего не говорил. Он вообще не любил объяснять свои работы и однажды сказал, что перемена не означает развития: если художник меняет манеру, значит, изменился его способ мыслить. Через пару лет после «Девочки на шаре» он напишет «Авиньонских девиц» и больше никогда не вернётся к этим тихим розовым акробатам.\n\nА они остались на холсте, двое на пустой земле: он на кубе, она на шаре. Сто двадцать лет она держит равновесие, и сто двадцать лет он на неё смотрит.",
      "en": "Picasso himself, as far as we could find, said nothing about this painting. He disliked explaining his work and once said that variation does not mean evolution: if an artist changes his manner, it means his way of thinking has changed. A couple of years after the girl on the ball he would paint Les Demoiselles d’Avignon and never return to these quiet pink acrobats.\n\nAnd they remained on the canvas, two people on empty ground: he on the cube, she on the ball. For a hundred and twenty years she has kept her balance, and for a hundred and twenty years he has watched her."
